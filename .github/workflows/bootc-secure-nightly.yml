name: Bootc Secure Nightly Validation

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Profile to validate
        required: false
        default: rotate
        type: choice
        options: [rotate, cayo, snow, snowfield]

permissions: {}

concurrency:
  group: bootc-secure-nightly
  cancel-in-progress: false

jobs:
  fixtures:
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
    permissions:
      contents: read
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
      - name: Redirect temp to /mnt
        run: |
          sudo mkdir -p /mnt/tmp /mnt/var-tmp
          sudo chmod 1777 /mnt/tmp /mnt/var-tmp
          sudo mount --bind /mnt/var-tmp /var/tmp
          echo "TMPDIR=/mnt/tmp" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Select profile
        id: profile
        env:
          PROFILE_INPUT: ${{ inputs.profile }}
        run: |
          if [[ -n "$PROFILE_INPUT" && "$PROFILE_INPUT" != rotate ]]; then
            profile="$PROFILE_INPUT"
          else
            case "$(date -u +%u)" in
              7) profile=snowfield ;;
              2|4|6) profile=cayo ;;
              *) profile=snow ;;
            esac
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
      - name: Validate bootc publication guard
        run: ./check-bootc-publication-guard.sh
      - name: Validate bootc publication guard fixtures
        run: ./test/bootc-publication-guard-test.sh
      - name: Validate bootc release predecessor fixtures
        run: ./test/bootc-release-predecessor-test.sh
      - name: Validate bootc secure artifact fixtures
        run: ./test/bootc-secure-artifact-test.sh --fixtures
      - name: Validate bootc secure mutation fixtures
        run: ./test/bootc-secure-artifact-negative-test.sh --fixtures
      - name: Validate bootc secure package cleanup
        run: ./test/bootc-secure-package-cleanup-test.sh
      - name: Validate bootc container policy
        run: ./test/bootc-container-policy-test.sh
      - name: Validate bootloader reconciliation
        run: ./test/bootc-bootloader-reconcile-test.sh
      - name: Validate secure installer contract
        run: ./test/bootc-secure-install-contract-test.sh
      - name: Validate secure install harness fixtures
        run: ./test/bootc-secure-install-test.sh --fixtures
      - name: Validate secure update harness fixtures
        run: ./test/bootc-secure-update-test.sh --fixtures
      - name: Validate secure rotation harness fixtures
        run: ./test/bootc-secure-rotation-test.sh --fixtures
      - name: Validate remote publication fixtures
        run: ./test/bootc-secure-publication-test.sh
      - name: Validate authenticated promotion fixtures
        run: ./test/bootc-secure-promotion-test.sh

  live-full-window:
    needs: fixtures
    runs-on: [self-hosted, linux, x64, bootc-secure]
    timeout-minutes: 360
    permissions:
      contents: read
      # The update leg's publisher advances a tracking tag with `skopeo copy`,
      # a real registry write. Job-scoped so no standing credential lands on
      # the runner host.
      packages: write
    steps:
      - name: Check and reclaim disk space
        run: |
          set -euo pipefail
          available_kb() {
            df -Pk / | awk 'NR == 2 { print $4 }'
          }

          echo "=== Disk space before cleanup ==="
          df -h /
          before_kb=$(available_kb)
          [[ $before_kb =~ ^[0-9]+$ ]] || {
            echo "::error::Could not determine available disk space on the runner." >&2
            exit 1
          }

          command -v podman >/dev/null || {
            echo "::error::Podman is not installed on the bootc-secure runner." >&2
            exit 1
          }
          containers=$(podman ps --all --quiet)
          if [[ -n $containers ]]; then
            while IFS= read -r container; do
              podman rm --force "$container"
            done <<< "$containers"
          fi
          podman system prune --all --force

          echo "=== Disk space after cleanup ==="
          df -h /
          after_kb=$(available_kb)
          [[ $after_kb =~ ^[0-9]+$ ]] || {
            echo "::error::Could not determine available disk space after cleanup." >&2
            exit 1
          }

          min_kb=$((10 * 1024 * 1024))
          if ((after_kb < min_kb)); then
            echo "::error::Insufficient disk space: $((after_kb / 1024)) MiB available; 10240 MiB required." >&2
            echo "::error::Runner 'selfie-bootc-secure' needs manual cleanup; see issue #618." >&2
            exit 1
          fi
          echo "Disk space OK: $((after_kb / 1024)) MiB available."
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Run the secure window in a container
        env:
          PROFILE: ${{ needs.fixtures.outputs.profile }}
          STATE_ROOT: ${{ vars.BOOTC_SECURE_STATE_ROOT || '/var/lib/ghrunner/state-root' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DAKOTA_REF: main
          WINDOW_LOG: /var/tmp/bootc-secure-nightly.log
        run: |
          set -euo pipefail
          if [[ ! -d "$STATE_ROOT" ]]; then
            echo "BLOCKED: $STATE_ROOT is not staged on this runner." >&2
            echo "Run shared/bootc-secure/ci/stage-state-root.sh there first." >&2
            exit 2
          fi
          ./shared/bootc-secure/ci/run-window-in-container.sh

      - name: Upload harness logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootc-secure-nightly-${{ needs.fixtures.outputs.profile }}
          path: /var/tmp/bootc-secure-nightly.log
          retention-days: 14
          if-no-files-found: ignore
