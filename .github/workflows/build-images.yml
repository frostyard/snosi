name: Build Image Variants

on:
  repository_dispatch:
    types:
      - build
  push:
    branches: [main]
    paths-ignore:
      # Sysext-only dependency metadata should rebuild/publish sysexts via
      # build.yml without spending the OCI image matrix.
      - "shared/download/package-versions.json"
      - "latest-versions.txt"
      - "shared/download/sysext-checksums.json"
      # Documentation, agent context, and the standalone redirect worker do
      # not change image inputs or the image validation scripts.
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"
      - ".knowledge/**"
      - ".memory/**"
      - "docs/**"
      - "skills/**"
      - "workers/**"
      - ".github/workflows/deploy-native-installer-redirect.yml"
      # Workflows that never run on push/PR (scheduled, dispatch-only, or
      # issue/review-event) and repository metadata cannot affect this
      # workflow's inputs.
      - ".github/workflows/ai-fix-requested.yml"
      - ".github/workflows/bootc-secure-nightly.yml"
      - ".github/workflows/build-mechanics.yml"
      - ".github/workflows/check-dependencies.yml"
      - ".github/workflows/check-packages.yml"
      - ".github/workflows/claude.yml"
      - ".github/workflows/copilot-review-apply.yml"
      - ".github/workflows/native-nightly.yml"
      - ".github/workflows/nightly-compliance.yml"
      - ".github/workflows/scorecard.yml"
      - ".github/workflows/test-install.yml"
      - ".github/workflows/triage.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/prompts/**"
      - ".github/actionlint.yaml"
      - ".github/auto-qa-tuning.json"
      - ".github/dependabot.yml"
      - ".github/renovate.json5"
      # Sibling push/PR workflows validate their own files; nothing in this
      # workflow reads them. build.yml is deliberately NOT ignored anywhere:
      # it is the canonical mkosi pin source.
      - ".github/workflows/build-native-images.yml"
      - ".github/workflows/test-bootc-secure.yml"
      - ".github/workflows/validate.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "shared/download/package-versions.json"
      - "latest-versions.txt"
      - "shared/download/sysext-checksums.json"
      # Documentation, agent context, and the standalone redirect worker do
      # not change image inputs or the image validation scripts.
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"
      - ".knowledge/**"
      - ".memory/**"
      - "docs/**"
      - "skills/**"
      - "workers/**"
      - ".github/workflows/deploy-native-installer-redirect.yml"
      # Workflows that never run on push/PR (scheduled, dispatch-only, or
      # issue/review-event) and repository metadata cannot affect this
      # workflow's inputs.
      - ".github/workflows/ai-fix-requested.yml"
      - ".github/workflows/bootc-secure-nightly.yml"
      - ".github/workflows/build-mechanics.yml"
      - ".github/workflows/check-dependencies.yml"
      - ".github/workflows/check-packages.yml"
      - ".github/workflows/claude.yml"
      - ".github/workflows/copilot-review-apply.yml"
      - ".github/workflows/native-nightly.yml"
      - ".github/workflows/nightly-compliance.yml"
      - ".github/workflows/scorecard.yml"
      - ".github/workflows/test-install.yml"
      - ".github/workflows/triage.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/prompts/**"
      - ".github/actionlint.yaml"
      - ".github/auto-qa-tuning.json"
      - ".github/dependabot.yml"
      - ".github/renovate.json5"
      # Sibling push/PR workflows validate their own files; nothing in this
      # workflow reads them. build.yml is deliberately NOT ignored anywhere:
      # it is the canonical mkosi pin source.
      - ".github/workflows/build-native-images.yml"
      - ".github/workflows/test-bootc-secure.yml"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions: {}

env:
  REPO_NAME: snosi

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  # Superseded runs of the same ref carry no information: cancel them for
  # ordinary pushes AND for PR synchronize events (a new push to a PR branch
  # otherwise leaves the previous three-profile mechanics matrix running to
  # completion).
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  secure-build:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    environment: native-build
    runs-on: ubuntu-latest
    # A hung mkosi/apt otherwise burns the 6-hour default per matrix leg.
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      # Don't let one variant's failure (e.g. runner disk exhaustion) cancel
      # the other in-flight builds. Each variant is independent.
      fail-fast: false
      matrix:
        include:
          - profile: cayo
            description: "Cayo Linux Server Image"
          - profile: snow
            description: "Snow Linux OS Image"
          - profile: snowfield
            description: "Snowfield Linux OS Image"

    steps:
      - name: Show disk space (before)
        run: sudo df -h

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          # We don't use the runner's preinstalled language toolchains; reclaim
          # the tool cache (~8-12GB) on / for extra headroom on large builds.
          tool-cache: true

      - name: Mount BTRFS for podman storage
        uses: ublue-os/container-storage-action@dc1f4c8f17b672069e921f001132f7cf98a423a6 # main 2026-02-11
        with:
          target-dir: /var/lib/containers

      - name: Configure Podman OCI runtime
        # GitHub runner 20260726 upgraded Podman 4.9.3 -> 5.8.4; its default
        # crun path rejects the generated OCI version. The matched bundled
        # runc works for direct and script-nested podman invocations.
        run: |
          sudo install -d -m 0755 /etc/containers/containers.conf.d
          printf '%s\n' '[engine]' 'runtime = "runc"' \
            | sudo tee /etc/containers/containers.conf.d/99-snosi-ci-runtime.conf >/dev/null
          runtime=$(sudo podman info --format '{{.Host.OCIRuntime.Name}}')
          [[ $runtime == runc ]] || {
            echo "::error::Podman selected OCI runtime '$runtime', expected 'runc'" >&2
            exit 1
          }

      - name: Redirect temp to /mnt
        # / (/dev/root) has ~45G free after cleanup; /mnt has ~70G free. mkosi's
        # build workspace and podman/buildah tar staging default to TMPDIR
        # (/var/tmp on /), which overflows / on the larger variants and
        # crashes the runner with "No space left on device". Point TMPDIR at the
        # roomy /mnt volume for all subsequent steps.
        run: |
          sudo mkdir -p /mnt/tmp
          sudo chmod 1777 /mnt/tmp
          echo "TMPDIR=/mnt/tmp" >> "$GITHUB_ENV"

      - name: Show disk space (after)
        run: sudo df -h

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check mkosi package duplicates
        run: ./check-duplicate-packages.sh

      - name: Generate build date
        id: date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Generate version tag
        id: version
        run: echo "tag=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: setup-mkosi
        uses: systemd/mkosi@3c3a08fb07d27fbe473625aa0725655cfb2c68bf

      - name: Build Image
        run: |
          sudo TMPDIR="$TMPDIR" mkosi --profile ${{ matrix.profile }} \
            --dependency= \
            --dependency=base \
            --image-version "${{ steps.version.outputs.tag }}" \
            build

      - name: Materialize protected bootc signing credentials
        env:
          NATIVE_SECURE_BOOT_KEY: ${{ secrets.NATIVE_SECURE_BOOT_KEY }}
          NATIVE_SECURE_BOOT_CERTIFICATE: ${{ secrets.NATIVE_SECURE_BOOT_CERTIFICATE }}
          NATIVE_PCR_SIGNING_KEY: ${{ secrets.NATIVE_PCR_SIGNING_KEY }}
          NATIVE_PCR_SIGNING_CERTIFICATE: ${{ secrets.NATIVE_PCR_SIGNING_CERTIFICATE }}
        run: |
          set -euo pipefail
          for name in NATIVE_SECURE_BOOT_KEY NATIVE_SECURE_BOOT_CERTIFICATE NATIVE_PCR_SIGNING_KEY NATIVE_PCR_SIGNING_CERTIFICATE; do
            [[ -n "${!name}" ]] || { echo "::error::secrets.$name is not set in native-build" >&2; exit 1; }
          done
          umask 077
          mkdir -p /var/tmp/bootc-secure-credentials
          printf '%s' "$NATIVE_SECURE_BOOT_KEY" > /var/tmp/bootc-secure-credentials/mok.key
          printf '%s' "$NATIVE_SECURE_BOOT_CERTIFICATE" > /var/tmp/bootc-secure-credentials/mok.crt
          printf '%s' "$NATIVE_PCR_SIGNING_KEY" > /var/tmp/bootc-secure-credentials/pcr.key
          printf '%s' "$NATIVE_PCR_SIGNING_CERTIFICATE" > /var/tmp/bootc-secure-credentials/pcr.crt
          chmod 600 /var/tmp/bootc-secure-credentials/*
          openssl x509 -in /var/tmp/bootc-secure-credentials/pcr.crt -pubkey -noout \
            > /var/tmp/bootc-secure-credentials/pcr.pub
          chmod 600 /var/tmp/bootc-secure-credentials/pcr.pub
          cmp -s /var/tmp/bootc-secure-credentials/mok.crt shared/native-ab/keys/mok-2026.crt || {
            echo "::error::protected MOK certificate differs from the committed identity" >&2
            exit 1
          }
          cmp -s /var/tmp/bootc-secure-credentials/pcr.pub shared/native-ab/keys/pcr-signing-2026.pub || {
            echo "::error::protected PCR certificate differs from the committed identity" >&2
            exit 1
          }

      - name: Package image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.profile }}
          MAX_LAYERS: 128
          SNOSI_BOOTC_SECURE: "1"
          SNOSI_BOOTC_MOK_KEY: /var/tmp/bootc-secure-credentials/mok.key
          SNOSI_BOOTC_MOK_CERT: /var/tmp/bootc-secure-credentials/mok.crt
          SNOSI_BOOTC_PCR_KEY: /var/tmp/bootc-secure-credentials/pcr.key
          SNOSI_BOOTC_PCR_CERT: /var/tmp/bootc-secure-credentials/pcr.pub
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          sudo TMPDIR="$TMPDIR" \
            SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            MAX_LAYERS="$MAX_LAYERS" \
            SNOSI_BOOTC_SECURE="$SNOSI_BOOTC_SECURE" \
            SNOSI_BOOTC_MOK_KEY="$SNOSI_BOOTC_MOK_KEY" \
            SNOSI_BOOTC_MOK_CERT="$SNOSI_BOOTC_MOK_CERT" \
            SNOSI_BOOTC_PCR_KEY="$SNOSI_BOOTC_PCR_KEY" \
            SNOSI_BOOTC_PCR_CERT="$SNOSI_BOOTC_PCR_CERT" \
            ./shared/outformat/image/buildah-package.sh \
            output/${{ matrix.profile }} \
            "$IMAGE:${{ steps.version.outputs.tag }}" \
            "org.opencontainers.image.title=${{ matrix.profile }}" \
            "org.opencontainers.image.description=${{ matrix.description }}" \
            "org.opencontainers.image.version=${{ steps.version.outputs.tag }}" \
            "org.opencontainers.image.created=${{ steps.date.outputs.date }}" \
            "org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.REPO_NAME }}/blob/${{ github.sha }}/mkosi.conf" \
            "org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.REPO_NAME }}/tree/${{ github.sha }}" \
            "org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.REPO_NAME }}/${{ github.sha }}/README.md"

      - name: Install secure artifact validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dracut-core zstd

      - name: Validate locally assembled secure artifact
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.profile }}
        run: |
          sudo SNOSI_REQUIRE_GPT_AUTO_VALIDATION=1 \
            ./test/bootc-secure-artifact-test.sh \
            "output/${{ matrix.profile }}" \
            "$IMAGE:${{ steps.version.outputs.tag }}" \
            /var/tmp/bootc-secure-credentials/mok.crt \
            /var/tmp/bootc-secure-credentials/pcr.pub
          echo '- Real assembled UKI: initramfs gpt-auto structural validation passed.' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Remove protected bootc signing credentials
        if: always()
        run: sudo rm -rf /var/tmp/bootc-secure-credentials

      - name: Smoke test - verify SUID bit and bcvk requirements
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.profile }}
        run: |
          sudo podman run --rm "$IMAGE:${{ steps.version.outputs.tag }}" sh -ec '
            mode=$(stat -c "%a" /usr/bin/sudo)
            echo "sudo permissions: $mode"
            if [ "$mode" != "4755" ]; then
              echo "::error::SUID bit not set on /usr/bin/sudo (expected 4755, got $mode)"
              exit 1
            fi

            for required in bwrap systemctl objcopy ssh ssh-keygen; do
              if ! command -v "$required" >/dev/null; then
                echo "::error::Missing $required required for optional bcvk testing"
                exit 1
              fi
            done
          '

      - name: Setup Syft
        id: setup-syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0

      - name: Generate SBOM
        id: generate-sbom
        env:
          PROFILE: ${{ matrix.profile }}
          SYFT_CMD: ${{ steps.setup-syft.outputs.cmd }}
        run: |
          SBOM="$(mktemp -d)/sbom.json"
          export SYFT_PARALLELISM=$(($(nproc)*2))
          sudo TMPDIR="$TMPDIR" "${SYFT_CMD}" --source-name "${PROFILE}" "output/${PROFILE}" -o "syft-json=${SBOM}"
          du -sh "${SBOM}"
          echo "SBOM=${SBOM}" >> "$GITHUB_OUTPUT"

      - name: Push immutable version tag
        id: push
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.profile }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # The job-scoped token has only this repository's packages:write.
          # Pass it via stdin so it never appears in process arguments.
          printf '%s' "$GH_TOKEN" | sudo buildah login -u "$GHCR_USER" --password-stdin ghcr.io

          sudo TMPDIR="$TMPDIR" buildah push \
            --compression-format=zstd:chunked \
            --digestfile=/tmp/image-digest \
            "$IMAGE:${{ steps.version.outputs.tag }}" \
            "docker://$IMAGE:${{ steps.version.outputs.tag }}"

          DIGEST=$(sudo cat /tmp/image-digest)
          if [[ ! "$DIGEST" =~ ^sha256: ]]; then
            echo "::error::Failed to extract valid digest: $DIGEST"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.6.5"

      - name: Sign immutable image digest
        # docker/login-action writes the user-context registry credentials used
        # directly by Cosign and passed explicitly to Skopeo verification and
        # promotion. Pinned Cosign signing remains a user-context operation.
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.profile }}
        run: |
          cosign sign --key env://COSIGN_PRIVATE_KEY --yes \
            "$IMAGE@${{ steps.push.outputs.digest }}"

      - name: Verify pushed secure image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.profile }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
          LOCAL_REF: localhost/snosi-verified-${{ matrix.profile }}:${{ steps.version.outputs.tag }}
        run: |
          AUTH_FILE="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          ./shared/bootc-secure/ci/verify-published-image.sh \
            "$IMAGE" "$VERSION_TAG" "$DIGEST" "$LOCAL_REF" "$AUTH_FILE"

      - name: Validate policy-copied secure artifact
        env:
          LOCAL_REF: localhost/snosi-verified-${{ matrix.profile }}:${{ steps.version.outputs.tag }}
        run: |
          sudo SNOSI_REQUIRE_GPT_AUTO_VALIDATION=1 \
            ./test/bootc-secure-artifact-test.sh \
            "output/${{ matrix.profile }}" "$LOCAL_REF" \
            "output/${{ matrix.profile }}/usr/lib/snosi/mok.crt" \
            "output/${{ matrix.profile }}/usr/lib/snosi/pcr-signing.pub"

      - name: Promote validated digest to latest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.profile }}
        run: |
          AUTH_FILE="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          ./shared/bootc-secure/ci/promote-published-image.sh \
            "$IMAGE" "${{ steps.push.outputs.digest }}" "$AUTH_FILE"

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2

      - name: Login to GHCR with ORAS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Upload SBOM
        id: upload-sbom
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.profile }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SBOM: ${{ steps.generate-sbom.outputs.SBOM }}
        run: |
          cd "$(dirname "${SBOM}")"
          oras attach \
            --artifact-type application/vnd.syft+json \
            --annotation "filename=$(basename "${SBOM}")" \
            "${IMAGE}@${DIGEST}" \
            "$(basename "${SBOM}")"

          sbom_digest=$(oras discover --format json "${IMAGE}@${DIGEST}" | jq -r '[.referrers[] | select(.artifactType == "application/vnd.syft+json")] | last | .digest')
          if [[ -z "${sbom_digest}" || "${sbom_digest}" == "null" ]]; then
            echo "::error::Failed to discover SBOM artifact digest"
            exit 1
          fi
          echo "sbom_digest=${sbom_digest}" >> "$GITHUB_OUTPUT"

      - name: Sign SBOM
        env:
          COSIGN_EXPERIMENTAL: "false"
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.profile }}
          SBOM_DIGEST: ${{ steps.upload-sbom.outputs.sbom_digest }}
        run: |
          cosign sign --key env://COSIGN_PRIVATE_KEY --yes \
            "${IMAGE}@${SBOM_DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.profile }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Move manifests
        run: |
          sudo ./manifestmv.sh

      - name: Upload manifests to R2
        uses: ryand56/r2-upload-action@b801a390acbdeb034c5e684ff5e1361c06639e7c
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: frostyardrepo
          source-dir: output/manifests
          destination-dir: manifests/

      - name: Record snow tag for release job
        # The tag travels to the release job because matrix outputs are last-writer-wins.
        if: matrix.profile == 'snow'
        run: echo "${{ steps.version.outputs.tag }}" > snow-tag.txt

      - name: Upload snow tag artifact
        if: matrix.profile == 'snow'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snow-tag
          path: snow-tag.txt
          retention-days: 1

      - name: cleanup build output
        run: |
          sudo -E mkosi clean

  mechanics-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: cayo
            description: "Cayo Linux Server Image"
          - profile: snow
            description: "Snow Linux OS Image"
          - profile: snowfield
            description: "Snowfield Linux OS Image"
    steps:
      - name: Show disk space (before)
        run: sudo df -h

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true

      - name: Mount BTRFS for podman storage
        uses: ublue-os/container-storage-action@dc1f4c8f17b672069e921f001132f7cf98a423a6 # main 2026-02-11
        with:
          target-dir: /var/lib/containers

      - name: Configure Podman OCI runtime
        # GitHub runner 20260726 upgraded Podman 4.9.3 -> 5.8.4; its default
        # crun path rejects the generated OCI version. The matched bundled
        # runc works for direct and script-nested podman invocations.
        run: |
          sudo install -d -m 0755 /etc/containers/containers.conf.d
          printf '%s\n' '[engine]' 'runtime = "runc"' \
            | sudo tee /etc/containers/containers.conf.d/99-snosi-ci-runtime.conf >/dev/null
          runtime=$(sudo podman info --format '{{.Host.OCIRuntime.Name}}')
          [[ $runtime == runc ]] || {
            echo "::error::Podman selected OCI runtime '$runtime', expected 'runc'" >&2
            exit 1
          }

      - name: Redirect temp to /mnt
        run: |
          sudo mkdir -p /mnt/tmp
          sudo chmod 1777 /mnt/tmp
          echo "TMPDIR=/mnt/tmp" >> "$GITHUB_ENV"

      - name: Show disk space (after)
        run: sudo df -h

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check mkosi package duplicates
        run: ./check-duplicate-packages.sh

      - name: Generate build date
        id: date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Generate version tag
        id: version
        run: echo "tag=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: setup-mkosi
        uses: systemd/mkosi@3c3a08fb07d27fbe473625aa0725655cfb2c68bf

      - name: Build Image
        run: |
          sudo TMPDIR="$TMPDIR" mkosi --profile ${{ matrix.profile }} \
            --dependency= \
            --dependency=base \
            --image-version "${{ steps.version.outputs.tag }}" \
            build

      - name: Package image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.profile }}
        run: |
          sudo TMPDIR="$TMPDIR" ./shared/outformat/image/buildah-package.sh \
            output/${{ matrix.profile }} \
            "$IMAGE:${{ steps.version.outputs.tag }}" \
            "org.opencontainers.image.title=${{ matrix.profile }}" \
            "org.opencontainers.image.description=${{ matrix.description }}" \
            "org.opencontainers.image.version=${{ steps.version.outputs.tag }}" \
            "org.opencontainers.image.created=${{ steps.date.outputs.date }}" \
            "org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.REPO_NAME }}/blob/${{ github.sha }}/mkosi.conf" \
            "org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.REPO_NAME }}/tree/${{ github.sha }}" \
            "org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.REPO_NAME }}/${{ github.sha }}/README.md"

      - name: Smoke test - verify SUID bit and bcvk requirements
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.profile }}
        run: |
          sudo podman run --rm "$IMAGE:${{ steps.version.outputs.tag }}" sh -ec '
            mode=$(stat -c "%a" /usr/bin/sudo)
            echo "sudo permissions: $mode"
            if [ "$mode" != "4755" ]; then
              echo "::error::SUID bit not set on /usr/bin/sudo (expected 4755, got $mode)"
              exit 1
            fi

            for required in bwrap systemctl objcopy ssh ssh-keygen; do
              if ! command -v "$required" >/dev/null; then
                echo "::error::Missing $required required for optional bcvk testing"
                exit 1
              fi
            done
          '

      - name: cleanup build output
        if: always()
        run: sudo -E mkosi clean

  release:
    runs-on: ubuntu-latest
    needs: secure-build
    # !cancelled(): run whenever the matrix finished, even if a sibling
    # profile failed (fail-fast is off) — previously any failed leg skipped
    # the release and that interval's changes were never described in any
    # release. Whether snow actually pushed is decided by the artifact
    # check below (matrix job outputs are last-writer-wins across legs and
    # can't gate this deterministically). continue-on-error was also dropped
    # so release failures are visible instead of always green.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled()
    permissions:
      contents: write
      packages: read
    steps:
      - name: Download snow tag artifact
        # Missing artifact = the snow leg didn't push; skip the release.
        id: tag-artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snow-tag

      - name: Read snow tag
        id: current
        run: |
          set -euo pipefail
          if [[ -f snow-tag.txt ]] && [[ "$(cat snow-tag.txt)" =~ ^[0-9]{14}$ ]]; then
            echo "tag=$(cat snow-tag.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::snow leg did not push this run; skipping release"
          fi

      - name: Checkout repository
        if: steps.current.outputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ORAS
        if: steps.current.outputs.tag != ''
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2

      - name: Login to GHCR with ORAS
        if: steps.current.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Resolve previous and current snow tags
        id: versions
        if: steps.current.outputs.tag != ''
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/snow
          CURRENT: ${{ steps.current.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./shared/bootc-secure/ci/resolve-snow-release-predecessor.sh \
            "$GITHUB_REPOSITORY" "$IMAGE" "$CURRENT" "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        if: steps.current.outputs.tag != '' && steps.versions.outputs.skip != 'true'
        uses: frostyard/changelog-generator@7bd6be9ecc9ab8297d73fdc1f1925f727c6bdeb9 # main 2026-04-09
        with:
          image: ghcr.io/${{ github.repository_owner }}/snow
          previous-tag: ${{ steps.versions.outputs.previous }}
          current-tag: ${{ steps.versions.outputs.current }}
          output-file: changelog.md

      - name: Record image tag in release notes
        if: steps.current.outputs.tag != '' && steps.versions.outputs.skip != 'true'
        env:
          CURRENT: ${{ steps.versions.outputs.current }}
        run: |
          printf '\n<!-- snow-tag: %s -->\n' "$CURRENT" >> changelog.md

      - name: Compute release tag and title
        id: release-meta
        if: steps.current.outputs.tag != '' && steps.versions.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: ${{ steps.versions.outputs.current }}
        run: |
          set -euo pipefail
          date_part="${CURRENT:0:4}-${CURRENT:4:2}-${CURRENT:6:2}"
          hh="${CURRENT:8:2}"; mm="${CURRENT:10:2}"; ss="${CURRENT:12:2}"

          # Daily counter: find highest existing N in releases matching "<date>.N"
          existing=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName --jq \
            "[.[] | .tagName | select(startswith(\"${date_part}.\")) \
              | sub(\"^${date_part}\\\\.\"; \"\") | select(test(\"^[0-9]+$\")) | tonumber] | max // 0")
          next=$(( existing + 1 ))
          tag="${date_part}.${next}"
          title="Build ${date_part} ${hh}:${mm}:${ss} UTC"
          echo "tag=$tag"     >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.current.outputs.tag != '' && steps.versions.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release-meta.outputs.tag }}
          TITLE: ${{ steps.release-meta.outputs.title }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file changelog.md
