name: Build sysexts

on:
  push:
    branches: [main]
    paths-ignore:
      # Image-only direct-download metadata should rebuild OCI profiles, not
      # the base+sysext publishing workflow.
      - "shared/download/image-checksums.json"
      # The Forky systemd sentinel concerns only secure OCI and installer
      # profiles; base and sysexts never install from Forky.
      - "shared/download/forky-versions.json"
      # These paths cannot affect base/sysext composition or publication.
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"
      - ".knowledge/**"
      - ".memory/**"
      - "docs/**"
      - "skills/**"
      - "workers/**"
      - ".github/workflows/build-installer-iso.yml"
      - ".github/workflows/deploy-native-installer-redirect.yml"
      # Workflows that never run on push/PR (scheduled, dispatch-only, or
      # issue/review-event) and repository metadata cannot affect this
      # workflow's inputs.
      - ".github/workflows/ai-fix-requested.yml"
      - ".github/workflows/bootc-secure-nightly.yml"
      - ".github/workflows/build-mechanics.yml"
      - ".github/workflows/check-dependencies.yml"
      - ".github/workflows/check-packages.yml"
      - ".github/workflows/claude.yml"
      - ".github/workflows/nightly-compliance.yml"
      - ".github/workflows/scorecard.yml"
      - ".github/workflows/test-install.yml"
      - ".github/workflows/triage.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/prompts/**"
      - ".github/actionlint.yaml"
      - ".github/auto-qa-tuning.json"
      - ".github/dependabot.yml"
      - ".github/renovate.json5"
      # Sibling push/PR workflows validate their own files; nothing in this
      # workflow reads them. (build.yml itself stays a trigger everywhere
      # else: its mkosi pin is read by shared/native-ab/ci/bootstrap-mkosi.sh
      # and the Justfile.)
      - ".github/workflows/build-images.yml"
      - ".github/workflows/test-bootc-secure.yml"
      - ".github/workflows/validate.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "shared/download/image-checksums.json"
      - "shared/download/forky-versions.json"
      # These paths cannot affect base/sysext composition or publication.
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"
      - ".knowledge/**"
      - ".memory/**"
      - "docs/**"
      - "skills/**"
      - "workers/**"
      - ".github/workflows/build-installer-iso.yml"
      - ".github/workflows/deploy-native-installer-redirect.yml"
      # Workflows that never run on push/PR (scheduled, dispatch-only, or
      # issue/review-event) and repository metadata cannot affect this
      # workflow's inputs.
      - ".github/workflows/ai-fix-requested.yml"
      - ".github/workflows/bootc-secure-nightly.yml"
      - ".github/workflows/build-mechanics.yml"
      - ".github/workflows/check-dependencies.yml"
      - ".github/workflows/check-packages.yml"
      - ".github/workflows/claude.yml"
      - ".github/workflows/nightly-compliance.yml"
      - ".github/workflows/scorecard.yml"
      - ".github/workflows/test-install.yml"
      - ".github/workflows/triage.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/prompts/**"
      - ".github/actionlint.yaml"
      - ".github/auto-qa-tuning.json"
      - ".github/dependabot.yml"
      - ".github/renovate.json5"
      # Sibling push/PR workflows validate their own files; nothing in this
      # workflow reads them. (build.yml itself stays a trigger everywhere
      # else: its mkosi pin is read by shared/native-ab/ci/bootstrap-mkosi.sh
      # and the Justfile.)
      - ".github/workflows/build-images.yml"
      - ".github/workflows/test-bootc-secure.yml"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions: {}

env:
  IMAGE_NAME: snosi
  REPO_NAME: snosi
  IMAGE_DESC: "Snow Linux - A minimal bootc-enabled OS image"
  IMAGE_KEYWORDS: "linux,os,bootc,systemd,debian"
  IMAGE_LICENSE: Apache-2.0
  IMAGE_LOGO_URL: "" # Optional: URL to logo image

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  # Superseded PR runs carry no information: cancel them on PR synchronize
  # events (a new push to a PR branch otherwise leaves the previous build
  # running to completion). Never cancel a main push run: it publishes to R2,
  # and a cancel during the upload can leave ext/<name>/SHA256SUMS and its
  # .gpg out of step, which repogen v0.7.0 then refuses (fails closed) until
  # a person repairs the bucket. A newer main push waits instead; GitHub keeps
  # only the newest pending run, so a burst of merges costs one extra build.
  # The publish step cannot be split into its own non-cancellable job without
  # moving every built sysext through an artifact.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung mkosi/apt otherwise burns the 6-hour default.
    timeout-minutes: 120
    # This job executes PR-controlled mkosi configuration as root. It does not
    # publish through GITHUB_TOKEN, mint OIDC tokens, or create attestations.
    permissions:
      contents: read

    steps:
      - name: Aggressive cleanup
        run: |
          # Remove Java (JDKs)
          sudo rm -rf /usr/lib/jvm

          # Remove .NET SDKs
          sudo rm -rf /usr/share/dotnet

          # Remove Swift toolchain
          sudo rm -rf /usr/share/swift

          # Remove Haskell (GHC)
          sudo rm -rf /usr/local/.ghcup

          # Remove Julia
          sudo rm -rf /usr/local/julia*

          # Remove Android SDKs
          sudo rm -rf /usr/local/lib/android

          # Remove Chromium (optional if not using for browser tests)
          sudo rm -rf /usr/local/share/chromium

          # Remove Microsoft/Edge and Google Chrome builds
          sudo rm -rf /opt/microsoft /opt/google

          # Remove Azure CLI
          sudo rm -rf /opt/az

          # Remove PowerShell
          sudo rm -rf /usr/local/share/powershell

          # Remove CodeQL and other toolcaches
          sudo rm -rf /opt/hostedtoolcache

          docker system prune -af || true
          docker builder prune -af || true
          df -h

      - name: Redirect temp to /mnt
        # Same disk-exhaustion class as build-images.yml: mkosi's workspace
        # defaults to TMPDIR on /, which is the tighter volume on hosted
        # runners; /mnt has the headroom. sudo -E preserves TMPDIR below.
        run: |
          sudo mkdir -p /mnt/tmp
          sudo chmod 1777 /mnt/tmp
          echo "TMPDIR=/mnt/tmp" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check mkosi package duplicates
        run: ./check-duplicate-packages.sh

      - name: Generate build date
        id: date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Generate version tag
        id: version
        run: echo "tag=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: setup-mkosi
        uses: systemd/mkosi@78362ba193cac046a0351c7d33af86bbd0e9cfc6

      - name: Verify attested sysext downloads
        # First-party debs pinned in shared/download/sysext-checksums.json with
        # an `attestation` entry (lodge, notesd, maild, porterd, readd) must
        # carry a valid GitHub build-provenance attestation from their release
        # workflow at the tag of the pinned version (ADR-0024). The pinned
        # SHA-256 binds the bytes that mkosi downloads later to the attested
        # digest, so this step only has to check the pinned file once. `gh` is
        # not in the mkosi buildroot, which is why the check is a step and not
        # part of a postinst. The job keeps `contents: read`: the attestations
        # API of a public repository needs no other scope.
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./shared/download/verify-attestations.sh

      - name: Build main and sysexts
        env:
          # These are picked up by mkosi.postoutput script
          CREATED_DATE: ${{ steps.date.outputs.date }}
          DEFAULT_TAG: ${{ steps.version.outputs.tag }}
          IMAGE_VERSION: ${{ steps.version.outputs.tag }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_DESC: ${{ env.IMAGE_DESC }}
          IMAGE_KEYWORDS: ${{ env.IMAGE_KEYWORDS }}
          IMAGE_LICENSE: ${{ env.IMAGE_LICENSE }}
          IMAGE_LOGO_URL: ${{ env.IMAGE_LOGO_URL }}
          # These are automatically available from GitHub context
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          sudo -E mkosi build

      - name: Build himmelblau sysext (scoped third-party source)
        # himmelblau packages come from a third-party APT repo that only this
        # image needs, so it builds in its own mkosi invocation with its own
        # sandbox tree. That keeps the repository metadata sync for that source
        # out of every other build: an outage of the himmelblau repo must not
        # stop the other sysexts from being built and published (ADR-0020).
        # `--cache-only=never` forces a repository metadata sync here. Since
        # mkosi 57907f58 the sync is skipped when the incremental base cache is
        # current, so mkosi would never fetch the himmelblau source. Base
        # rebuilds in this invocation. mkosi requires `--incremental=no` with
        # `--cache-only=never` (check_inputs rejects Incremental=yes with
        # CacheOnly=never), so base rebuilds non-incrementally.
        id: himmelblau
        continue-on-error: true
        env:
          # These are picked up by mkosi.postoutput script
          CREATED_DATE: ${{ steps.date.outputs.date }}
          DEFAULT_TAG: ${{ steps.version.outputs.tag }}
          IMAGE_VERSION: ${{ steps.version.outputs.tag }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_DESC: ${{ env.IMAGE_DESC }}
          IMAGE_KEYWORDS: ${{ env.IMAGE_KEYWORDS }}
          IMAGE_LICENSE: ${{ env.IMAGE_LICENSE }}
          IMAGE_LOGO_URL: ${{ env.IMAGE_LOGO_URL }}
          # These are automatically available from GitHub context
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          sudo -E mkosi --dependency= --dependency=base --dependency=himmelblau --sandbox-tree=shared/himmelblau/sandbox --incremental=no --cache-only=never build

      - name: Collect sysext outputs
        # Both mkosi invocations write into output/; collect after the second
        # one so the himmelblau artifact and manifest publish with the rest.
        run: |
          sudo ./sysextmv.sh
          sudo ./manifestmv.sh
      - name: Drop sysexts that are already published
        # repogen v0.7.0 fails the whole publish when a rebuilt sysext has an
        # identity (NAME_VERSION_OSVERSION_ARCH, compression suffix ignored)
        # that ext/<name>/SHA256SUMS already lists with other bytes or another
        # filename; skip-duplicates skips only exact duplicates, and mkosi
        # output is not byte-reproducible. Remove those files first, reading
        # SHA256SUMS from R2 itself, not from the CDN, which can be stale.
        # The files are root-owned (sysextmv.sh ran under sudo); the script
        # itself runs unprivileged.
        id: prefilter
        if: github.event_name != 'pull_request'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: frostyardrepo
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          sudo chown -R "$(id -u):$(id -g)" output/sysexts
          ./shared/sysext/publish/drop-published.sh ./output/sysexts
      - name: Publish sysexts to frostyard repo
        # Skipped when every built identity is already published: the action
        # fails on an empty packages-dir.
        if: github.event_name != 'pull_request' && steps.prefilter.outputs.publish == 'true'
        uses: frostyard/repogen/.github/actions/publish-to-r2@c3c9f63c0f9b04106cfdb84318f5ec935566ab89 # v0.7.0
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: frostyardrepo
          # The action requires the exact repogen release and the commit its
          # binary embeds; never let the binary float ("latest" broke every
          # publish on 2026-09-14). test/build-workflow-permissions-test.py
          # pins repogen-version to the action pin's own release. The step
          # above hands repogen only identities absent from the published
          # index, which v0.7.0's digest reconciliation requires.
          repogen-version: v0.7.0
          repogen-commit: c3c9f63c0f9b04106cfdb84318f5ec935566ab89
          skip-duplicates: true
          gpg-private-key: ${{ secrets.REPOGEN_GPG_KEY }}
          packages-dir: ./output/sysexts
          package-type: sysext
          base-url: https://repository.frostyard.org # required for sysext
      - name: Upload manifests to R2
        if: github.event_name != 'pull_request'
        uses: ryand56/r2-upload-action@33ebb7a494b3a8a3c5ed2ea6bbdc72e707090317
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: frostyardrepo
          source-dir: output/manifests
          destination-dir: manifests/

      - name: Fail when the himmelblau sysext did not build
        # Deliberately last: the other sysexts publish first, then this check
        # still turns the build red so a himmelblau outage stays visible.
        if: steps.himmelblau.outcome == 'failure'
        run: |
          echo "::error::the himmelblau sysext did not build; its APT source (https://packages.himmelblau-idm.org) may be unavailable (ADR-0020)"
          exit 1
