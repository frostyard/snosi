name: Check External Dependencies

on:
  schedule:
    - cron: '0 9 * * 1'  # Weekly on Monday 9am UTC
  workflow_dispatch:

permissions: {}

jobs:
  check-sysext-updates:
    name: Check sysext dependency updates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for sysext dependency updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHECKSUMS="shared/download/sysext-checksums.json"
          UPDATES=""

          # Authenticated, retried GitHub API fetch. On persistent failure it
          # yields an empty string (|| true — explicit, so the graceful-skip
          # behavior doesn't depend on the shell's -e/pipefail settings, and
          # curl's error stays visible in the log). Every branch below guards
          # against the empty value: a failed check skips that dependency
          # instead of proposing a bogus "null" update or aborting the run.
          gh_api() {
            curl -fsSL --retry 3 --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$1" || true
          }

          # True when $1 sorts strictly newer than $2. Every proposal below
          # must pass this so an upstream channel quirk can never generate a
          # downgrade PR: coder marks its *stable* release as GitHub "latest"
          # while newer mainline releases exist, so a mainline-pinned entry
          # was "updated" backwards (2.35.1 -> 2.34.5, 2026-07-09).
          ver_gt() {
            [[ "$1" != "$2" && "$(printf '%s\n' "$1" "$2" | sort -V | tail -n1)" == "$1" ]]
          }

          # Check Bitwarden (skip drafts/prereleases)
          CURRENT_BW=$(jq -r '.bitwarden.version' "$CHECKSUMS")
          LATEST_BW=$(gh_api https://api.github.com/repos/bitwarden/clients/releases | jq -r '[.[] | select(.draft == false and .prerelease == false) | select(.tag_name | startswith("desktop-v"))][0].tag_name' | sed 's/desktop-v//')
          if [[ -n "$LATEST_BW" && "$LATEST_BW" != "null" ]] && ver_gt "$LATEST_BW" "$CURRENT_BW"; then
            UPDATES="${UPDATES}bitwarden: $CURRENT_BW -> $LATEST_BW\n"
            echo "bitwarden_update=true" >> $GITHUB_OUTPUT
            echo "bitwarden_version=$LATEST_BW" >> $GITHUB_OUTPUT
          fi

          # Check GitHub Copilot desktop app
          CURRENT_GITHUB_COPILOT=$(jq -r '."github-copilot".version' "$CHECKSUMS")
          LATEST_GITHUB_COPILOT=$(gh_api https://api.github.com/repos/github/app/releases | jq -r '[.[] | select(.draft == false and .prerelease == false)][0].tag_name' | sed 's/^v//')
          if [[ -n "$LATEST_GITHUB_COPILOT" && "$LATEST_GITHUB_COPILOT" != "null" ]] && ver_gt "$LATEST_GITHUB_COPILOT" "$CURRENT_GITHUB_COPILOT"; then
            UPDATES="${UPDATES}github-copilot: $CURRENT_GITHUB_COPILOT -> $LATEST_GITHUB_COPILOT\n"
            echo "github_copilot_update=true" >> "$GITHUB_OUTPUT"
            echo "github_copilot_version=$LATEST_GITHUB_COPILOT" >> "$GITHUB_OUTPUT"
          fi

          # Check Sunshine
          CURRENT_SUNSHINE=$(jq -r '.sunshine.version' "$CHECKSUMS")
          LATEST_SUNSHINE=$(gh_api https://api.github.com/repos/LizardByte/Sunshine/releases | jq -r '[.[] | select(.draft == false and .prerelease == false)][0].tag_name' | sed 's/^v//')
          if [[ -n "$LATEST_SUNSHINE" && "$LATEST_SUNSHINE" != "null" ]] && ver_gt "$LATEST_SUNSHINE" "$CURRENT_SUNSHINE"; then
            UPDATES="${UPDATES}sunshine: $CURRENT_SUNSHINE -> $LATEST_SUNSHINE\n"
            echo "sunshine_update=true" >> "$GITHUB_OUTPUT"
            echo "sunshine_version=$LATEST_SUNSHINE" >> "$GITHUB_OUTPUT"
          fi

          # Check code-server
          CURRENT_CS=$(jq -r '.["code-server"].version' "$CHECKSUMS")
          LATEST_CS=$(gh_api https://api.github.com/repos/coder/code-server/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          if [[ -n "$LATEST_CS" && "$LATEST_CS" != "null" ]] && ver_gt "$LATEST_CS" "$CURRENT_CS"; then
            UPDATES="${UPDATES}code-server: $CURRENT_CS -> $LATEST_CS\n"
            echo "codeserver_update=true" >> $GITHUB_OUTPUT
            echo "codeserver_version=$LATEST_CS" >> $GITHUB_OUTPUT
          fi

          # Check coder — deliberately tracks the STABLE channel: coder marks
          # its stable release as GitHub "latest"; mainline releases (higher
          # version numbers) are published alongside but not followed here.
          CURRENT_CODER=$(jq -r '.coder.version' "$CHECKSUMS")
          LATEST_CODER=$(gh_api https://api.github.com/repos/coder/coder/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          if [[ -n "$LATEST_CODER" && "$LATEST_CODER" != "null" ]] && ver_gt "$LATEST_CODER" "$CURRENT_CODER"; then
            UPDATES="${UPDATES}coder: $CURRENT_CODER -> $LATEST_CODER\n"
            echo "coder_update=true" >> $GITHUB_OUTPUT
            echo "coder_version=$LATEST_CODER" >> $GITHUB_OUTPUT
          fi

          # Check k3s — track the upstream *stable* channel (update.k3s.io),
          # not GitHub "latest": k3s promotes new minor releases to latest
          # before they reach the stable channel. The channel URL redirects to
          # the release tag; normalize the tag ("v1.36.2+k3s1", '+' sometimes
          # arriving percent-encoded) to the pinned version form.
          CURRENT_K3S=$(jq -r '.k3s.version' "$CHECKSUMS")
          LATEST_K3S=$(curl -fsSL --retry 3 --retry-delay 2 -o /dev/null -w '%{url_effective}' https://update.k3s.io/v1-release/channels/stable | sed -e 's|.*/tag/||' -e 's/%2B/+/' -e 's/^v//' || true)
          if [[ -n "$LATEST_K3S" ]] && ver_gt "$LATEST_K3S" "$CURRENT_K3S"; then
            UPDATES="${UPDATES}k3s: $CURRENT_K3S -> $LATEST_K3S\n"
            echo "k3s_update=true" >> "$GITHUB_OUTPUT"
            echo "k3s_version=$LATEST_K3S" >> "$GITHUB_OUTPUT"
          fi

          # Check Lemonade Server
          CURRENT_LEM=$(jq -r '.lemonade.version' "$CHECKSUMS")
          LATEST_LEM=$(gh_api https://api.github.com/repos/lemonade-sdk/lemonade/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          if [[ -n "$LATEST_LEM" && "$LATEST_LEM" != "null" ]] && ver_gt "$LATEST_LEM" "$CURRENT_LEM"; then
            UPDATES="${UPDATES}lemonade: $CURRENT_LEM -> $LATEST_LEM\n"
            echo "lemonade_update=true" >> $GITHUB_OUTPUT
            echo "lemonade_version=$LATEST_LEM" >> $GITHUB_OUTPUT
          fi

          # Check Paseo desktop app
          CURRENT_PASEO=$(jq -r '.paseo.version' "$CHECKSUMS")
          LATEST_PASEO=$(gh_api https://api.github.com/repos/getpaseo/paseo/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          if [[ -n "$LATEST_PASEO" && "$LATEST_PASEO" != "null" ]] && ver_gt "$LATEST_PASEO" "$CURRENT_PASEO"; then
            UPDATES="${UPDATES}paseo: $CURRENT_PASEO -> $LATEST_PASEO\n"
            echo "paseo_update=true" >> $GITHUB_OUTPUT
            echo "paseo_version=$LATEST_PASEO" >> $GITHUB_OUTPUT
          fi

          # Check Pilothouse (Snosi web administration console)
          CURRENT_PH=$(jq -r '.pilothouse.version' "$CHECKSUMS")
          LATEST_PH=$(gh_api https://api.github.com/repos/frostyard/pilothouse/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          if [[ -n "$LATEST_PH" && "$LATEST_PH" != "null" ]] && ver_gt "$LATEST_PH" "$CURRENT_PH"; then
            UPDATES="${UPDATES}pilothouse: $CURRENT_PH -> $LATEST_PH\n"
            echo "pilothouse_update=true" >> $GITHUB_OUTPUT
            echo "pilothouse_version=$LATEST_PH" >> $GITHUB_OUTPUT
          fi

          # Check Microsoft Azure VPN Client
          CURRENT_AZ=$(jq -r '.["microsoft-azurevpnclient"].version' "$CHECKSUMS")
          LATEST_AZ=$(curl -fsSL --retry 3 --retry-delay 2 https://packages.microsoft.com/ubuntu/22.04/prod/pool/main/m/microsoft-azurevpnclient/ | grep -oP 'microsoft-azurevpnclient_\K[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          if [[ -n "$LATEST_AZ" ]] && ver_gt "$LATEST_AZ" "$CURRENT_AZ"; then
            UPDATES="${UPDATES}microsoft-azurevpnclient: $CURRENT_AZ -> $LATEST_AZ\n"
            echo "azurevpn_update=true" >> $GITHUB_OUTPUT
            echo "azurevpn_version=$LATEST_AZ" >> $GITHUB_OUTPUT
          fi

          # Check Microsoft Edge Stable
          CURRENT_EDGE=$(jq -r '.["microsoft-edge-stable"].version' "$CHECKSUMS")
          LATEST_EDGE=$(curl -fsSL --retry 3 --retry-delay 2 https://packages.microsoft.com/repos/edge/dists/stable/main/binary-amd64/Packages | awk '/^Package: microsoft-edge-stable$/,/^$/' | awk '/^Version:/ {print $2}' | sort -V | tail -1)
          if [[ -n "$LATEST_EDGE" ]] && ver_gt "$LATEST_EDGE" "$CURRENT_EDGE"; then
            UPDATES="${UPDATES}microsoft-edge-stable: $CURRENT_EDGE -> $LATEST_EDGE\n"
            echo "edge_update=true" >> $GITHUB_OUTPUT
            echo "edge_version=$LATEST_EDGE" >> $GITHUB_OUTPUT
          fi

          # Check 1Password desktop (stable apt channel; installed as a pinned
          # .deb because the deb postinst needs network the buildroot lacks)
          CURRENT_OP=$(jq -r '.["1password"].version' "$CHECKSUMS")
          LATEST_OP=$(curl -fsSL --retry 3 --retry-delay 2 https://downloads.1password.com/linux/debian/amd64/dists/stable/main/binary-amd64/Packages.gz | zcat | awk '/^Package: 1password$/,/^$/' | awk '/^Version:/ {print $2}' | sort -V | tail -1)
          if [[ -n "$LATEST_OP" ]] && ver_gt "$LATEST_OP" "$CURRENT_OP"; then
            UPDATES="${UPDATES}1password: $CURRENT_OP -> $LATEST_OP\n"
            echo "onepassword_update=true" >> $GITHUB_OUTPUT
            echo "onepassword_version=$LATEST_OP" >> $GITHUB_OUTPUT
          fi

          if [[ -n "$UPDATES" ]]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo -e "Updates available:\n$UPDATES"
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "All sysext dependencies up to date"
          fi

      - name: Update sysext checksums
        if: steps.check.outputs.has_updates == 'true'
        # Step outputs derive from external release/commit data; passing them
        # through env (rather than inline ${{ }} interpolation in the script)
        # keeps a malicious upstream tag from injecting shell commands.
        env:
          BITWARDEN_UPDATE: ${{ steps.check.outputs.bitwarden_update }}
          BITWARDEN_VERSION: ${{ steps.check.outputs.bitwarden_version }}
          GITHUB_COPILOT_UPDATE: ${{ steps.check.outputs.github_copilot_update }}
          GITHUB_COPILOT_VERSION: ${{ steps.check.outputs.github_copilot_version }}
          SUNSHINE_UPDATE: ${{ steps.check.outputs.sunshine_update }}
          SUNSHINE_VERSION: ${{ steps.check.outputs.sunshine_version }}
          CODESERVER_UPDATE: ${{ steps.check.outputs.codeserver_update }}
          CODESERVER_VERSION: ${{ steps.check.outputs.codeserver_version }}
          CODER_UPDATE: ${{ steps.check.outputs.coder_update }}
          CODER_VERSION: ${{ steps.check.outputs.coder_version }}
          K3S_UPDATE: ${{ steps.check.outputs.k3s_update }}
          K3S_VERSION: ${{ steps.check.outputs.k3s_version }}
          LEMONADE_UPDATE: ${{ steps.check.outputs.lemonade_update }}
          LEMONADE_VERSION: ${{ steps.check.outputs.lemonade_version }}
          PASEO_UPDATE: ${{ steps.check.outputs.paseo_update }}
          PASEO_VERSION: ${{ steps.check.outputs.paseo_version }}
          PILOTHOUSE_UPDATE: ${{ steps.check.outputs.pilothouse_update }}
          PILOTHOUSE_VERSION: ${{ steps.check.outputs.pilothouse_version }}
          AZUREVPN_UPDATE: ${{ steps.check.outputs.azurevpn_update }}
          AZUREVPN_VERSION: ${{ steps.check.outputs.azurevpn_version }}
          EDGE_UPDATE: ${{ steps.check.outputs.edge_update }}
          EDGE_VERSION: ${{ steps.check.outputs.edge_version }}
          ONEPASSWORD_UPDATE: ${{ steps.check.outputs.onepassword_update }}
          ONEPASSWORD_VERSION: ${{ steps.check.outputs.onepassword_version }}
        run: |
          CHECKSUMS="shared/download/sysext-checksums.json"

          if [[ "$BITWARDEN_UPDATE" == "true" ]]; then
            VER="$BITWARDEN_VERSION"
            URL="https://github.com/bitwarden/clients/releases/download/desktop-v${VER}/Bitwarden-${VER}-amd64.deb"
            TMP=$(mktemp)
            curl -fsSL -o "$TMP" "$URL"
            SHA=$(sha256sum "$TMP" | cut -d' ' -f1)
            jq --arg u "$URL" --arg s "$SHA" --arg v "$VER" \
              '.bitwarden.url=$u | .bitwarden.sha256=$s | .bitwarden.version=$v' \
              "$CHECKSUMS" > tmp.json && mv tmp.json "$CHECKSUMS"
            rm -f "$TMP"
          fi

          if [[ "$GITHUB_COPILOT_UPDATE" == "true" ]]; then
            VER="$GITHUB_COPILOT_VERSION"
            URL="https://github.com/github/app/releases/download/v${VER}/GitHub-Copilot-linux-x64.deb"
            TMP=$(mktemp)
            curl -fsSL -o "$TMP" "$URL"
            SHA=$(sha256sum "$TMP" | cut -d' ' -f1)
            jq --arg u "$URL" --arg s "$SHA" --arg v "$VER" \
              '."github-copilot".url=$u | ."github-copilot".sha256=$s | ."github-copilot".version=$v' \
              "$CHECKSUMS" > tmp.json && mv tmp.json "$CHECKSUMS"
            rm -f "$TMP"
          fi

          if [[ "$SUNSHINE_UPDATE" == "true" ]]; then
            VER="$SUNSHINE_VERSION"
            URL="https://github.com/LizardByte/Sunshine/releases/download/v${VER}/sunshine-debian-trixie-amd64.deb"
            TMP=$(mktemp)
            curl -fsSL -o "$TMP" "$URL"
            SHA=$(sha256sum "$TMP" | cut -d' ' -f1)
            jq --arg u "$URL" --arg s "$SHA" --arg v "$VER" \
              '.sunshine.url=$u | .sunshine.sha256=$s | .sunshine.version=$v' \
              "$CHECKSUMS" > tmp.json && mv tmp.json "$CHECKSUMS"
            rm -f "$TMP"
          fi

          if [[ "$CODESERVER_UPDATE" == "true" ]]; then
            VER="$CODESERVER_VERSION"
            URL="https://github.com/coder/code-server/releases/download/v${VER}/code-server_${VER}_amd64.deb"
            TMP=$(mktemp)
            curl -fsSL -o "$TMP" "$URL"
            SHA=$(sha256sum "$TMP" | cut -d' ' -f1)
            jq --arg u "$URL" --arg s "$SHA" --arg v "$VER" \
              '.["code-server"].url=$u | .["code-server"].sha256=$s | .["code-server"].version=$v' \
              "$CHECKSUMS" > tmp.json && mv tmp.json "$CHECKSUMS"
            rm -f "$TMP"
          fi

          if [[ "$CODER_UPDATE" == "true" ]]; then
            VER="$CODER_VERSION"
            URL="https://github.com/coder/coder/releases/download/v${VER}/coder_${VER}_linux_amd64.deb"
            TMP=$(mktemp)
            curl -fsSL -o "$TMP" "$URL"
            SHA=$(sha256sum "$TMP" | cut -d' ' -f1)
            jq --arg u "$URL" --arg s "$SHA" --arg v "$VER" \
              '.coder.url=$u | .coder.sha256=$s | .coder.version=$v' \
              "$CHECKSUMS" > tmp.json && mv tmp.json "$CHECKSUMS"
            rm -f "$TMP"
          fi

          if [[ "$K3S_UPDATE" == "true" ]]; then
            VER="$K3S_VERSION"
            # '+' must be percent-encoded in the release-asset URL path
            TAG="v${VER/+/%2B}"
            URL="https://github.com/k3s-io/k3s/releases/download/${TAG}/k3s"
            # k3s publishes official per-release checksums; pin from those
            # instead of hashing our own download so a tampered transfer at
            # update time cannot become the pinned truth.
            SHA=$(curl -fsSL "https://github.com/k3s-io/k3s/releases/download/${TAG}/sha256sum-amd64.txt" | awk '$2 == "k3s" {print $1}')
            # the official checksum file must list the bare k3s binary
            [[ -n "$SHA" ]]
            jq --arg u "$URL" --arg s "$SHA" --arg v "$VER" \
              '.k3s.url=$u | .k3s.sha256=$s | .k3s.version=$v' \
              "$CHECKSUMS" > tmp.json && mv tmp.json "$CHECKSUMS"
          fi

          if [[ "$LEMONADE_UPDATE" == "true" ]]; then
            VER="$LEMONADE_VERSION"
            URL="https://github.com/lemonade-sdk/lemonade/releases/download/v${VER}/lemonade-server_${VER}-debian13_amd64.deb"
            TMP=$(mktemp)
            curl -fsSL -o "$TMP" "$URL"
            SHA=$(sha256sum "$TMP" | cut -d' ' -f1)
            jq --arg u "$URL" --arg s "$SHA" --arg v "$VER" \
              '.lemonade.url=$u | .lemonade.sha256=$s | .lemonade.version=$v' \
              "$CHECKSUMS" > tmp.json && mv tmp.json "$CHECKSUMS"
            rm -f "$TMP"
          fi

          if [[ "$PASEO_UPDATE" == "true" ]]; then
            VER="$PASEO_VERSION"
            URL="https://github.com/getpaseo/paseo/releases/download/v${VER}/Paseo-${VER}-amd64.deb"
            TMP=$(mktemp)
            curl -fsSL -o "$TMP" "$URL"
            SHA=$(sha256sum "$TMP" | cut -d' ' -f1)
            jq --arg u "$URL" --arg s "$SHA" --arg v "$VER" \
              '.paseo.url=$u | .paseo.sha256=$s | .paseo.version=$v' \
              "$CHECKSUMS" > tmp.json && mv tmp.json "$CHECKSUMS"
            rm -f "$TMP"
          fi

          if [[ "$PILOTHOUSE_UPDATE" == "true" ]]; then
            VER="$PILOTHOUSE_VERSION"
            URL="https://github.com/frostyard/pilothouse/releases/download/v${VER}/frostyard-pilothouse_${VER}_amd64.deb"
            TMP=$(mktemp)
            curl -fsSL -o "$TMP" "$URL"
            SHA=$(sha256sum "$TMP" | cut -d' ' -f1)
            jq --arg u "$URL" --arg s "$SHA" --arg v "$VER" \
              '.pilothouse.url=$u | .pilothouse.sha256=$s | .pilothouse.version=$v' \
              "$CHECKSUMS" > tmp.json && mv tmp.json "$CHECKSUMS"
            rm -f "$TMP"
          fi

          if [[ "$AZUREVPN_UPDATE" == "true" ]]; then
            VER="$AZUREVPN_VERSION"
            URL="https://packages.microsoft.com/ubuntu/22.04/prod/pool/main/m/microsoft-azurevpnclient/microsoft-azurevpnclient_${VER}_amd64.deb"
            TMP=$(mktemp)
            curl -fsSL -o "$TMP" "$URL"
            SHA=$(sha256sum "$TMP" | cut -d' ' -f1)
            jq --arg u "$URL" --arg s "$SHA" --arg v "$VER" \
              '.["microsoft-azurevpnclient"].url=$u | .["microsoft-azurevpnclient"].sha256=$s | .["microsoft-azurevpnclient"].version=$v' \
              "$CHECKSUMS" > tmp.json && mv tmp.json "$CHECKSUMS"
            rm -f "$TMP"
          fi

          if [[ "$EDGE_UPDATE" == "true" ]]; then
            VER="$EDGE_VERSION"
            URL="https://packages.microsoft.com/repos/edge/pool/main/m/microsoft-edge-stable/microsoft-edge-stable_${VER}_amd64.deb"
            TMP=$(mktemp)
            curl -fsSL -o "$TMP" "$URL"
            SHA=$(sha256sum "$TMP" | cut -d' ' -f1)
            jq --arg u "$URL" --arg s "$SHA" --arg v "$VER" \
              '.["microsoft-edge-stable"].url=$u | .["microsoft-edge-stable"].sha256=$s | .["microsoft-edge-stable"].version=$v' \
              "$CHECKSUMS" > tmp.json && mv tmp.json "$CHECKSUMS"
            rm -f "$TMP"
          fi

          if [[ "$ONEPASSWORD_UPDATE" == "true" ]]; then
            VER="$ONEPASSWORD_VERSION"
            URL="https://downloads.1password.com/linux/debian/amd64/pool/main/1/1password/1password-${VER}.amd64.deb"
            TMP=$(mktemp)
            curl -fsSL -o "$TMP" "$URL"
            SHA=$(sha256sum "$TMP" | cut -d' ' -f1)
            jq --arg u "$URL" --arg s "$SHA" --arg v "$VER" \
              '.["1password"].url=$u | .["1password"].sha256=$s | .["1password"].version=$v' \
              "$CHECKSUMS" > tmp.json && mv tmp.json "$CHECKSUMS"
            rm -f "$TMP"
          fi

      - name: Create sysext dependency PR
        if: steps.check.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@4e1beaa7521e8b457b572c090b25bd3db56bf1c5 # v5
        with:
          # GITHUB_TOKEN-created PRs do not trigger workflows (validate/build
          # never run on them). Set the WORKFLOW_PAT repo secret (fine-grained
          # PAT or GitHub App token with contents+pull-requests+workflows
          # write) to give auto-update PRs real CI; until then this falls back
          # to GITHUB_TOKEN and PRs must be checked manually.
          token: ${{ secrets.WORKFLOW_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "chore: update sysext dependency checksums"
          title: "chore: update sysext dependency checksums"
          body: |
            Automated update of pinned direct-download dependencies consumed by sysext builds.

            These updates modify `shared/download/sysext-checksums.json` and should trigger `build.yml`, not the OCI image matrix.

            **Please verify the sysext build works before merging.**
          branch: auto-update-sysext-checksums
          delete-branch: true

  check-image-updates:
    name: Check image dependency updates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for image dependency updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHECKSUMS="shared/download/image-checksums.json"
          UPDATES=""

          gh_api() {
            curl -fsSL --retry 3 --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$1" || true
          }

          ver_gt() {
            [[ "$1" != "$2" && "$(printf '%s\n' "$1" "$2" | sort -V | tail -n1)" == "$1" ]]
          }

          # ostree + bootc are NOT checked here: they are consumed as debs
          # from the frostyard APT repo, built by frostyard/bootc-debian,
          # which has its own weekly upstream-version check.

          # Check Homebrew install script
          CURRENT_BREW=$(jq -r '.["brew-install"].version' "$CHECKSUMS")
          LATEST_BREW=$(gh_api https://api.github.com/repos/Homebrew/install/commits/HEAD | jq -r '.sha' | head -c 12)
          CURRENT_BREW_SHORT=$(echo "$CURRENT_BREW" | head -c 12)
          if [[ -n "$LATEST_BREW" && "$LATEST_BREW" != "null" && "$LATEST_BREW" != "$CURRENT_BREW_SHORT" ]]; then
            UPDATES="${UPDATES}brew-install: $CURRENT_BREW_SHORT -> $LATEST_BREW\n"
            echo "brew_update=true" >> $GITHUB_OUTPUT
            echo "brew_commit=$LATEST_BREW" >> $GITHUB_OUTPUT
          fi

          # Check Surface cert (less frequent changes)
          CURRENT_SURF=$(jq -r '.["surface-cert"].version' "$CHECKSUMS")
          LATEST_SURF=$(gh_api "https://api.github.com/repos/linux-surface/linux-surface/commits?path=pkg/keys/surface.cer" | jq -r '.[0].sha' | head -c 12)
          CURRENT_SURF_SHORT=$(echo "$CURRENT_SURF" | head -c 12)
          if [[ -n "$LATEST_SURF" && "$LATEST_SURF" != "null" && "$LATEST_SURF" != "$CURRENT_SURF_SHORT" ]]; then
            UPDATES="${UPDATES}surface-cert: $CURRENT_SURF_SHORT -> $LATEST_SURF\n"
            echo "surface_update=true" >> $GITHUB_OUTPUT
            echo "surface_commit=$LATEST_SURF" >> $GITHUB_OUTPUT
          fi

          # Check hotedge
          CURRENT_HE=$(jq -r '.hotedge.version' "$CHECKSUMS")
          LATEST_HE=$(gh_api https://api.github.com/repos/frostyard/hotedge/commits/HEAD | jq -r '.sha')
          if [[ -n "$LATEST_HE" && "$LATEST_HE" != "null" && "$LATEST_HE" != "$CURRENT_HE" ]]; then
            UPDATES="${UPDATES}hotedge: ${CURRENT_HE:0:12} -> ${LATEST_HE:0:12}\n"
            echo "hotedge_update=true" >> $GITHUB_OUTPUT
            echo "hotedge_commit=$LATEST_HE" >> $GITHUB_OUTPUT
          fi

          # Check logomenu
          CURRENT_LM=$(jq -r '.logomenu.version' "$CHECKSUMS")
          LATEST_LM=$(gh_api https://api.github.com/repos/frostyard/logomenu/commits/HEAD | jq -r '.sha')
          if [[ -n "$LATEST_LM" && "$LATEST_LM" != "null" && "$LATEST_LM" != "$CURRENT_LM" ]]; then
            UPDATES="${UPDATES}logomenu: ${CURRENT_LM:0:12} -> ${LATEST_LM:0:12}\n"
            echo "logomenu_update=true" >> $GITHUB_OUTPUT
            echo "logomenu_commit=$LATEST_LM" >> $GITHUB_OUTPUT
          fi

          # Check bazaar (Bazaar Companion GNOME extension)
          CURRENT_BZ=$(jq -r '.bazaar.version' "$CHECKSUMS")
          LATEST_BZ=$(gh_api https://api.github.com/repos/AlexanderVanhee/bazaar-companion/commits/HEAD | jq -r '.sha')
          if [[ -n "$LATEST_BZ" && "$LATEST_BZ" != "null" && "$LATEST_BZ" != "$CURRENT_BZ" ]]; then
            UPDATES="${UPDATES}bazaar: ${CURRENT_BZ:0:12} -> ${LATEST_BZ:0:12}\n"
            echo "bazaar_update=true" >> $GITHUB_OUTPUT
            echo "bazaar_commit=$LATEST_BZ" >> $GITHUB_OUTPUT
          fi

          # Check Syft CLI used for SBOM generation
          CURRENT_SYFT=$(awk '$1 == "syft-version:" { print $2; exit }' .github/workflows/build-images.yml)
          LATEST_SYFT=$(gh_api https://api.github.com/repos/anchore/syft/releases/latest | jq -r '.tag_name')
          if [[ "$LATEST_SYFT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] &&
             ver_gt "${LATEST_SYFT#v}" "${CURRENT_SYFT#v}"; then
            UPDATES="${UPDATES}syft: $CURRENT_SYFT -> $LATEST_SYFT\n"
            echo "syft_update=true" >> "$GITHUB_OUTPUT"
            echo "syft_version=$LATEST_SYFT" >> "$GITHUB_OUTPUT"
          fi

          # Cosign v3 cannot verify these key-signed images when GitHub
          # provenance attestations are present, so follow stable v2 only.
          CURRENT_COSIGN=$(awk '$1 == "cosign-release:" { gsub(/"/, "", $2); print $2; exit }' .github/workflows/build-images.yml)
          LATEST_COSIGN=$(gh_api 'https://api.github.com/repos/sigstore/cosign/releases?per_page=100' |
            jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name | select(test("^v2\\.[0-9]+\\.[0-9]+$"))' |
            sort -V | tail -n1)
          if [[ "$LATEST_COSIGN" =~ ^v2\.[0-9]+\.[0-9]+$ ]] &&
             ver_gt "${LATEST_COSIGN#v}" "${CURRENT_COSIGN#v}"; then
            UPDATES="${UPDATES}cosign: $CURRENT_COSIGN -> $LATEST_COSIGN\n"
            echo "cosign_update=true" >> "$GITHUB_OUTPUT"
            echo "cosign_version=$LATEST_COSIGN" >> "$GITHUB_OUTPUT"
          fi

          # Check the immutable digest currently published by chunkah:latest.
          CURRENT_CHUNKAH=$(sed -n -E 's|^CHUNKAH_IMAGE=.*@(sha256:[a-f0-9]{64}).*$|\1|p' shared/outformat/image/chunkah-package.sh)
          LATEST_CHUNKAH=$(curl -fsSL --retry 3 --retry-delay 2 \
            'https://quay.io/api/v1/repository/coreos/chunkah/tag/?onlyActiveTags=true' |
            jq -r '[.tags[] | select(.name == "latest") | .manifest_digest][0] // empty' || true)
          if [[ "$LATEST_CHUNKAH" =~ ^sha256:[a-f0-9]{64}$ &&
                "$LATEST_CHUNKAH" != "$CURRENT_CHUNKAH" ]]; then
            UPDATES="${UPDATES}chunkah: $CURRENT_CHUNKAH -> $LATEST_CHUNKAH\n"
            echo "chunkah_update=true" >> "$GITHUB_OUTPUT"
            echo "chunkah_digest=$LATEST_CHUNKAH" >> "$GITHUB_OUTPUT"
          fi

          if [[ -n "$UPDATES" ]]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo -e "Updates available:\n$UPDATES"
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "All image dependencies up to date"
          fi

      - name: Update image dependencies
        if: steps.check.outputs.has_updates == 'true'
        env:
          BREW_UPDATE: ${{ steps.check.outputs.brew_update }}
          BREW_COMMIT: ${{ steps.check.outputs.brew_commit }}
          SURFACE_UPDATE: ${{ steps.check.outputs.surface_update }}
          SURFACE_COMMIT: ${{ steps.check.outputs.surface_commit }}
          HOTEDGE_UPDATE: ${{ steps.check.outputs.hotedge_update }}
          HOTEDGE_COMMIT: ${{ steps.check.outputs.hotedge_commit }}
          LOGOMENU_UPDATE: ${{ steps.check.outputs.logomenu_update }}
          LOGOMENU_COMMIT: ${{ steps.check.outputs.logomenu_commit }}
          BAZAAR_UPDATE: ${{ steps.check.outputs.bazaar_update }}
          BAZAAR_COMMIT: ${{ steps.check.outputs.bazaar_commit }}
          SYFT_UPDATE: ${{ steps.check.outputs.syft_update }}
          SYFT_VERSION: ${{ steps.check.outputs.syft_version }}
          COSIGN_UPDATE: ${{ steps.check.outputs.cosign_update }}
          COSIGN_VERSION: ${{ steps.check.outputs.cosign_version }}
          CHUNKAH_UPDATE: ${{ steps.check.outputs.chunkah_update }}
          CHUNKAH_DIGEST: ${{ steps.check.outputs.chunkah_digest }}
        run: |
          CHECKSUMS="shared/download/image-checksums.json"

          validate_update_value() {
            local name=$1 value=$2 pattern=$3
            if [[ ! "$value" =~ $pattern ]]; then
              echo "::error::Refusing to update ${name}; unexpected value: ${value}"
              exit 1
            fi
          }

          replace_exactly_once() {
            local file=$1 pattern=$2 replacement=$3 count
            count=$(grep -Ec -- "$pattern" "$file" || true)
            if [[ "$count" != 1 ]]; then
              echo "::error::Expected one ${pattern} match in ${file}, found ${count}"
              exit 1
            fi
            sed -Ei "s|${pattern}|${replacement}|" "$file"
          }

          if [[ "$BREW_UPDATE" == "true" ]]; then
            COMMIT="$BREW_COMMIT"
            URL="https://raw.githubusercontent.com/Homebrew/install/${COMMIT}/install.sh"
            TMP=$(mktemp)
            curl -fsSL -o "$TMP" "$URL"
            SHA=$(sha256sum "$TMP" | cut -d' ' -f1)
            jq --arg u "$URL" --arg s "$SHA" --arg v "$COMMIT" \
              '.["brew-install"].url=$u | .["brew-install"].sha256=$s | .["brew-install"].version=$v' \
              "$CHECKSUMS" > tmp.json && mv tmp.json "$CHECKSUMS"
            rm -f "$TMP"
          fi

          if [[ "$SURFACE_UPDATE" == "true" ]]; then
            COMMIT="$SURFACE_COMMIT"
            URL="https://github.com/linux-surface/linux-surface/raw/${COMMIT}/pkg/keys/surface.cer"
            TMP=$(mktemp)
            curl -fsSL -o "$TMP" "$URL"
            SHA=$(sha256sum "$TMP" | cut -d' ' -f1)
            jq --arg u "$URL" --arg s "$SHA" --arg v "$COMMIT" \
              '.["surface-cert"].url=$u | .["surface-cert"].sha256=$s | .["surface-cert"].version=$v' \
              "$CHECKSUMS" > tmp.json && mv tmp.json "$CHECKSUMS"
            rm -f "$TMP"
          fi

          if [[ "$HOTEDGE_UPDATE" == "true" ]]; then
            COMMIT="$HOTEDGE_COMMIT"
            URL="https://codeload.github.com/frostyard/hotedge/tar.gz/${COMMIT}"
            TMP=$(mktemp)
            curl -fsSL -o "$TMP" "$URL"
            SHA=$(sha256sum "$TMP" | cut -d' ' -f1)
            jq --arg u "$URL" --arg s "$SHA" --arg v "$COMMIT" \
              '.hotedge.url=$u | .hotedge.sha256=$s | .hotedge.version=$v' \
              "$CHECKSUMS" > tmp.json && mv tmp.json "$CHECKSUMS"
            rm -f "$TMP"
          fi

          if [[ "$LOGOMENU_UPDATE" == "true" ]]; then
            COMMIT="$LOGOMENU_COMMIT"
            URL="https://codeload.github.com/frostyard/logomenu/tar.gz/${COMMIT}"
            TMP=$(mktemp)
            curl -fsSL -o "$TMP" "$URL"
            SHA=$(sha256sum "$TMP" | cut -d' ' -f1)
            jq --arg u "$URL" --arg s "$SHA" --arg v "$COMMIT" \
              '.logomenu.url=$u | .logomenu.sha256=$s | .logomenu.version=$v' \
              "$CHECKSUMS" > tmp.json && mv tmp.json "$CHECKSUMS"
            rm -f "$TMP"
          fi

          if [[ "$BAZAAR_UPDATE" == "true" ]]; then
            COMMIT="$BAZAAR_COMMIT"
            URL="https://codeload.github.com/AlexanderVanhee/bazaar-companion/tar.gz/${COMMIT}"
            TMP=$(mktemp)
            curl -fsSL -o "$TMP" "$URL"
            SHA=$(sha256sum "$TMP" | cut -d' ' -f1)
            jq --arg u "$URL" --arg s "$SHA" --arg v "$COMMIT" \
              '.bazaar.url=$u | .bazaar.sha256=$s | .bazaar.version=$v' \
              "$CHECKSUMS" > tmp.json && mv tmp.json "$CHECKSUMS"
            rm -f "$TMP"
          fi

          if [[ "$SYFT_UPDATE" == "true" ]]; then
            validate_update_value "syft-version" "$SYFT_VERSION" '^v[0-9]+\.[0-9]+\.[0-9]+$'
            replace_exactly_once .github/workflows/build-images.yml \
              'syft-version: v[0-9]+\.[0-9]+\.[0-9]+$' \
              "syft-version: ${SYFT_VERSION}"
          fi

          if [[ "$COSIGN_UPDATE" == "true" ]]; then
            validate_update_value "cosign-release" "$COSIGN_VERSION" '^v2\.[0-9]+\.[0-9]+$'
            replace_exactly_once .github/workflows/build-images.yml \
              'cosign-release: "v2\.[0-9]+\.[0-9]+"$' \
              "cosign-release: \"${COSIGN_VERSION}\""
          fi

          if [[ "$CHUNKAH_UPDATE" == "true" ]]; then
            validate_update_value "chunkah digest" "$CHUNKAH_DIGEST" '^sha256:[a-f0-9]{64}$'
            replace_exactly_once shared/outformat/image/chunkah-package.sh \
              'quay\.io/coreos/chunkah@sha256:[a-f0-9]{64}' \
              "quay.io/coreos/chunkah@${CHUNKAH_DIGEST}"
          fi

      - name: Create image dependency PR
        if: steps.check.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@4e1beaa7521e8b457b572c090b25bd3db56bf1c5 # v5
        with:
          # This job edits .github/workflows/build-images.yml (syft/cosign
          # pins), and GITHUB_TOKEN can NEVER push workflow-file changes: the
          # push is rejected with "refusing to allow a GitHub App to create or
          # update workflow ... without `workflows` permission", and
          # `workflows: write` is not a valid scope in the Actions
          # `permissions:` key (adding it makes the whole file invalid —
          # startup_failure, run 31381342652 / reverted PR #652). The ONLY fix
          # is the WORKFLOW_PAT secret: a fine-grained PAT with
          # contents+pull-requests+workflows read/write on this repo.
          token: ${{ secrets.WORKFLOW_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "chore: update image dependencies"
          title: "chore: update image dependencies"
          body: |
            Automated update of dependencies consumed by OCI image profile builds.

            These updates modify `shared/download/image-checksums.json` and/or
            inline Syft, Cosign, and chunkah pins. They should trigger
            `build-images.yml`, not the sysext publishing workflow.

            **Please verify the image builds work before merging.**
          branch: auto-update-image-checksums
          delete-branch: true
