name: Check Package Updates

on:
  schedule:
    - cron: "0 8 * * *" # Daily at 8am UTC
  workflow_dispatch:

permissions: {}

jobs:
  check-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      # These packages are installed by sysext images from external APT repos.
      # package-versions.json is only a change-detection sentinel; mkosi still
      # resolves packages from APT during the sysext build.
      - name: Check latest package versions
        run: |
          set -euo pipefail
          source shared/download/package-version.sh

          {
            version="$(get_latest_package_version \
              'https://packages.microsoft.com/repos/code/dists/stable/main/binary-amd64/Packages.gz' \
              'code')"
            printf 'code=%s\n' "$version"

            version="$(get_latest_package_version \
              'https://download.docker.com/linux/debian/dists/trixie/stable/binary-amd64/Packages.gz' \
              'docker-ce')"
            printf 'docker-ce=%s\n' "$version"

            version="$(get_latest_package_version \
              'https://downloads.1password.com/linux/debian/amd64/dists/stable/main/binary-amd64/Packages.gz' \
              '1password-cli')"
            printf '1password-cli=%s\n' "$version"

            version="$(get_latest_package_version \
              'https://downloads.claude.ai/claude-desktop/apt/stable/dists/stable/main/binary-amd64/Packages.gz' \
              'claude-desktop')"
            printf 'claude-desktop=%s\n' "$version"
          } > latest-versions.txt
          cat latest-versions.txt

      - name: Compare and update versions
        id: compare
        run: |
          VERSIONS_FILE="shared/download/package-versions.json"
          HAS_UPDATES=false
          SUMMARY=""

          while IFS='=' read -r pkg version; do
            [ -z "$pkg" ] && continue
            [ "$version" = "(none)" ] && continue
            [ -z "$version" ] && continue

            current=$(jq -r --arg p "$pkg" '.[$p] // ""' "$VERSIONS_FILE")

            if [ "$current" != "$version" ]; then
              HAS_UPDATES=true
              if [ -z "$current" ]; then
                SUMMARY="${SUMMARY}${pkg}: (new) -> ${version}\n"
              else
                SUMMARY="${SUMMARY}${pkg}: ${current} -> ${version}\n"
              fi
              jq --arg p "$pkg" --arg v "$version" '.[$p] = $v' "$VERSIONS_FILE" > tmp.json && mv tmp.json "$VERSIONS_FILE"
            fi
          done < latest-versions.txt

          echo "has_updates=$HAS_UPDATES" >> "$GITHUB_OUTPUT"
          if [ "$HAS_UPDATES" = "true" ]; then
            echo -e "Updates found:\n$SUMMARY"
            {
              echo "summary<<EOF"
              echo -e "$SUMMARY"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "All packages up to date"
          fi

      - name: Create Pull Request
        if: steps.compare.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@4e1beaa7521e8b457b572c090b25bd3db56bf1c5 # v5
        with:
          # GITHUB_TOKEN-created PRs do not trigger workflows; set the
          # WORKFLOW_PAT repo secret to give auto-update PRs real CI (see
          # check-dependencies.yml for details).
          token: ${{ secrets.WORKFLOW_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "chore: update sysext package versions"
          title: "chore: update sysext package versions"
          body: |
            Automated update of external APT package version sentinels for sysext builds.

            ${{ steps.compare.outputs.summary }}

            **Please verify the builds work before merging.**
          branch: auto-update-packages
          delete-branch: true
