name: Test bootc secure contracts

on:
  pull_request:
    branches: [main]
    paths-ignore:
      # The redirect worker is deployed and validated by its own workflows;
      # it cannot affect bootc secure contracts or runner harnesses.
      - "workers/**"
      - ".github/workflows/build-installer-iso.yml"
      - ".github/workflows/deploy-native-installer-redirect.yml"
      # Workflows that never run on push/PR (scheduled, dispatch-only, or
      # issue/review-event) and repository metadata cannot affect the
      # contracts. build-images.yml is deliberately NOT ignored:
      # check-bootc-publication-guard.sh validates it on every contracts run.
      - ".github/workflows/ai-fix-requested.yml"
      - ".github/workflows/bootc-secure-nightly.yml"
      - ".github/workflows/build-mechanics.yml"
      - ".github/workflows/check-dependencies.yml"
      - ".github/workflows/check-packages.yml"
      - ".github/workflows/claude.yml"
      - ".github/workflows/native-nightly.yml"
      - ".github/workflows/nightly-compliance.yml"
      - ".github/workflows/scorecard.yml"
      - ".github/workflows/test-install.yml"
      - ".github/workflows/triage.yml"
      - ".github/workflows/build.yml"
      - ".github/workflows/build-native-images.yml"
      - ".github/workflows/validate.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/prompts/**"
      - ".github/actionlint.yaml"
      - ".github/auto-qa-tuning.json"
      - ".github/dependabot.yml"
      - ".github/renovate.json5"
      - ".github/copilot-instructions.md"
      - ".github/pull_request_template.md"
      # Agent context, top-level docs, and sysext dependency metadata feed no
      # bootc secure contract. docs/** stays a trigger: bootc-secure-docs-test
      # and the installer-contract test validate docs/bootc-secure-*.md.
      - ".agents/**"
      - ".claude/**"
      - ".knowledge/**"
      - ".memory/**"
      - "skills/**"
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "shared/download/package-versions.json"
      - "latest-versions.txt"
      - "shared/download/sysext-checksums.json"
      - "shared/download/image-checksums.json"
  push:
    branches: [main]
    paths-ignore:
      - "workers/**"
      - ".github/workflows/build-installer-iso.yml"
      - ".github/workflows/deploy-native-installer-redirect.yml"
      # Workflows that never run on push/PR (scheduled, dispatch-only, or
      # issue/review-event) and repository metadata cannot affect the
      # contracts. build-images.yml is deliberately NOT ignored:
      # check-bootc-publication-guard.sh validates it on every contracts run.
      - ".github/workflows/ai-fix-requested.yml"
      - ".github/workflows/bootc-secure-nightly.yml"
      - ".github/workflows/build-mechanics.yml"
      - ".github/workflows/check-dependencies.yml"
      - ".github/workflows/check-packages.yml"
      - ".github/workflows/claude.yml"
      - ".github/workflows/native-nightly.yml"
      - ".github/workflows/nightly-compliance.yml"
      - ".github/workflows/scorecard.yml"
      - ".github/workflows/test-install.yml"
      - ".github/workflows/triage.yml"
      - ".github/workflows/build.yml"
      - ".github/workflows/build-native-images.yml"
      - ".github/workflows/validate.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/prompts/**"
      - ".github/actionlint.yaml"
      - ".github/auto-qa-tuning.json"
      - ".github/dependabot.yml"
      - ".github/renovate.json5"
      - ".github/copilot-instructions.md"
      - ".github/pull_request_template.md"
      # Agent context, top-level docs, and sysext dependency metadata feed no
      # bootc secure contract. docs/** stays a trigger: bootc-secure-docs-test
      # and the installer-contract test validate docs/bootc-secure-*.md.
      - ".agents/**"
      - ".claude/**"
      - ".knowledge/**"
      - ".memory/**"
      - "skills/**"
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "shared/download/package-versions.json"
      - "latest-versions.txt"
      - "shared/download/sysext-checksums.json"
      - "shared/download/image-checksums.json"
  workflow_dispatch:
    inputs:
      run_snowfield_hardware:
        description: Run representative Snowfield hardware validation on its prepared runner
        required: false
        default: false
        type: boolean
      state_root:
        description: Absolute directory containing Snowfield hardware runner inputs
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  # Keep a manual Snowfield hardware run independent from push/PR contracts.
  # A newer run of the same event still supersedes its predecessor.
  group: test-bootc-secure-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate bootc publication guard
        run: ./check-bootc-publication-guard.sh
      - name: Validate bootc publication guard fixtures
        run: ./test/bootc-publication-guard-test.sh
      - name: Validate bootc release predecessor fixtures
        run: ./test/bootc-release-predecessor-test.sh
      - name: Validate bootc secure artifact fixtures
        run: ./test/bootc-secure-artifact-test.sh --fixtures
      - name: Validate bootc secure mutation fixtures
        run: ./test/bootc-secure-artifact-negative-test.sh --fixtures
      - name: Validate Task 1-3 feasibility fixtures
        run: ./test/bootc-secure-spike-test.sh --fixtures
      - name: Install cryptsetup for Task 2 recovery-key regression
        run: sudo apt-get update && sudo apt-get install --yes cryptsetup
      - name: Validate Task 2 recovery-key bytes
        run: sudo ./test/task2-recovery-key-bytes-test.sh
      - name: Validate Task 3 console recovery pump
        run: python3 ./test/task3-console-pump-test.py
      - name: Validate bootc secure package cleanup
        run: ./test/bootc-secure-package-cleanup-test.sh
      - name: Validate bootc container policy
        run: ./test/bootc-container-policy-test.sh
      - name: Validate bootloader reconciliation
        run: ./test/bootc-bootloader-reconcile-test.sh
      - name: Validate secure installer contract
        run: ./test/bootc-secure-install-contract-test.sh
      - name: Validate bootc secure operations documentation
        run: ./test/bootc-secure-docs-test.sh
      - name: Validate secure install harness fixtures
        run: ./test/bootc-secure-install-test.sh --fixtures
      - name: Validate secure update harness fixtures
        run: ./test/bootc-secure-update-test.sh --fixtures
      - name: Validate secure rotation harness fixtures
        run: ./test/bootc-secure-rotation-test.sh --fixtures
      - name: Validate remote publication fixtures
        run: ./test/bootc-secure-publication-test.sh
      - name: Validate authenticated promotion fixtures
        run: ./test/bootc-secure-promotion-test.sh

  snowfield-hardware:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.run_snowfield_hardware
    runs-on: [self-hosted, linux, x64, snowfield-hardware]
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run representative Snowfield hardware validation
        env:
          STATE_ROOT: ${{ inputs.state_root }}
        run: |
          set -euo pipefail
          if [[ $STATE_ROOT != /* || ! -d $STATE_ROOT ||
                $(stat -c '%a' "$STATE_ROOT") != 700 ||
                $(stat -c '%u' "$STATE_ROOT") != $(id -u) ]]; then
            echo "::error::state_root must be an absolute mode-0700 directory owned by the runner" >&2
            exit 1
          fi
          runner="$STATE_ROOT/snowfield-hardware-runner"
          [[ -x $runner ]] || {
            echo "::error::missing executable Snowfield hardware runner" >&2
            exit 1
          }
          set +e
          output=$("$runner" --state-root "$STATE_ROOT" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output" | tee /var/tmp/bootc-secure-snowfield-hardware.log
          [[ $status -eq 0 ]] && grep -Fqx 'BOOTC_SECURE_SNOWFIELD_HARDWARE: complete' <<<"$output"
      - name: Upload Snowfield hardware runner log
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootc-secure-snowfield-hardware-log
          path: /var/tmp/bootc-secure-snowfield-hardware.log
          retention-days: 30
          if-no-files-found: ignore
