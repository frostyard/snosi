name: Test bootc secure contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live:
        description: Run live secure install/update/rotation on a prepared self-hosted runner
        required: false
        default: false
        type: boolean
      run_snowfield_hardware:
        description: Run representative Snowfield hardware validation on its prepared runner
        required: false
        default: false
        type: boolean
      profile:
        description: Live profile
        required: false
        default: cayo
        type: choice
        options: [cayo, snow, snowfield]
      state_root:
        description: Absolute directory containing Task 9/10 artifacts and runner inputs
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: test-bootc-secure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Validate bootc publication guard
        run: ./check-bootc-publication-guard.sh
      - name: Validate bootc publication guard fixtures
        run: ./test/bootc-publication-guard-test.sh
      - name: Validate bootc release predecessor fixtures
        run: ./test/bootc-release-predecessor-test.sh
      - name: Validate bootc secure artifact fixtures
        run: ./test/bootc-secure-artifact-test.sh --fixtures
      - name: Validate bootc secure mutation fixtures
        run: ./test/bootc-secure-artifact-negative-test.sh --fixtures
      - name: Validate Task 1-3 feasibility fixtures
        run: ./test/bootc-secure-spike-test.sh --fixtures
      - name: Install cryptsetup for Task 2 recovery-key regression
        run: sudo apt-get update && sudo apt-get install --yes cryptsetup
      - name: Validate Task 2 recovery-key bytes
        run: sudo ./test/task2-recovery-key-bytes-test.sh
      - name: Validate Task 3 console recovery pump
        run: python3 ./test/task3-console-pump-test.py
      - name: Validate bootc secure package cleanup
        run: ./test/bootc-secure-package-cleanup-test.sh
      - name: Validate bootc container policy
        run: ./test/bootc-container-policy-test.sh
      - name: Validate bootloader reconciliation
        run: ./test/bootc-bootloader-reconcile-test.sh
      - name: Validate secure installer contract
        run: ./test/bootc-secure-install-contract-test.sh
      - name: Validate bootc secure operations documentation
        run: ./test/bootc-secure-docs-test.sh
      - name: Validate secure install harness fixtures
        run: ./test/bootc-secure-install-test.sh --fixtures
      - name: Validate secure update harness fixtures
        run: ./test/bootc-secure-update-test.sh --fixtures
      - name: Validate secure rotation harness fixtures
        run: ./test/bootc-secure-rotation-test.sh --fixtures
      - name: Validate remote publication fixtures
        run: ./test/bootc-secure-publication-test.sh
      - name: Validate authenticated promotion fixtures
        run: ./test/bootc-secure-promotion-test.sh

  live-full-window:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live
    runs-on: [self-hosted, linux, x64, bootc-secure]
    timeout-minutes: 360
    permissions:
      contents: read
      # The update leg's publisher advances a tracking tag with `skopeo copy`,
      # which is a real registry write. Granted here rather than as a standing
      # credential on the runner host: this token lives only for the job, and
      # the job is reachable only by workflow_dispatch, which already requires
      # repository write access.
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      # Assert KVM rather than granting it. This job runs on a self-hosted
      # runner attached to a PUBLIC repository, so the account executing it
      # must have no sudo at all: the previous `sudo tee /etc/udev/rules.d/...`
      # plus `sudo udevadm control --reload-rules` required exactly the
      # privilege an attacker would want, and required it on every run to set
      # a rule that only ever needs setting once.
      #
      # The udev rule is now host setup, applied once by the operator (see
      # docs/bootc-secure-operations.md). The runner account is a member of
      # the `kvm` group and needs nothing further.
      #
      # Checking /dev/kvm is readable AND writable, rather than merely present:
      # a missing group membership shows up as a permission error deep inside
      # QEMU minutes later, which is a far worse place to discover it.
      - name: Verify KVM is usable without privilege
        run: |
          set -euo pipefail
          [[ -c /dev/kvm ]] || {
            echo "/dev/kvm is missing; the host is not set up for this runner" >&2
            exit 1
          }
          [[ -r /dev/kvm && -w /dev/kvm ]] || {
            echo "/dev/kvm is not read-write for $(id -un) (groups: $(id -Gn))." >&2
            echo "Add the runner account to the kvm group; do NOT grant it sudo." >&2
            exit 1
          }
          echo "/dev/kvm usable as $(id -un)"
      # The runner host has a read-only /usr and no apt. It is NOT bare: the
      # incus sysext ships swtpm (and its whole suite), qemu-system-x86_64,
      # qemu-img and skopeo under /usr/incus/bin, and brew supplies the rest.
      # Put both on PATH rather than assuming /usr/bin has everything -- an
      # earlier audit of /usr/bin alone concluded swtpm was missing when it was
      # simply somewhere else.
      - name: Resolve the host toolchain
        run: |
          set -euo pipefail
          for d in /usr/incus/bin /home/linuxbrew/.linuxbrew/bin "$HOME/.local/bin"; do
            [[ -d $d ]] && echo "$d" >> "$GITHUB_PATH"
          done
          echo "--- resolved ---"
          PATH="/usr/incus/bin:/home/linuxbrew/.linuxbrew/bin:$HOME/.local/bin:$PATH"
          missing=()
          for t in qemu-system-x86_64 qemu-img swtpm skopeo cryptsetup objcopy \
                   sbverify virt-fw-vars socat ssh scp ss jq python3; do
            p=$(command -v "$t" 2>/dev/null) || { missing+=("$t"); printf '  %-20s MISSING\n' "$t"; continue; }
            printf '  %-20s %s\n' "$t" "$p"
          done
          if (( ${#missing[@]} )); then
            echo "::error::host is missing: ${missing[*]}" >&2
            echo "See shared/bootc-secure/ci/setup-self-hosted-runner.sh for how to add them." >&2
            exit 1
          fi

      - name: Log in to GHCR for the update publisher
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The publisher shells out to skopeo, which reads this login. Scoped
          # to the job's own token; nothing is written to the runner's HOME
          # beyond the containers auth file, which the job-completed hook does
          # not clear -- so log out again at the end (see the final step).
          printf '%s' "$GHCR_TOKEN" | skopeo login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Run prepared secure full window
        env:
          STATE_ROOT: ${{ inputs.state_root }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -o pipefail
          ./shared/bootc-secure/ci/run-full-window.sh "$STATE_ROOT" "$PROFILE" |& tee /var/tmp/bootc-secure-full-window.log
      - name: Upload full-window log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootc-secure-full-window-log-${{ inputs.profile }}
          path: /var/tmp/bootc-secure-full-window.log
          retention-days: 14
          if-no-files-found: ignore

      # always(), because a registry credential left behind by a FAILED run is
      # exactly the one nobody goes back for. The workspace hook does not touch
      # the containers auth file -- it lives in the runner account's HOME, not
      # in _work -- so this step is the only thing that removes it.
      - name: Log out of GHCR
        if: always()
        run: skopeo logout ghcr.io || true

  snowfield-hardware:
    if: github.event_name == 'workflow_dispatch' && inputs.run_snowfield_hardware
    runs-on: [self-hosted, linux, x64, snowfield-hardware]
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Run representative Snowfield hardware validation
        env:
          STATE_ROOT: ${{ inputs.state_root }}
        run: |
          set -euo pipefail
          source ./shared/bootc-secure/ci/run-full-window.sh
          validate_state_root "$STATE_ROOT" || {
            echo "::error::state_root must be an absolute mode-0700 directory owned by the runner" >&2
            exit 1
          }
          runner="$STATE_ROOT/snowfield-hardware-runner"
          [[ -x $runner ]] || {
            echo "::error::missing executable Snowfield hardware runner" >&2
            exit 1
          }
          set +e
          output=$("$runner" --state-root "$STATE_ROOT" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output" | tee /var/tmp/bootc-secure-snowfield-hardware.log
          [[ $status -eq 0 ]] && grep -Fqx 'BOOTC_SECURE_SNOWFIELD_HARDWARE: complete' <<<"$output"
      - name: Upload Snowfield hardware runner log
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootc-secure-snowfield-hardware-log
          path: /var/tmp/bootc-secure-snowfield-hardware.log
          retention-days: 30
          if-no-files-found: ignore
