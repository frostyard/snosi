name: Test bootc secure contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live:
        description: Run live secure install/update/rotation on a prepared self-hosted runner
        required: false
        default: false
        type: boolean
      run_snowfield_hardware:
        description: Run representative Snowfield hardware validation on its prepared runner
        required: false
        default: false
        type: boolean
      profile:
        description: Live profile
        required: false
        default: cayo
        type: choice
        options: [cayo, snow, snowfield]
      state_root:
        description: Absolute directory containing Task 9/10 artifacts and runner inputs
        required: false
        default: ""
        type: string
      dakota_ref:
        description: frostyard/dakota-iso ref supplying the external runner adapters
        required: false
        default: "main"
        type: string

permissions: {}

concurrency:
  group: test-bootc-secure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Validate bootc publication guard
        run: ./check-bootc-publication-guard.sh
      - name: Validate bootc publication guard fixtures
        run: ./test/bootc-publication-guard-test.sh
      - name: Validate bootc release predecessor fixtures
        run: ./test/bootc-release-predecessor-test.sh
      - name: Validate bootc secure artifact fixtures
        run: ./test/bootc-secure-artifact-test.sh --fixtures
      - name: Validate bootc secure mutation fixtures
        run: ./test/bootc-secure-artifact-negative-test.sh --fixtures
      - name: Validate Task 1-3 feasibility fixtures
        run: ./test/bootc-secure-spike-test.sh --fixtures
      - name: Install cryptsetup for Task 2 recovery-key regression
        run: sudo apt-get update && sudo apt-get install --yes cryptsetup
      - name: Validate Task 2 recovery-key bytes
        run: sudo ./test/task2-recovery-key-bytes-test.sh
      - name: Validate Task 3 console recovery pump
        run: python3 ./test/task3-console-pump-test.py
      - name: Validate bootc secure package cleanup
        run: ./test/bootc-secure-package-cleanup-test.sh
      - name: Validate bootc container policy
        run: ./test/bootc-container-policy-test.sh
      - name: Validate bootloader reconciliation
        run: ./test/bootc-bootloader-reconcile-test.sh
      - name: Validate secure installer contract
        run: ./test/bootc-secure-install-contract-test.sh
      - name: Validate bootc secure operations documentation
        run: ./test/bootc-secure-docs-test.sh
      - name: Validate secure install harness fixtures
        run: ./test/bootc-secure-install-test.sh --fixtures
      - name: Validate secure update harness fixtures
        run: ./test/bootc-secure-update-test.sh --fixtures
      - name: Validate secure rotation harness fixtures
        run: ./test/bootc-secure-rotation-test.sh --fixtures
      - name: Validate remote publication fixtures
        run: ./test/bootc-secure-publication-test.sh
      - name: Validate authenticated promotion fixtures
        run: ./test/bootc-secure-promotion-test.sh

  live-full-window:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live
    runs-on: [self-hosted, linux, x64, bootc-secure]
    timeout-minutes: 360
    permissions:
      contents: read
      # The update leg's publisher advances a tracking tag with `skopeo copy`,
      # which is a real registry write. Granted here rather than as a standing
      # credential on the runner host: this token lives only for the job, and
      # the job is reachable only by workflow_dispatch, which already requires
      # repository write access.
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      # Assert KVM rather than granting it. This job runs on a self-hosted
      # runner attached to a PUBLIC repository, so the account executing it
      # must have no sudo at all: the previous `sudo tee /etc/udev/rules.d/...`
      # plus `sudo udevadm control --reload-rules` required exactly the
      # privilege an attacker would want, and required it on every run to set
      # a rule that only ever needs setting once.
      #
      # The udev rule is now host setup, applied once by the operator (see
      # docs/bootc-secure-operations.md). The runner account is a member of
      # the `kvm` group and needs nothing further.
      #
      # Checking /dev/kvm is readable AND writable, rather than merely present:
      # a missing group membership shows up as a permission error deep inside
      # QEMU minutes later, which is a far worse place to discover it.
      - name: Verify KVM is usable without privilege
        run: |
          set -euo pipefail
          [[ -c /dev/kvm ]] || {
            echo "/dev/kvm is missing; the host is not set up for this runner" >&2
            exit 1
          }
          [[ -r /dev/kvm && -w /dev/kvm ]] || {
            echo "/dev/kvm is not read-write for $(id -un) (groups: $(id -Gn))." >&2
            echo "Add the runner account to the kvm group; do NOT grant it sudo." >&2
            exit 1
          }
          echo "/dev/kvm usable as $(id -un)"
      # The harness runs in a CONTAINER, not on the host.
      #
      # This host has a read-only /usr and no apt. It is not bare -- the incus
      # sysext supplies swtpm, qemu and skopeo -- but sbverify, socat and
      # virt-firmware are genuinely absent, and virt-firmware in particular
      # resolves onto `crypt_r`, which has to be COMPILED. Installing a build
      # toolchain on the lab host to satisfy a test dependency is the wrong
      # trade; the containerised toolchain the Argo lane already uses is
      # proven, and leaves nothing behind on selfie.
      #
      # Rootless podman, so the container maps to the unprivileged ghrunner
      # account rather than root. That mapping is also what makes the harness's
      # own ownership check pass: the host files are owned by ghrunner, which
      # appears as uid 0 inside, and the process runs as uid 0.
      - name: Run the secure window in a container
        env:
          STATE_ROOT: ${{ inputs.state_root }}
          PROFILE: ${{ inputs.profile }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DAKOTA_REF: ${{ inputs.dakota_ref }}
        run: |
          set -o pipefail
          # --group-add keep-groups is load-bearing, not defensive. /dev/kvm on
          # this host is 0660 root:kvm with NO acl, so access depends entirely
          # on ghrunner's kvm supplementary group -- and rootless podman drops
          # supplementary groups unless told otherwise. Without this the device
          # is passed through but unopenable.
          #
          # --runtime crun because keep-groups is a crun feature; the host has
          # both crun and runc, and leaving the choice to podman's default
          # would make this work or not depending on configuration elsewhere.
          podman run --rm \
            --runtime crun \
            --group-add keep-groups \
            --device /dev/kvm \
            -v "$PWD:/src/snosi" \
            -v "${STATE_ROOT}:${STATE_ROOT}" \
            -e STATE_ROOT -e PROFILE -e GHCR_TOKEN -e GHCR_USER -e DAKOTA_REF \
            -w /src/snosi \
            docker.io/library/debian:trixie-slim \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              # Assert the device is actually usable before spending minutes on
              # apt. A dropped supplementary group shows up here in seconds
              # instead of as an opaque QEMU failure much later.
              [ -r /dev/kvm ] && [ -w /dev/kvm ] || {
                echo "/dev/kvm not usable in-container (uid $(id -u), groups $(id -G))" >&2
                echo "check --group-add keep-groups and ghrunner kvm membership" >&2
                exit 1
              }
              apt-get update -qq
              # Same set the Argo secure lane installs, which is the only
              # toolchain this harness has ever run green against.
              apt-get install -y -qq --no-install-recommends \
                qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools \
                cryptsetup-bin binutils sbsigntool openssh-client iproute2 \
                jq python3 python3-pip socat git skopeo curl ca-certificates \
                gcc python3-dev libc6-dev >/dev/null
              # Not packaged in trixie; provides virt-fw-vars. Needs the gcc and
              # headers above because pip resolves it onto crypt_r.
              pip install --quiet --break-system-packages virt-firmware

              # Dakota supplies the external runner adapters. Cloned HERE, not
              # staged on the host: the runner home is 0750 ghrunner-owned so a
              # host-side clone needs sudo, and a root-owned checkout is then
              # unusable by the account that has to execute it. This also keeps
              # the adapters at a known ref instead of whatever happens to be
              # sitting on the box, which is how the Argo lane already works.
              git clone -q --depth 1 --branch "$DAKOTA_REF" \
                https://github.com/frostyard/dakota-iso.git /tmp/dakota
              echo "dakota @ $(git -C /tmp/dakota rev-parse --short HEAD) (${DAKOTA_REF})"

              # run-full-window invokes these by fixed name under STATE_ROOT,
              # and each sources lib/ relative to its own directory.
              install -m 0700 /tmp/dakota/test/bootc-secure-installer-runner.sh "$STATE_ROOT/installer"
              install -m 0700 /tmp/dakota/test/bootc-secure-recovery-runner.sh  "$STATE_ROOT/recovery-runner"
              install -m 0700 /tmp/dakota/test/bootc-secure-update-publish.sh   "$STATE_ROOT/publisher"
              mkdir -p "$STATE_ROOT/lib"
              cp -a /tmp/dakota/test/lib/. "$STATE_ROOT/lib/"
              # The publisher writes a tracking tag, so log in INSIDE the
              # container: the credential never touches the host filesystem and
              # dies with the container.
              printf "%s" "$GHCR_TOKEN" | skopeo login ghcr.io \
                --username "$GHCR_USER" --password-stdin
              ./shared/bootc-secure/ci/run-full-window.sh "$STATE_ROOT" "$PROFILE"
            ' |& tee /var/tmp/bootc-secure-full-window.log
      - name: Upload full-window log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootc-secure-full-window-log-${{ inputs.profile }}
          path: /var/tmp/bootc-secure-full-window.log
          retention-days: 14
          if-no-files-found: ignore

      # No host-side GHCR logout is needed: the login happens inside the
      # container and dies with it. What CAN outlive the job is a container
      # left running if the step was cancelled mid-run, holding /dev/kvm and
      # the target disk open -- which would make the next run fail in a way
      # that looks nothing like its cause.
      - name: Ensure no container survived the job
        if: always()
        run: |
          left=$(podman ps -q) || exit 0
          if [[ -n "$left" ]]; then
            echo "removing containers left behind: $left" >&2
            podman rm -f $left || true
          fi

  snowfield-hardware:
    if: github.event_name == 'workflow_dispatch' && inputs.run_snowfield_hardware
    runs-on: [self-hosted, linux, x64, snowfield-hardware]
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Run representative Snowfield hardware validation
        env:
          STATE_ROOT: ${{ inputs.state_root }}
        run: |
          set -euo pipefail
          source ./shared/bootc-secure/ci/run-full-window.sh
          validate_state_root "$STATE_ROOT" || {
            echo "::error::state_root must be an absolute mode-0700 directory owned by the runner" >&2
            exit 1
          }
          runner="$STATE_ROOT/snowfield-hardware-runner"
          [[ -x $runner ]] || {
            echo "::error::missing executable Snowfield hardware runner" >&2
            exit 1
          }
          set +e
          output=$("$runner" --state-root "$STATE_ROOT" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output" | tee /var/tmp/bootc-secure-snowfield-hardware.log
          [[ $status -eq 0 ]] && grep -Fqx 'BOOTC_SECURE_SNOWFIELD_HARDWARE: complete' <<<"$output"
      - name: Upload Snowfield hardware runner log
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootc-secure-snowfield-hardware-log
          path: /var/tmp/bootc-secure-snowfield-hardware.log
          retention-days: 30
          if-no-files-found: ignore
