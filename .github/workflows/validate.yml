name: Validate Scripts and Config

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  # Superseded validate runs of the same ref carry no information; a rapid
  # sequence of pushes to a PR branch otherwise stacks full runs.
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  installer-redirect-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: workers/native-installer-redirect
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workers/native-installer-redirect/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test and validate Worker
        run: npm run check

      - name: Validate deployment bundle
        run: npm run deploy:dry-run

  shell-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify shellcheck is available
        # ShellCheck ships preinstalled on the ubuntu-latest runner image.
        # Avoid apt here because host-level apt-get update can fail on
        # unrelated preconfigured third-party mirrors, as seen in #381.
        run: shellcheck --version

      - name: Lint shell scripts
        # Discover scripts by first-line shebang instead of extension globs:
        # the repo has many extensionless scripts (mkosi.finalize, mkosi.clean,
        # in-image usr/libexec/* runtime scripts, sysext-setup scripts) that
        # *.sh/*.chroot missed entirely. saved-unused/ is dead code excluded
        # from builds.
        run: |
          {
            git ls-files '*.sh' '*.chroot'
            git ls-files | xargs awk 'FNR==1 && /^#!\/(usr\/)?bin\/(env )?(ba)?sh/ {print FILENAME} {nextfile}' 2>/dev/null
          } | grep -v '^saved-unused/' | sort -u | xargs -r shellcheck -S warning -x

      - name: Validate policy as code
        # Fail closed if agent autonomy, human review, risk classification,
        # protected-boundary testing, or exception controls are weakened.
        run: python3 ./test/policy-as-code-test.py

      - name: Validate PR-facing build permissions
        # build.yml executes PR-controlled mkosi configuration as root, so its
        # build job must never regain package, OIDC, or attestation write scope.
        run: python3 ./test/build-workflow-permissions-test.py

      - name: Validate canonical Copilot automation secret
        # Keep both automation consumers on the fleet-wide name and retain a
        # visible failure when the organization secret is unavailable.
        run: python3 ./test/copilot-automation-secret-test.py

      - name: Validate TSS user initrd integration
        run: ./test/tss-user-initrd-static-test.sh

      - name: Validate installer catalog shape
        # shared/firn-installer/catalog.json replaces firn's builtin catalog
        # wholesale on the ISO; firn fails soft on malformed optional fields,
        # so the shape contract (family/ref/product split, default_groups
        # per frostyard/snosi#789) is pinned here instead.
        run: ./test/firn-catalog-test.sh

      - name: Validate Firn ISO Forky sandbox
        run: ./test/firn-installer-iso-test.sh --static

      - name: Validate installer ISO publication pipeline
        # Ephemeral OpenPGP key, local Range-capable HTTP origin, no R2 writes.
        run: ./test/iso-publication-pipeline-test.sh

      - name: Validate snosi-etc-diff drift tooling
        # Static, non-root regression test driving the real script against
        # fixture trees via its SNOSI_ETC_DIFF_LIVE_ETC/PRISTINE_ETC test
        # hooks. No root, no bind mount, no image build.
        run: ./test/snosi-etc-diff-test.sh

      - name: Validate persistent kernel argument tooling
        # PATH-stubbed UKI addon, Secure Boot, MOK, ESP, and durability
        # fixtures. No root, firmware access, image build, or real ESP.
        run: ./test/snosi-kargs-test.sh

      - name: Validate verified-download split checksum lookup
        # Fixture test ensures verified_download() resolves keys from both split
        # metadata files and honors CHECKSUMS_FILE overrides. No root, network,
        # or image build.
        run: ./test/verified-download-split-checksums-test.sh

      - name: Validate bounded APT package index parsing
        # PATH-stubbed network fixture covers transfer/decompression limits,
        # malformed gzip rejection, and Debian version selection.
        run: ./test/latest-apt-version-test.sh

      - name: Validate Forky systemd family sentinel
        # PATH-stubbed Sources.gz fixtures drive check-forky-systemd.sh through
        # the real bounded helper: newer/unchanged/stale-mirror/fail-closed
        # paths, the >50 MiB index cap, the PR body's three recheck
        # obligations against a derived systemd/forky consumer set, and the
        # check-packages.yml job's token scope and timeout. No root or network.
        run: ./test/check-forky-systemd-test.sh

      - name: Validate update-checksums split-file selection
        # shared/download/update-checksums.sh resolves an existing key by
        # searching sysext-checksums.json then image-checksums.json relative to
        # its own directory, with CHECKSUMS_FILE as an explicit single-file
        # override. Fixture test against a throwaway copy of that layout and
        # file:// payloads: asserts the update lands in the right file and the
        # siblings stay byte-identical. No root, no network, no image build.
        run: ./test/update-checksums-split-test.sh

      - name: Validate expensive-workflow path filters
        # Static guard: ISO-only changes run only the installer workflow;
        # docs and the standalone redirect worker do not fan out into image
        # matrices, and Scorecard remains schedule-driven.
        run: ./test/workflow-path-filter-test.sh

      - name: Validate dependency workflow token fallback
        # Workflow-file pin updates require WORKFLOW_PAT; checksum and chunkah
        # updates must remain publishable through the ordinary job token.
        run: ./test/check-dependencies-workflow-token-test.sh

      - name: Validate sysext signature verification
        # Static guard: every component requires signed metadata and both
        # systemd vendor-keyring names carry the canonical combined trust ring.
        run: ./test/sysext-signature-verification-test.sh

      - name: Validate sysext authoring inventory
        # Discover every tracked Overlay=yes image and reject missing manifests,
        # package identity, finalizers, update metadata, or orphan metadata.
        # Fixture-only and repository-static: no root, network, or image build.
        run: ./test/sysext-authoring-contract-test.sh

      - name: Validate sysext udev/module reload contract
        # Fixture suite for shared/sysext/tree's post-merge udev reload (udev
        # parses its rules before systemd-sysext merges, so a sysext-shipped
        # rule is otherwise never applied) plus static wiring parity across
        # every sysext claiming a udev rule or modules-load entry. No root,
        # network, or image build.
        run: ./test/sysext-udev-reload-test.sh

      - name: Validate himmelblau sysext integration and setup tool
        # Fixture suite for the himmelblau sysext's boot-time /etc integration
        # (idempotent nsswitch/PAM/krb5/GDM-keyring replay of the deb
        # postinsts, additions only, no runtime enable) and the
        # snosi-himmelblau-setup drop-in writer, plus tmpfiles/factory/
        # required-paths wiring parity. No root, network, or image build.
        run: ./test/himmelblau-sysext-setup-test.sh

      - name: Validate sysext required paths finalizer
        # Fixture regression test for whitespace-preserving parsing of sysext
        # required-paths.txt entries. No root, network, or image build.
        run: ./test/sysext-required-paths-test.sh

      - name: Validate Lemonade sysext integration
        # Lemonade 11.8 moved its environment template to /etc/default/lemond;
        # exercise the sysext's factory relocation and tmpfiles wiring.
        run: ./test/lemonade-sysext-test.sh

      - name: Validate Pilothouse sysext integration
        # Structural service/drop-in and direct-DEB dependency fixtures. No root,
        # network, live endpoints, or image build.
        run: ./test/pilothouse-sysext-test.sh

      - name: Validate Sunshine package dependencies
        # Fixture check for Sunshine's .deb dependencies. No root, network, or build.
        run: ./test/sunshine-package-dependencies-test.sh

      - name: Validate local mkosi profile dependency check
        # Fixture check for pinned local mkosi use. No root, network, or build.
        run: ./test/check-profile-dependencies-local-mkosi-test.sh

      - name: Validate Sunshine file capabilities
        # PATH-stubbed capability assertion fixture. No root, network, or build.
        run: ./test/sunshine-capabilities-test.sh

  publication-guard-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up BATS
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # v4.0.0
        with:
          bats-version: 1.14.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Nix client group access
        run: sudo python3 ./test/nix-client-group-test.py

      - name: Test publication guards
        run: bats --print-output-on-failure test/publication-guards.bats

      - name: Test runtime etc and package contracts
        run: |
          ./test/runtime-etc-guard-test.sh
          ./test/duplicate-packages-test.sh
          bash ./test/no-nbc-test.sh
          ./test/base-hardware-utils-test.sh
          ./test/wifi-backend-test.sh
          ./test/socat-package-test.sh

      - name: NBC package gate fixture
        run: bash ./test/check-no-nbc-package-test.sh

      - name: Test ssh account provisioning
        run: sudo python3 ./test/openssh-agent-group-test.py

      - name: Test NFS system accounts and tmpfiles ownership
        run: sudo bash ./test/nfs-system-accounts-test.sh

      - name: Test memberships account provisioning
        run: sudo python3 ./test/service-account-memberships-test.py

      - name: Test RequiredBy guard
        run: ./test/required-by-guard-test.sh

      - name: Test geoclue account provisioning
        run: sudo python3 ./test/geoclue-state-scope-test.py

      - name: Test gui-base sysext divergent-lib contract
        run: ./test/sysext-divergent-libs-test.sh

      - name: Test Sundog KDE bootc profile contract
        run: ./test/sundog-profile-test.sh

      - name: Test order account provisioning
        run: sudo python3 ./test/sysext-account-order-test.py

      - name: Test staged-update notify unit trigger shape
        run: ./test/update-notify-units-test.sh

      - name: Test gated retirement decision and plan
        run: python3 ./test/retirement-plan-test.py

      - name: Test --pkg-diff parser, sidecar, and stager contract
        run: ./test/pkg-diff-test.sh

  runtime-etc-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Forbid runtime /etc deletions in shipped payloads
        # Runtime `systemctl disable` (and friends) deletes .wants symlinks
        # from the live /etc; on bootc/composefs installs that makes the
        # /etc merge fail at update finalize and staged updates are silently
        # discarded. See CLAUDE.md "Runtime service enablement changes are
        # forbidden".
        run: ./check-runtime-etc-guard.sh

      - name: Forbid RequiredBy= enablement in shipped units
        # Preset-created .requires links persist in /etc; retiring the unit
        # from a later image bricks boot at "Failed to isolate default
        # target" (2026-08-12, snow-linux-live-setup.service). See
        # docs/adr/0013 and frostyard/core ADR-0030.
        run: ./check-required-by-guard.sh

  bootc-secure-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate bootc secure CI wiring
        run: ./test/bootc-secure-ci-test.sh
      - name: Validate bootc secure static contract and sysupdate masks
        run: ./test/bootc-secure-static-test.sh
      - name: Validate bootc publication guard
        run: ./check-bootc-publication-guard.sh
      - name: Validate bootc publication guard fixtures
        run: ./test/bootc-publication-guard-test.sh
      - name: Validate bootc release predecessor fixtures
        run: ./test/bootc-release-predecessor-test.sh
      - name: Validate bootc secure artifact fixtures
        run: ./test/bootc-secure-artifact-test.sh --fixtures
      - name: Validate bootc secure mutation fixtures
        run: ./test/bootc-secure-artifact-negative-test.sh --fixtures
      - name: Validate Task 1-3 feasibility fixtures
        run: ./test/bootc-secure-spike-test.sh --fixtures
      - name: Install cryptsetup for Task 2 recovery-key regression
        run: sudo apt-get update && sudo apt-get install --yes cryptsetup
      - name: Validate Task 2 recovery-key bytes
        run: sudo ./test/task2-recovery-key-bytes-test.sh
      - name: Validate Task 3 console recovery pump
        run: python3 ./test/task3-console-pump-test.py
      - name: Validate manual Snow bootc lab manifest contract
        # Shape and spec fixtures only; no VM, signing credentials or registry writes.
        run: python3 ./test/bootc-secure-lab-manifest-test.py
      - name: Validate bootc secure package cleanup
        run: ./test/bootc-secure-package-cleanup-test.sh
      - name: Validate bootc container policy
        run: ./test/bootc-container-policy-test.sh
      - name: Validate bootloader reconciliation
        run: ./test/bootc-bootloader-reconcile-test.sh
      - name: Validate secure installer contract
        run: ./test/bootc-secure-install-contract-test.sh
      - name: Validate bootc secure operations documentation
        run: ./test/bootc-secure-docs-test.sh
      - name: Validate secure install harness fixtures
        run: ./test/bootc-secure-install-test.sh --fixtures
      - name: Validate secure update harness fixtures
        run: ./test/bootc-secure-update-test.sh --fixtures
      - name: Validate secure rotation harness fixtures
        run: ./test/bootc-secure-rotation-test.sh --fixtures
      - name: Validate remote publication fixtures
        run: ./test/bootc-secure-publication-test.sh
      - name: Validate authenticated promotion fixtures
        run: ./test/bootc-secure-promotion-test.sh

  mkosi-config-sanity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup-mkosi
        uses: systemd/mkosi@71d7b67e01dc47ab5c51f24866c3e2195b9701d2

      - name: Validate mkosi configuration summaries
        run: |
          sudo mkosi summary > /dev/null
          ./check-profile-dependencies.sh
