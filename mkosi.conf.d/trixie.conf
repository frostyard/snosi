[Match]
Release=trixie

[Config]
# Sysexts that only trixie builds (ADR-0037). Upstream publishes no forky
# Sunshine deb, and the pinned debiantrixie deb depends on libminiupnpc18,
# which forky does not ship. mkosi has no way to remove a list item, so the
# sysext is added here, not in the shared Dependencies= of mkosi.conf.
# mkosi reads mkosi.conf.d/ before mkosi.profiles/, and every profile resets
# Dependencies=, so no OCI profile builds it.
Dependencies=sunshine
