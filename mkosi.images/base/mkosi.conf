

[Output]
Format=directory
ImageVersion=
ManifestFormat=json

[Content]
Bootable=no
CleanPackageMetadata=no
WithDocs=yes
# systemd 257 reads the .gpg vendor keyring while systemd 261 reads .pgp.
# The base needs only the Frostyard repository key used by repogen to sign
# sysext SHA256SUMS manifests. Native A/B profiles overlay their combined ring.
ExtraTrees=%D/mkosi.sandbox/etc/apt/keyrings/frostyard.gpg:/usr/lib/systemd/import-pubring.gpg
ExtraTrees=%D/mkosi.sandbox/etc/apt/keyrings/frostyard.gpg:/usr/lib/systemd/import-pubring.pgp

# Sysext base requirements
# Keep package metadata so sysexts can properly extend
Packages=erofs-utils
         zstd
         btrfs-progs
         ca-certificates
         curl
         dracut
         dosfstools
         e2fsprogs
         fdisk
         git
         git-lfs
         gpg
         iproute2
         iputils-ping
         rsync
         skopeo
         sudo
         tpm2-tools
         libcap2-bin
         attr
         xfsprogs
         systemd-cryptsetup
         libfido2-1
         libfido2-dev
         libtss2-esys-3.0.2-0
         libp11-kit0
         systemd
         systemd-boot
         kmod
         lvm2
         frostyard-nbc
         frostyard-updex
         efibootmgr
         shim-signed
         systemd-resolved

# Locales and keyboard
Packages=locales
         keyboard-configuration

# NetworkManager. Do NOT add network-manager-applet (or anything else
# depending on `policykit-1-gnome | polkit-1-auth-agent`) here: trixie has no
# policykit-1-gnome, so apt satisfies the virtual with an arbitrary desktop
# provider (observed: the entire Cinnamon desktop, or ukui-polkit + Qt5/GDAL/
# OpenCV) in EVERY image built on base, cayo included. GNOME on snow provides
# its own polkit agent and network UI; a profile that genuinely needs such a
# package must add it in its own package set together with an explicit
# lightweight agent (e.g. lxpolkit or mate-polkit).
Packages=network-manager
         wpasupplicant

# Shell alternatives
Packages=fish
         zsh

# Utilities
Packages=vim
         netcat-traditional
         socat
         openssh-server
         cifs-utils
         pciutils
         usbutils
         wget
         gcc
         g++
         make
         dpkg-dev
         procps

# virtiofs host daemon: shares host directories with VMs; required by bcvk
# (bootc VM test tool), which only finds it at standard system paths
Packages=virtiofsd

# Microcode
Packages=amd64-microcode
         intel-microcode
         iucode-tool

# Firmware update
Packages=fwupd
         fwupd-amd64-signed

# System utilities
Packages=jq
         less
         file
         hdparm
         kbd
         bc
         bolt
         iio-sensor-proxy

# initramfs
Packages=klibc-utils
         kpartx

# Misc
Packages=bash-completion
         appstream
         gnupg
         pcscd
         rtkit
         low-memory-monitor
         wireless-regdb
         usb-modeswitch
         usb-modeswitch-data
         usbmuxd
         sane-utils
         sane-airscan
         exfatprogs
         ntfs-3g
         unzip
         util-linux


# Containers/Incus support
Packages=apparmor
         nftables
         libbinutils
         libgprofng0
         binutils-common
         binutils-x86-64-linux-gnu
         distro-info-data
         gdisk
         ubuntu-keyring
