[Match]
Release=forky

[Content]
# The forky copy of base's backports pin. ExtraTrees= comes after
# mkosi.images/base/mkosi.extra, so this file replaces the trixie one (ADR-0037).
ExtraTrees=%D/shared/suite/forky/base-tree

# Debian testing's base-files ships no VERSION_ID; the sysext filename, the
# sysupdate %w specifier and every extension-release VERSION_ID need it.
PostInstallationScripts=%D/shared/suite/forky/version-id.postinst.chroot
