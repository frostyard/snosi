# Package identity belongs to the booted deployment (ADR-0021).
# L+ replaces stale files/populated directories and repairs links every boot.
# Keep alternatives, statoverride, lock*, updates and parts writable in /var.
d /var/lib/dpkg              0755 root root - -
d /var/lib/dpkg/alternatives 0755 root root - -
d /var/lib/dpkg/updates      0755 root root - -
d /var/lib/dpkg/parts        0755 root root - -
L+ /var/lib/dpkg/status      - - - - /usr/lib/sysimage/dpkg/status
L+ /var/lib/dpkg/info        - - - - /usr/lib/sysimage/dpkg/info
L+ /var/lib/dpkg/triggers    - - - - /usr/lib/sysimage/dpkg/triggers
L+ /var/lib/dpkg/diversions  - - - - /usr/lib/sysimage/dpkg/diversions
L+ /var/lib/dpkg/available   - - - - /usr/lib/sysimage/dpkg/available
L+ /var/lib/dpkg/arch-native - - - - /usr/lib/sysimage/dpkg/arch-native
