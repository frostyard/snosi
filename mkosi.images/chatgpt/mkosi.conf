[Config]
# Desktop-app sysext: built against gui-base (base + the common GUI lib
# closure) so the delta cannot carry product-divergent GUI libraries
# (issue #781); the no-divergent-libs finalize is the matching tripwire.
Dependencies=gui-base

[Output]
ImageId=chatgpt
Output=chatgpt
Overlay=yes
ManifestFormat=json
Format=sysext

[Content]
Bootable=no
BaseTrees=%O/gui-base
PostOutputScripts=%D/shared/sysext/postoutput/sysext-postoutput.sh
FinalizeScripts=%D/shared/sysext/finalize/sysext-usr-only.sh,%D/shared/sysext/finalize/sysext-required-paths.sh,%D/shared/sysext/finalize/sysext-strip-icon-cache.sh,%D/shared/sysext/finalize/sysext-no-divergent-libs.sh

# ChatGPT desktop app with Codex (from the official OpenAI APT repository at
# persistent.oaistatic.com/codex-app-prod/linux/deb in mkosi.sandbox).
# Installs entirely under /usr — no /opt relocation needed. The deb also ships
# a conffile /etc/apparmor.d/chatgpt (a userns-unconfined profile); mkosi's
# sysext format only packages /usr, so it is dropped — harmless, because
# Debian's kernel has no kernel.apparmor_restrict_unprivileged_userns and the
# app (which ships no setuid chrome-sandbox) uses ordinary unprivileged user
# namespaces.
# libglib2.0-bin pins the deb's trash-handler alternation
# (libglib2.0-bin | kde-cli-tools | kde-runtime | trash-cli | gvfs-bin). Base
# currently satisfies it, but if base ever stops shipping it, apt could pick
# a different alternative and silently drag extra packages into the delta.
Packages=chatgpt
         libglib2.0-bin

[Build]
Environment=KEYPACKAGE=chatgpt
# SYSEXT_REVISION forces a republish of the gui-base rebuild (issue #781)
# even though KEYPACKAGE's version is unchanged; remove when the package
# version next bumps.
Environment=SYSEXT_REVISION=1
