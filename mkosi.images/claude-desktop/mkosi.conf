[Config]
# Desktop-app sysext: built against gui-base (base + the common GUI lib
# closure) so the delta cannot carry product-divergent GUI libraries
# (issue #781); the no-divergent-libs finalize is the matching tripwire.
Dependencies=gui-base

[Output]
ImageId=claude-desktop
Output=claude-desktop
Overlay=yes
ManifestFormat=json
Format=sysext
# Publish compressed: CompressOutput= is a per-image (SettingScope.local)
# mkosi setting, so it cannot be inherited from the root config. The shared
# postoutput script discovers <name>.raw.zst and keeps the suffix on the
# versioned file; the transfer MatchPattern already prefers .raw.zst.
CompressOutput=zstd
CompressLevel=19

[Content]
Bootable=no
BaseTrees=%O/gui-base
PostOutputScripts=%D/shared/sysext/postoutput/sysext-postoutput.sh
FinalizeScripts=%D/shared/sysext/finalize/sysext-usr-only.sh,%D/shared/sysext/finalize/sysext-required-paths.sh,%D/shared/sysext/finalize/sysext-strip-icon-cache.sh,%D/shared/sysext/finalize/sysext-no-divergent-libs.sh,%D/shared/sysext/finalize/sysext-no-private-keys.sh,%D/shared/sysext/finalize/sysext-no-base-owned.sh,%D/shared/sysext/finalize/sysext-upholds-guard.sh,%D/shared/sysext/finalize/sysext-reload-manager-guard.sh

# Claude desktop app (from downloads.claude.ai/claude-desktop/apt in
# mkosi.sandbox). Installs entirely under /usr — no /opt relocation needed.
# gui-base lists libglib2.0-bin explicitly (mkosi.images/gui-base/mkosi.conf),
# so it stays in this sysext's base tree even if base drops it. It
# satisfies the trash-handler Depends
# (kde-cli-tools | kde-runtime | trash-cli | libglib2.0-bin | gvfs)
# without pulling the KDE dependency chain into the delta.
# List only packages missing from gui-base. mkosi 00c7f0bc8 reinstalls every
# Overlay=yes Packages= entry and keeps its files in the delta.
# sysext-no-base-owned.sh rejects copies that would shadow base files.
Packages=claude-desktop

[Build]
Environment=KEYPACKAGE=claude-desktop
# SYSEXT_REVISION forces a republish of the gui-base rebuild (issue #781)
# even though KEYPACKAGE's version is unchanged; remove when the package
# version next bumps.
Environment=SYSEXT_REVISION=1
