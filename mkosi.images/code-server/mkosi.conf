[Config]
Dependencies=base

[Output]
ImageId=code-server
Output=code-server
Overlay=yes
ManifestFormat=json
Format=sysext
# Publish compressed: CompressOutput= is a per-image (SettingScope.local)
# mkosi setting, so it cannot be inherited from the root config. The shared
# postoutput script discovers <name>.raw.zst and keeps the suffix on the
# versioned file; the transfer MatchPattern already prefers .raw.zst.
CompressOutput=zstd
CompressLevel=19

[Content]
Bootable=no
BaseTrees=%O/base
PostOutputScripts=%D/shared/sysext/postoutput/sysext-postoutput.sh
FinalizeScripts=%D/shared/sysext/finalize/sysext-usr-only.sh,%D/shared/sysext/finalize/sysext-required-paths.sh,%D/shared/sysext/finalize/sysext-strip-icon-cache.sh

[Build]
# NOTE: unlike every other sysext, code-server is not in Packages= — the deb
# is installed by mkosi.postinst.chroot via verified_download + dpkg -i. The
# postoutput script still resolves KEYPACKAGE from the merged dpkg database,
# so keep this in sync with the postinst if the install mechanism changes.
Environment=KEYPACKAGE=code-server
