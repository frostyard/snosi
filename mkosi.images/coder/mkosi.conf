[Config]
Dependencies=base

[Output]
ImageId=coder
Output=coder
Overlay=yes
ManifestFormat=json
Format=sysext
# Publish compressed: CompressOutput= is a per-image (SettingScope.local)
# mkosi setting, so it cannot be inherited from the root config. The shared
# postoutput script discovers <name>.raw.zst and keeps the suffix on the
# versioned file; the transfer MatchPattern already prefers .raw.zst.
CompressOutput=zstd
CompressLevel=19

[Content]
Bootable=no
BaseTrees=%O/base
PostOutputScripts=%D/shared/sysext/postoutput/sysext-postoutput.sh
FinalizeScripts=%D/shared/sysext/finalize/sysext-usr-only.sh,%D/shared/sysext/finalize/sysext-required-paths.sh,%D/shared/sysext/finalize/sysext-strip-icon-cache.sh,%D/shared/sysext/finalize/sysext-no-private-keys.sh,%D/shared/sysext/finalize/sysext-no-base-owned.sh,%D/shared/sysext/finalize/sysext-upholds-guard.sh,%D/shared/sysext/finalize/sysext-reload-manager-guard.sh

[Build]
# Like code-server, coder is not in Packages= — the deb is installed by
# mkosi.postinst.chroot via verified_download + dpkg -i (GitHub release, no
# apt repo). The postoutput script still resolves KEYPACKAGE from the merged
# dpkg database.
Environment=KEYPACKAGE=coder
# r2: republish with the CODER_ACCESS_URL gate (ExecCondition drop-in,
# snosi#1117). r3: the gate also needs a bind address, the factory coder.env
# sets CODER_HTTP_ADDRESS=127.0.0.1:3000, and a 60 s start limit stops any
# restart loop (snosi#1120). Same coder version. Remove when it bumps.
# r4 (snosi#1189): ship extension-release.coder with EXTENSION_RELOAD_MANAGER=1, so
# a first enable or an update starts the units in the same boot. Republish at
# the same version. Remove when the package version bumps.
Environment=SYSEXT_REVISION=4
