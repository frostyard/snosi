# Gate coder.service on a usable /etc/coder.d/coder.env (snosi#1117,
# snosi#1120), and stop a restart loop that the gate does not predict.
#
# The deb ships /etc/coder.d/coder.env as a non-empty 291-byte template with
# every key set to an empty value, so the unit's own
# ConditionFileNotEmpty=/etc/coder.d/coder.env passes on a fresh host.
# ExecCondition= replaces that with a real check: CODER_ACCESS_URL has a value
# and coder has a bind address. Exit 0 runs the unit; an exit code from 1 to
# 254 skips it without marking it failed, so Restart=on-failure does not loop.
#
# The + prefix runs the check as root, because an admin may make coder.env
# mode 0600.
#
# Start limit: the deb's coder.service has RestartSec=5 with
# StartLimitIntervalSec=10 and StartLimitBurst=3. Starts 5 s apart never put
# 3 starts in one 10 s window, so any configuration that coder rejects (a bad
# address, certificate or database URL) restarts it every 5 s, forever
# (snosi#1120). A 60 s window holds 3 starts 5 s apart, so the 4th start hits
# the limit and the unit stays failed. Fix the file, then run systemctl
# reset-failed coder.service and systemctl restart coder.service.
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=3

[Service]
ExecCondition=+/usr/lib/coder-sysext/coder-configured
