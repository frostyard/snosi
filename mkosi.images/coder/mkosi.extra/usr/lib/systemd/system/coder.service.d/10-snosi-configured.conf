# Gate coder.service on a configured CODER_ACCESS_URL (snosi#1117).
#
# The deb ships /etc/coder.d/coder.env as a non-empty 291-byte template with
# every key set to an empty value, so the unit's own
# ConditionFileNotEmpty=/etc/coder.d/coder.env passes on a fresh host and the
# server starts with no access URL. ExecCondition= replaces that with a real
# check: exit 0 runs the unit, an exit code from 1 to 254 skips it without
# marking it failed, so Restart=on-failure does not loop.
#
# The + prefix runs the check as root, because an admin may make coder.env
# mode 0600.
[Service]
ExecCondition=+/usr/lib/coder-sysext/coder-configured
