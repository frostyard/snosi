# PID 1 scans units before the sysext is merged, so a preset .wants link
# alone dangles and is dropped; Upholds= from this drop-in (new to systemd
# after the post-merge daemon-reload) is what actually starts coder.
#
# Only the setup unit is upheld. It is a RemainAfterExit oneshot (stays
# active, so upholding it is churn-free) and Wants= coder.service, which
# coder.service.d/10-snosi-configured.conf skips until CODER_ACCESS_URL is
# set: upholding coder.service directly makes systemd retry it forever, because
# a skipped unit does not stay active (snosi#1100, #1113).
# Same pattern as 10-k3s.conf and 10-himmelblau.conf.
[Unit]
Upholds=coder-sysext-setup.service
