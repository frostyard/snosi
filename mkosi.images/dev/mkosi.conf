[Config]
Dependencies=base

[Output]
ImageId=dev
Output=dev
Overlay=yes
ManifestFormat=json
Format=sysext

[Content]
Bootable=no
BaseTrees=%O/base
PostOutputScripts=%D/shared/sysext/postoutput/sysext-postoutput.sh
FinalizeScripts=%D/shared/sysext/finalize/sysext-usr-only.sh,%D/shared/sysext/finalize/sysext-required-paths.sh,%D/shared/sysext/finalize/sysext-strip-icon-cache.sh

Packages=build-essential
    make
    # autotools
    automake
    autoconf
    libtool
    pkg-config
    # cmake
    cmake
    ninja-build
    # python
    python3
    python3-pip
    python3-setuptools
    python3-venv
    # additional development tools
    valgrind
    gdb
    strace
    ltrace
    # for the snow installer
    live-build
    debootstrap
    # GTK4/WebKitGTK application development
    libgtk-4-dev
    libwebkitgtk-6.0-dev
    # A sysext-shipped GdkPixbuf loaders.cache shadows Snow's base cache.
    # Keep SVG registered so GNOME's Adwaita icons remain renderable.
    librsvg2-common


[Build]
Environment=KEYPACKAGE=build-essential
# r1 (2026-08-07): republish with libgtk-4-dev/libwebkitgtk-6.0-dev added —
# the build-essential version is unchanged, so publishing would otherwise
# skip-duplicates the existing filename. Remove when build-essential bumps.
# r2 (2026-09-01): rebuild against the SHRUNKEN base. 33455fc (2026-08-25,
# #771) dropped network-manager-applet, whose policykit-1-gnome |
# polkit-1-auth-agent virtual had been pulling an entire desktop into base.
# This sysext was last published 2026-08-07 (dev_12.12+r1), so its delta omitted
# libepoxy0, libgdk-pixbuf-2.0-0, libgstreamer1.0-0,
# libopus0 and libpango-1.0-0 as "already in the base";
# cayo now has none of them. Same defect class as incus r2 -- see
# docs/design/sysexts.md "A Sysext Delta Is Only Valid Against the Base It
# Was Built On".
# r3 (2026-09-01): r2's newly complete graphical closure also introduced a
# GdkPixbuf loaders.cache without the SVG loader. On Snow that singleton
# shadowed the base cache and made most GNOME Shell icons blank. Carry the SVG
# module explicitly and force a corrected publish. Remove when build-essential
# bumps.
Environment=SYSEXT_REVISION=3
