[Config]
Dependencies=base

[Output]
ImageId=dev
Output=dev
Overlay=yes
ManifestFormat=json
Format=sysext

[Content]
Bootable=no
BaseTrees=%O/base
PostOutputScripts=%D/shared/sysext/postoutput/sysext-postoutput.sh
FinalizeScripts=%D/shared/sysext/finalize/sysext-required-paths.sh,%D/shared/sysext/finalize/sysext-usr-only.sh,%D/shared/sysext/finalize/sysext-strip-icon-cache.sh

Packages=build-essential
    make
    # autotools
    automake
    autoconf
    libtool
    pkg-config
    # cmake
    cmake
    ninja-build
    # python
    python3
    python3-pip
    python3-setuptools
    python3-venv
    # additional development tools
    valgrind
    gdb
    strace
    ltrace
    # for the snow installer
    live-build
    debootstrap
    # GTK4/WebKitGTK application development
    libgtk-4-dev
    libwebkitgtk-6.0-dev


[Build]
Environment=KEYPACKAGE=build-essential
# r1 (2026-08-07): republish with libgtk-4-dev/libwebkitgtk-6.0-dev added —
# the build-essential version is unchanged, so publishing would otherwise
# skip-duplicates the existing filename. Remove when build-essential bumps.
Environment=SYSEXT_REVISION=1
