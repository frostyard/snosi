[Config]
# Desktop-app sysext: built against gui-base (base + the common GUI lib
# closure) so the delta cannot carry product-divergent GUI libraries
# (issue #781); the no-divergent-libs finalize is the matching tripwire.
Dependencies=gui-base

[Output]
ImageId=gitdesktop
Output=gitdesktop
Overlay=yes
ManifestFormat=json
Format=sysext
# Publish compressed: CompressOutput= is a per-image (SettingScope.local)
# mkosi setting, so it cannot be inherited from the root config. The shared
# postoutput script discovers <name>.raw.zst and keeps the suffix on the
# versioned file; the transfer MatchPattern already prefers .raw.zst.
CompressOutput=zstd
CompressLevel=19

[Content]
Bootable=no
BaseTrees=%O/gui-base
PostOutputScripts=%D/shared/sysext/postoutput/sysext-postoutput.sh
FinalizeScripts=%D/shared/sysext/finalize/sysext-usr-only.sh,%D/shared/sysext/finalize/sysext-required-paths.sh,%D/shared/sysext/finalize/sysext-strip-icon-cache.sh,%D/shared/sysext/finalize/sysext-no-divergent-libs.sh,%D/shared/sysext/finalize/sysext-no-private-keys.sh,%D/shared/sysext/finalize/sysext-no-base-owned.sh
# The GitDesktop .deb's Depends, kept explicit so `dpkg -i` configures
# cleanly. Only the ayatana appindicator stack lands in the delta: gui-base
# already carries webkit2gtk and GTK3.
Packages=libayatana-appindicator3-1
         libwebkit2gtk-4.1-0
         libgtk-3-0

[Build]
Environment=KEYPACKAGE=git-desktop
