# gui-base: the build base for DESKTOP-APP sysexts (issue #781).
#
# App sysexts are Overlay=yes deltas: every package the build base already
# has is omitted from the delta at apt level. Built against the server-ish
# `base`, an Electron/GTK app's delta carried its entire GUI lib closure --
# including libs the desktop products shipped from OTHER SUITES (on the
# trixie base, snowfield pinned mesa from trixie-backports through the
# Surface kernel fragment), and the merged sysext copy shadow-DOWNGRADED
# the product's lib for all of /usr (root-caused live 2026-08-25 on a
# since-retired Hyprland product that pinned libxkbcommon/pipewire/mesa
# from backports: chatgpt + claude-desktop deltas shipped trixie
# libxkbcommon 1.7 over its backports 1.13 and killed the compositor with a
# missing V_1.11.0 symbol; snow survived the same shadowing only because
# its versions happened to match). Since the 2026-09 move to a forky base
# every product takes the same suite's version, but the mechanism (delta
# omission by PRESENCE in the build base) is unchanged and the next
# cross-suite pin would reopen it, so gui-base stays.
#
# gui-base = base + the common GUI lib closure. THE CONTRACT: every package
# listed here MUST be in the installed closure of EVERY desktop product
# (snow and snowfield today -- snowfield shares snow's package set). The
# versions here are irrelevant -- delta omission is decided by package
# PRESENCE, and each product supplies its own version at merge time. Adding a package here that
# some desktop product lacks makes app sysexts lose that lib on that
# product, so additions must be re-verified against every desktop closure
# (base + that profile's manifest; for snow, base + apt --simulate of
# shared/packages/snow/mkosi.conf -- the 2026-08-26 verification
# procedure is recorded in docs/design/sysexts.md).
#
# Deliberately NOT here (verified absent from at least one desktop
# product's closure, 2026-08-26): libxss1 (snow), xdg-utils (snow), and
# zenity / fonts-liberation / the libayatana-appindicator+libdbusmenu stack
# / gnupg2 / libminiupnpc18 (absent from a since-retired desktop product
# the same verification covered; re-verify before promoting any of them
# now that only snow and snowfield remain) -- those
# stay in the deltas that need them, which is safe: a lib no product ships
# from a divergent suite cannot shadow-downgrade anything.
#
# This image is an internal build stage: never published, no transfer, no
# postoutput. Server/CLI sysexts stay on `base` (incus deliberately so: it
# needs its qemu GUI libs present on cayo, which lacks this closure --
# enabling lib-heavy server sysexts on a desktop product remains
# cautioned).

[Config]
Dependencies=base

[Output]
Format=directory
ImageId=gui-base
Output=gui-base
ImageVersion=
ManifestFormat=json

[Content]
Bootable=no
CleanPackageMetadata=no
WithDocs=yes
BaseTrees=%O/base

# GTK3 stack (every desktop product ships GTK3: snow/snowfield via GNOME)
Packages=libgtk-3-0t64
         libgdk-pixbuf-2.0-0
         libpango-1.0-0
         libpangocairo-1.0-0
         libcairo-gobject2
         libcairo-script-interpreter2
         libatk1.0-0t64
         libatk-bridge2.0-0t64
         libatspi2.0-0t64
         libepoxy0
         libharfbuzz0b
         libharfbuzz-subset0

# GTK4/libadwaita stack (snow/snowfield via GNOME)
Packages=libgtk-4-1
         libgtk-4-common
         libadwaita-1-0
         libgraphene-1.0-0

# X11/Wayland client libs
Packages=libxcomposite1
         libxcb-shape0
         libxkbfile1
         libxdamage1
         libxfixes3
         libxrandr2
         libxcursor1
         libxi6
         libxinerama1
         libxtst6
         libwayland-client0
         libwayland-cursor0
         libwayland-egl1
         libxkbcommon0
         libxkbcommon-x11-0

# GPU userspace (mesa is the canonical DIVERGENT family: on the trixie base
# snowfield got it from trixie-backports via the Surface kernel fragment
# while snow tracked trixie -- exactly the class this image exists to keep
# out of deltas)
Packages=libgbm1
         libgl1
         libegl1
         libgles2
         mesa-libgallium
         libvulkan1
# mesa-vulkan-drivers: chatgpt's deb hard-depends on it, and the mesa ICDs
# are the same divergent mesa family. Snow did not pull it until
# shared/packages/snow/mkosi.conf added it for exactly this contract
# (2026-08-26) -- keep the two in sync.
         mesa-vulkan-drivers
# VA-API client libs (hardware video accel; snow/snowfield via GNOME)
         libva2
         libva-drm2

# Audio (alsa + pipewire client are a divergent family whenever a product
# pins them from backports)
Packages=libasound2t64
         libpipewire-0.3-0t64
         libpulse0

# Desktop plumbing common to Electron/GTK apps
Packages=libnotify4
         libsecret-1-0
         libcups2t64
         libevdev2
         libinput10
         libwebkit2gtk-4.1-0
         libglib2.0-bin
         libglib2.0-data
         libnuma1
         xdg-desktop-portal
         xdg-desktop-portal-gtk
