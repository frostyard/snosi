[Config]
# Server and desktop products alike need Entra ID logins (SSH on floe, GDM on
# snow/snowfield), and nothing here links a GUI toolkit, so this is a
# base-built sysext, not a gui-base one (issue #781 concerns GUI lib closures).
Dependencies=base

[Output]
ImageId=himmelblau
Output=himmelblau
Overlay=yes
ManifestFormat=json
Format=sysext

[Content]
Bootable=no
BaseTrees=%O/base
PostOutputScripts=%D/shared/sysext/postoutput/sysext-postoutput.sh
FinalizeScripts=%D/shared/sysext/finalize/sysext-usr-only.sh,%D/shared/sysext/finalize/sysext-required-paths.sh,%D/shared/sysext/finalize/sysext-strip-icon-cache.sh

# Himmelblau Entra ID authentication, STABLE channel
# (mkosi.sandbox/etc/apt/sources.list.d/himmelblau.sources; version sentinel
# in shared/download/package-versions.json).
#
# The set below mirrors what the upstream `curl -fsSL https://himmelblau-idm.org/install | sh`
# bootstrapper selects on a Debian host that has sshd, a desktop and a
# browser, minus two packages that cannot ship in a /usr-only overlay:
#   - himmelblau-qr-greeter: hard Depends on gnome-shell, so it would drag the
#     whole GNOME closure into a base-built delta, and its postinst enables
#     the extension by compiling a dconf database under /etc. Deferred.
#   - himmelblau-apparmor: /etc/apparmor.d only (a sysext ships /usr), and
#     Trixie's apparmor package keeps the unix-chkpwd profile in complain
#     mode, so the pam-himmelblau postinst's attach_disconnected patch has
#     nothing to enforce either way.
# Everything the deb maintainer scripts do to /etc at install time is redone
# at boot by mkosi.extra/usr/lib/himmelblau/himmelblau-sysext-setup (see
# docs/design/sysexts.md "himmelblau"); the deb-shipped /etc files are
# captured to /usr/share/factory by mkosi.finalize and placed by tmpfiles.
Packages=himmelblau
         nss-himmelblau
         pam-himmelblau
         # /etc/ssh/sshd_config.d/30-himmelblau.conf: KbdInteractiveAuthentication
         # yes, which Debian's sshd_config turns off and which pam_himmelblau's
         # MFA prompts need. Shipped through factory + tmpfiles.
         himmelblau-sshd-config
         # Browser SSO: the user-scope D-Bus broker plus the linux-entra-sso
         # native-messaging host (Firefox reads /usr/lib/mozilla; the Chromium
         # and Chrome copies live in /etc and go through factory + tmpfiles).
         himmelblau-broker
         himmelblau-sso
         himmelblau-sso-policies
         # Office 365 web-app launchers (.desktop + hicolor icons).
         o365
         # Recommended by himmelblau: kinit/klist for the Kerberos ticket cache
         # himmelblaud-tasks maintains (enable_kerberos_cache defaults to true).
         # Trixie's krb5-user no longer creates /etc/krb5.conf; the sysext ships
         # a minimal factory copy whose only job is `includedir /etc/krb5.conf.d`.
         krb5-user

[Build]
Environment=KEYPACKAGE=himmelblau
