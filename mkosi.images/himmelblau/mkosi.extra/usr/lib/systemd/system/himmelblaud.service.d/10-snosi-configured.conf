# Skip himmelblaud cleanly until the machine is configured. himmelblaud 4.0.2
# exits 1 ("No provider was configured!") after ~13s of HSM init when no
# domain/issuer is set, and an unconfigured daemon in a restart loop is
# useless noise on every machine that merges the sysext before running
# snosi-himmelblau-setup. Either a main file or any conf.d drop-in counts as
# "configured" (the wizard writes the drop-in). This is a Condition, not a
# gate on Upholds=: multi-user.target.d/10-himmelblau.conf upholds ONLY the
# setup unit, because systemd retries an upheld unit whose condition fails
# continuously (measured live: 33 attempts in 12s, then "Will retry later").
[Unit]
ConditionPathExists=|/etc/himmelblau/himmelblau.conf
ConditionPathExistsGlob=|/etc/himmelblau/himmelblau.conf.d/*.conf
