# PID 1 scans units before the sysext is merged, so a preset .wants link
# alone dangles and is dropped; Upholds= from this drop-in (new to systemd
# after the post-merge daemon-reload) is what actually starts the stack.
#
# Only the setup unit is upheld. It is a RemainAfterExit oneshot (stays
# active, so upholding it is churn-free) and Wants= himmelblaud.service,
# which carries a ConditionPathExists gate on /etc/himmelblau configuration.
# Upholding himmelblaud directly would make systemd retry it continuously on
# an unconfigured machine (condition-failed units under Upholds= are retried
# with rate limiting -- measured live, 33 attempts in 12s). himmelblaud
# itself Wants= himmelblau-hsm-pin-init.service and Upholds=
# himmelblaud-tasks.service, so those need no entry here.
[Unit]
Upholds=himmelblau-sysext-setup.service
