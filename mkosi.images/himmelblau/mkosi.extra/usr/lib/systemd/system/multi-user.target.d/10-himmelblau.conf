# PID 1 scans units before the sysext is merged, so a preset .wants link
# alone dangles and is dropped; Upholds= from this drop-in (new to systemd
# after the post-merge daemon-reload) is what actually starts the stack.
# himmelblaud.service itself Wants= himmelblau-hsm-pin-init.service and
# Upholds= himmelblaud-tasks.service, so those need no entry here.
[Unit]
Upholds=himmelblau-sysext-setup.service himmelblaud.service
