# himmelblau sysext: /etc payload the debs would have installed directly.
# `C` copies from /usr/share/factory/etc/<path> only when the destination is
# absent, so a local edit is never overwritten and nothing is ever removed.
# (The daemons' own state directories come from the deb-shipped
# himmelblaud.conf / himmelblau-policies.conf / nss-himmelblau.conf rules.)

# Local configuration: the setup wizard writes a drop-in here, never the main
# file, so the deb's Debian defaults in /usr/lib/himmelblau/himmelblau.conf
# stay in force (a /etc main file would mask them, see himmelblau.conf(5)).
d /etc/himmelblau 0755 root root -
d /etc/himmelblau/himmelblau.conf.d 0755 root root -

# Kerberos: himmelblaud-tasks writes the tenant realm into /etc/krb5.conf.d,
# which krb5.conf must includedir (the setup script appends it to a
# pre-existing file; this factory copy covers the no-file case).
d /etc/krb5.conf.d 0755 root root -
C /etc/krb5.conf - - - - -

# sshd: KbdInteractiveAuthentication yes (himmelblau-sshd-config). Debian's
# sshd_config Includes sshd_config.d/*.conf FIRST and sshd keeps the first
# value it sees, so this drop-in wins over the stock `no` below it.
d /etc/ssh/sshd_config.d 0755 root root -
C /etc/ssh/sshd_config.d/30-himmelblau.conf - - - - -

# Browser SSO (himmelblau-sso, himmelblau-sso-policies): Chromium and Chrome
# read their native-messaging hosts and managed policies from /etc; Firefox's
# copy is under /usr/lib/mozilla and needs nothing here.
d /etc/chromium 0755 root root -
d /etc/chromium/native-messaging-hosts 0755 root root -
d /etc/chromium/policies 0755 root root -
d /etc/chromium/policies/managed 0755 root root -
C /etc/chromium/native-messaging-hosts/linux_entra_sso.json - - - - -
C /etc/chromium/policies/managed/himmelblau.json - - - - -
d /etc/opt 0755 root root -
d /etc/opt/chrome 0755 root root -
d /etc/opt/chrome/native-messaging-hosts 0755 root root -
d /etc/opt/chrome/policies 0755 root root -
d /etc/opt/chrome/policies/managed 0755 root root -
C /etc/opt/chrome/native-messaging-hosts/linux_entra_sso.json - - - - -
C /etc/opt/chrome/policies/managed/himmelblau.json - - - - -

# krb5-user registers its MIT tools through update-alternatives, so
# /usr/bin/kinit etc. are symlinks into /etc/alternatives -- which a sysext
# never ships, leaving them dangling on the installed system. Recreate the
# alternatives links (same pattern as the incus sysext's xz/lzma links).
d /etc/alternatives 0755 root root - -
L /etc/alternatives/kadmin - - - - /usr/bin/kadmin.mit
L /etc/alternatives/kadmin.1.gz - - - - /usr/share/man/man1/kadmin.mit.1.gz
L /etc/alternatives/kdestroy - - - - /usr/bin/kdestroy.mit
L /etc/alternatives/kdestroy.1.gz - - - - /usr/share/man/man1/kdestroy.mit.1.gz
L /etc/alternatives/kinit - - - - /usr/bin/kinit.mit
L /etc/alternatives/kinit.1.gz - - - - /usr/share/man/man1/kinit.mit.1.gz
L /etc/alternatives/klist - - - - /usr/bin/klist.mit
L /etc/alternatives/klist.1.gz - - - - /usr/share/man/man1/klist.mit.1.gz
L /etc/alternatives/kpasswd - - - - /usr/bin/kpasswd.mit
L /etc/alternatives/kpasswd.1.gz - - - - /usr/share/man/man1/kpasswd.mit.1.gz
L /etc/alternatives/ksu - - - - /usr/bin/ksu.mit
L /etc/alternatives/ksu.1.gz - - - - /usr/share/man/man1/ksu.mit.1.gz
L /etc/alternatives/kswitch - - - - /usr/bin/kswitch.mit
L /etc/alternatives/kswitch.1.gz - - - - /usr/share/man/man1/kswitch.mit.1.gz
L /etc/alternatives/ktutil - - - - /usr/bin/ktutil.mit
L /etc/alternatives/ktutil.1.gz - - - - /usr/share/man/man1/ktutil.mit.1.gz
