# Placed by the himmelblau sysext (usr/lib/tmpfiles.d/himmelblau-sysext.conf)
# only when no /etc/krb5.conf exists. himmelblaud-tasks maintains the Entra
# tenant's realm as a drop-in under /etc/krb5.conf.d/; this file exists so
# that directory is honoured. Local realms can be added below or as further
# drop-ins.
includedir /etc/krb5.conf.d/

[libdefaults]
	rdns = false
