[Config]
Dependencies=base

[Output]
ImageId=incus
Output=incus
Overlay=yes
ManifestFormat=json
Format=sysext

[Content]
Bootable=no
BaseTrees=%O/base
PostOutputScripts=%D/shared/sysext/postoutput/sysext-postoutput.sh
FinalizeScripts=%D/shared/sysext/finalize/sysext-usr-only.sh,%D/shared/sysext/finalize/sysext-required-paths.sh,%D/shared/sysext/finalize/sysext-strip-icon-cache.sh

# Incus (Frostyard repository build; Debian forky's own incus is 7.0.x)
Packages=incus
         incus-extra
         incus-ui-canonical
         dnsmasq-base
         ovmf
         qemu-kvm
         qemu-utils
         qemu-system-gui
         qemu-system-modules-spice
         ipxe-qemu
         genisoimage
         virt-viewer
         # A sysext-shipped GdkPixbuf loaders.cache shadows Snow's base cache.
         # Keep SVG registered so GNOME's Adwaita icons remain renderable.
         librsvg2-common

[Build]
Environment=KEYPACKAGE=incus
# r1 (2026-07-06): republish with the multi-user.target.d Upholds drop-in
# (52b2bfb landed after the last package-version-keyed publish) and supersede
# the broken 202607011055 build.
#
# r2 (2026-09-01): rebuild against the SHRUNKEN base. Until 33455fc
# (2026-08-25, #771) base transitively pulled an entire desktop (via
# network-manager-applet's policykit-1-gnome virtual), so the r1 delta --
# built 2026-08-04 -- omitted libgtk-3-0t64, libepoxy0, libgstreamer1.0-0,
# libopus0 and the rest of the GTK3 closure as "already in the base". After
# #771 cayo has none of them, and the incus deb's own bundled
# /usr/incus/bin/qemu-system-x86_64 (NEEDED: libepoxy.so.0) could not load.
# incusd's wrapper puts /usr/incus/bin first on PATH, so THAT qemu is the one
# it probes: it failed, incusd never registered the qemu driver, and every
# `incus launch --vm` died with: Instance type "virtual-machine" is not
# supported on this server: Failed getting QEMU version. Snow was unaffected
# because GNOME supplies the same libs. virt-viewer, remote-viewer and qemu's
# ui-gtk.so were broken the same way. Every lib involved is a declared
# dependency of a package already listed above, so the rebuild alone restores
# them; required-paths.txt now pins the four load-bearing sonames so a base
# that shrinks again fails the build instead of shipping.
#
# r3 (2026-09-01): r2's newly complete graphical closure also introduced a
# GdkPixbuf loaders.cache without the SVG loader. On Snow that singleton
# shadowed the base cache and made most GNOME Shell icons blank. Carry the SVG
# module explicitly and force a corrected publish. Remove when the incus
# package version bumps.
Environment=SYSEXT_REVISION=3
