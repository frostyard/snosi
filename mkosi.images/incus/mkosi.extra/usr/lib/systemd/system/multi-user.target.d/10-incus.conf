# incus-lxcfs.service is not upheld: it has ConditionVirtualization=!container,
# and systemd retries an upheld unit whose condition fails, forever
# (snosi#1100, #1113). incus-sysext-setup.service (a RemainAfterExit oneshot,
# churn-free) Wants= it instead; a Wants= pull is a single clean skip.
[Unit]
Upholds=incus-sysext-setup.service incus.socket incus-user.socket incus-startup.service
