[Config]
Dependencies=base

[Output]
ImageId=k3s
Output=k3s
Overlay=yes
ManifestFormat=json
Format=sysext
# Publish compressed: CompressOutput= is a per-image (SettingScope.local)
# mkosi setting, so it cannot be inherited from the root config. The shared
# postoutput script discovers <name>.raw.zst and keeps the suffix on the
# versioned file; the transfer MatchPattern already prefers .raw.zst.
CompressOutput=zstd
CompressLevel=19

[Content]
Bootable=no
BaseTrees=%O/base
PostOutputScripts=%D/shared/sysext/postoutput/sysext-postoutput.sh
FinalizeScripts=%D/shared/sysext/finalize/sysext-usr-only.sh,%D/shared/sysext/finalize/sysext-required-paths.sh,%D/shared/sysext/finalize/sysext-strip-icon-cache.sh

[Build]
# k3s ships as a single static binary from GitHub releases (no apt repo, no
# deb). mkosi.postinst.chroot downloads it via verified_download and registers
# it with dpkg through a locally built stub deb so the shared postoutput
# script can resolve KEYPACKAGE/version from the merged dpkg database, same
# as every other sysext.
Environment=KEYPACKAGE=k3s
