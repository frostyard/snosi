# PID 1 scans units before the sysext is merged, so a preset .wants link
# alone dangles and is dropped; Upholds= from this drop-in (new to systemd
# after the post-merge daemon-reload) is what actually starts k3s.
#
# Only the setup unit is upheld. It is a RemainAfterExit oneshot (stays
# active, so upholding it is churn-free) and Wants= k3s.service and
# k3s-agent.service. Exactly one of those has a failing Condition on any
# node; upholding them directly makes systemd retry the failed one forever
# (snosi#1100). Same pattern as 10-himmelblau.conf.
[Unit]
Upholds=k3s-sysext-setup.service
