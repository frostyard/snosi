[Config]
Dependencies=base

[Output]
ImageId=lemonade
Output=lemonade
Overlay=yes
ManifestFormat=json
Format=sysext
# Publish compressed: CompressOutput= is a per-image (SettingScope.local)
# mkosi setting, so it cannot be inherited from the root config. The shared
# postoutput script discovers <name>.raw.zst and keeps the suffix on the
# versioned file; the transfer MatchPattern already prefers .raw.zst.
CompressOutput=zstd
CompressLevel=19

[Content]
Bootable=no
BaseTrees=%O/base
PostOutputScripts=%D/shared/sysext/postoutput/sysext-postoutput.sh
FinalizeScripts=%D/shared/sysext/finalize/sysext-usr-only.sh,%D/shared/sysext/finalize/sysext-strip-product-mesa.sh,%D/shared/sysext/finalize/sysext-required-paths.sh,%D/shared/sysext/finalize/sysext-strip-icon-cache.sh,%D/shared/sysext/finalize/sysext-no-private-keys.sh,%D/shared/sysext/finalize/sysext-no-base-owned.sh,%D/shared/sysext/finalize/sysext-upholds-guard.sh,%D/shared/sysext/finalize/sysext-reload-manager-guard.sh

# List only packages missing from base. mkosi 00c7f0bc8 reinstalls every
# Overlay=yes Packages= entry and keeps its files in the delta.
# sysext-no-base-owned.sh rejects copies that would shadow base files.
# The postinst's dpkg -i finds the other Depends in base.
# On trixie, libcpp-httplib0.41 comes from the low-priority backports
# sandbox source, which wins as the sole candidate.
Packages=libcpp-httplib0.41
         libmbedcrypto16
         libwebsockets19t64
         fonts-katex

[Build]
# Like coder, lemonade-server is not in Packages= — the deb is installed by
# mkosi.postinst.chroot via verified_download + dpkg -i (GitHub release, no
# apt repo). The postoutput script still resolves KEYPACKAGE from the merged
# dpkg database.
Environment=KEYPACKAGE=lemonade-server
# r1 (snosi#1189): ship extension-release.lemonade with EXTENSION_RELOAD_MANAGER=1, so
# a first enable or an update starts the units in the same boot. Republish at
# the same lemonade-server version. Remove when the package version bumps.
Environment=SYSEXT_REVISION=1
