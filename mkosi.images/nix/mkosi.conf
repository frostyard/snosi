[Config]
Dependencies=base

[Output]
ImageId=nix
Output=nix
Overlay=yes
ManifestFormat=json
Format=sysext

[Content]
Bootable=no
BaseTrees=%O/base
PostOutputScripts=%D/shared/sysext/postoutput/sysext-postoutput.sh
FinalizeScripts=%D/shared/sysext/finalize/sysext-usr-only.sh,%D/shared/sysext/finalize/sysext-required-paths.sh,%D/shared/sysext/finalize/sysext-strip-icon-cache.sh

# Nix package manager
Packages=nix-setup-systemd

[Build]
Environment=KEYPACKAGE=nix-setup-systemd
# r3: ship a distinct, root-owned store/factory tmpfiles fragment.
# Remove when the package version bumps.
Environment=SYSEXT_REVISION=3
