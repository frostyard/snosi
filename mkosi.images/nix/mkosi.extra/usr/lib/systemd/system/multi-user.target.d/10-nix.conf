# PID 1 scans units before the sysext is merged, so a preset .wants link
# alone dangles and is dropped; Upholds= from this drop-in (new to systemd
# after the post-merge daemon-reload) is what actually starts nix.
#
# nix.mount has no condition and is upheld directly. The daemon units have
# ConditionPathIsReadWrite=/nix/var/nix/daemon-socket, so they are not upheld
# (systemd retries an upheld unit whose condition fails, forever: snosi#1100,
# #1113); nix-sysext-setup.service (a RemainAfterExit oneshot, churn-free)
# Wants= them instead.
[Unit]
Upholds=nix.mount nix-sysext-setup.service
