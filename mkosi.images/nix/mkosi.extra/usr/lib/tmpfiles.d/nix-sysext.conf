# snosi#1111: this file must not share a name with base's nix.conf. mkosi
# Overlay=yes drops every sysext path that also exists in base.
# Base's nix.conf creates /var/lib/nix, the backing directory mounted at /nix.
# The multi-user store is owned by root; nixbld is a group, not a user.
d /var/lib/nix/store 1775 root nixbld - -

# snosi#1164: the same four rules as Debian's nix-daemon.conf, but on the
# mount source /var/lib/nix instead of /nix. systemd-tmpfiles-setup.service and
# reload-sysext.service run before nix.mount, while /nix is an empty directory
# on the read-only root. The old rules failed there with exit 73, and
# reload-sysext.service then skipped its daemon-reload, so no sysext unit
# loaded. On /var these rules always work; the bind mount shows the result at
# /nix/var/nix/..., which nix-daemon.socket needs (ConditionPathIsReadWrite=).
# mkosi.finalize deletes Debian's file and fails if its rules change.
d /var/lib/nix/var/nix/daemon-socket 0770 root nix-users - -
e! /var/lib/nix/var/nix/daemon-socket - - - 0
d /var/lib/nix/var/nix/gcroots/per-user 1777 - - - -
d /var/lib/nix/var/nix/profiles/per-user 1777 - - - -

# Factory config injection; local settings are never replaced.
C /etc/nix - - - - -
