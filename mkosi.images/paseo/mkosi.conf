[Config]
Dependencies=base

[Output]
ImageId=paseo
Output=paseo
Overlay=yes
ManifestFormat=json
Format=sysext

[Content]
Bootable=no
BaseTrees=%O/base
# Downloads the pinned Paseo .deb via verified_download, relocates
# /opt/Paseo -> /usr/lib/Paseo, repoints the update-alternatives symlink and
# the desktop file Exec
PostInstallationScripts=%D/shared/packages/paseo/mkosi.postinst.d/paseo.chroot
PostOutputScripts=%D/shared/sysext/postoutput/sysext-postoutput.sh
FinalizeScripts=%D/shared/sysext/finalize/sysext-usr-only.sh,%D/shared/sysext/finalize/sysext-required-paths.sh,%D/shared/sysext/finalize/sysext-strip-icon-cache.sh

[Include]
# Runtime deps for the Paseo .deb
Include=%D/shared/packages/paseo/mkosi.conf

[Build]
Environment=KEYPACKAGE=paseo
# r1 (2026-09-01): Paseo 0.7.0's GTK3 closure shipped a GdkPixbuf
# loaders.cache without the SVG loader. On Snow that singleton shadowed the
# base cache and made most GNOME Shell icons blank. Carry the SVG module
# explicitly and force a corrected publish. Remove when Paseo's version bumps.
Environment=SYSEXT_REVISION=1
