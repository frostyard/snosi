[Config]
Dependencies=base

[Output]
ImageId=pilothouse
Output=pilothouse
Overlay=yes
ManifestFormat=json
Format=sysext
# Publish compressed: CompressOutput= is a per-image (SettingScope.local)
# mkosi setting, so it cannot be inherited from the root config. The shared
# postoutput script discovers <name>.raw.zst and keeps the suffix on the
# versioned file; the transfer MatchPattern already prefers .raw.zst.
CompressOutput=zstd
CompressLevel=19

[Content]
Bootable=no
BaseTrees=%O/base
PostOutputScripts=%D/shared/sysext/postoutput/sysext-postoutput.sh
FinalizeScripts=%D/shared/sysext/finalize/sysext-usr-only.sh,%D/shared/sysext/finalize/sysext-required-paths.sh,%D/shared/sysext/finalize/sysext-strip-icon-cache.sh

[Build]
# frostyard-pilothouse is downloaded from GitHub rather than an APT repository,
# so mkosi.postinst.chroot installs it directly. Its declared runtime
# dependencies are kept explicit in Packages= (or supplied by the merged base)
# and checked against the buildroot before dpkg mutates it. The postoutput
# script resolves KEYPACKAGE from the merged dpkg database.
Environment=KEYPACKAGE=frostyard-pilothouse
