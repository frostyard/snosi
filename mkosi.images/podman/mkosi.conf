[Config]
Dependencies=base

[Output]
ImageId=podman
Output=podman
Overlay=yes
ManifestFormat=json
Format=sysext
# Publish compressed: CompressOutput= is a per-image (SettingScope.local)
# mkosi setting, so it cannot be inherited from the root config. The shared
# postoutput script discovers <name>.raw.zst and keeps the suffix on the
# versioned file; the transfer MatchPattern already prefers .raw.zst.
CompressOutput=zstd
CompressLevel=19

[Content]
Bootable=no
BaseTrees=%O/base
PostOutputScripts=%D/shared/sysext/postoutput/sysext-postoutput.sh
FinalizeScripts=%D/shared/sysext/finalize/sysext-usr-only.sh,%D/shared/sysext/finalize/sysext-required-paths.sh,%D/shared/sysext/finalize/sysext-strip-icon-cache.sh

# Podman/ Distrobox / Containers
Packages=podman
         distrobox

# Container extras
Packages=aardvark-dns
         buildah
         catatonit
         containernetworking-plugins
         containers-storage
         criu
         crun
         fuse-overlayfs
         slirp4netns
         passt

[Build]
Environment=KEYPACKAGE=podman
