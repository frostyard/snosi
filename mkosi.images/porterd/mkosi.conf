[Config]
Dependencies=base

[Output]
ImageId=porterd
Output=porterd
Overlay=yes
ManifestFormat=json
Format=sysext
# Publish compressed: CompressOutput= is a per-image (SettingScope.local)
# mkosi setting, so it cannot be inherited from the root config. The shared
# postoutput script discovers <name>.raw.zst and keeps the suffix on the
# versioned file; the transfer MatchPattern already prefers .raw.zst.
CompressOutput=zstd
CompressLevel=19

[Content]
Bootable=no
BaseTrees=%O/base
PostOutputScripts=%D/shared/sysext/postoutput/sysext-postoutput.sh
FinalizeScripts=%D/shared/sysext/finalize/sysext-usr-only.sh,%D/shared/sysext/finalize/sysext-required-paths.sh,%D/shared/sysext/finalize/sysext-strip-icon-cache.sh,%D/shared/sysext/finalize/sysext-no-private-keys.sh,%D/shared/sysext/finalize/sysext-no-base-owned.sh,%D/shared/sysext/finalize/sysext-upholds-guard.sh,%D/shared/sysext/finalize/sysext-reload-manager-guard.sh

[Build]
# frostyard-porterd is downloaded from GitHub rather than an APT repository,
# so mkosi.postinst.chroot installs it directly (core ADR-0058: Lodge's
# first-party apps ship as sysexts). Its release is pinned by SHA-256 in
# shared/download/sysext-checksums.json, and build.yml verifies the GitHub
# build-provenance attestation of that pin before mkosi runs (ADR-0024). The
# declared runtime dependencies are supplied by the merged base and checked
# against the buildroot before dpkg mutates it. The postoutput script resolves
# KEYPACKAGE from the merged dpkg database.
Environment=KEYPACKAGE=frostyard-porterd
