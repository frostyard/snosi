[Config]
# Desktop-app sysext: built against gui-base (base + the common GUI lib
# closure) so the delta cannot carry product-divergent GUI libraries
# (issue #781); the no-divergent-libs finalize is the matching tripwire.
Dependencies=gui-base

[Output]
ImageId=sunshine
Output=sunshine
Overlay=yes
ManifestFormat=json
Format=sysext

[Content]
Bootable=no
BaseTrees=%O/gui-base
# Shared sysext payload: snosi-sysext-udev-reload.service + its script.
# udev parses its rules before systemd-sysext.service merges the overlay,
# so the deb's 60-sunshine.rules and its uhid modules-load entry are
# otherwise never applied on any boot. See docs/design/sysexts.md.
ExtraTrees=%D/shared/sysext/tree
PostOutputScripts=%D/shared/sysext/postoutput/sysext-postoutput.sh
FinalizeScripts=%D/shared/sysext/finalize/sysext-usr-only.sh,%D/shared/sysext/finalize/sysext-required-paths.sh,%D/shared/sysext/finalize/sysext-strip-icon-cache.sh,%D/shared/sysext/finalize/sysext-no-divergent-libs.sh
# Runtime closure of the pinned deb. The tray moved from GTK3/appindicator/
# libnotify to Qt6 in v2026.906.222525 (readelf DT_NEEDED: libQt6Widgets/Gui/
# Core, libXtst; no GTK, no Qt5). qt6-qpa-plugins/qt6-wayland are libqt6gui6
# Recommends that mkosi never installs, but QGuiApplication aborts the whole
# process when no platform plugin loads, so they are hard requirements here.
Packages=debianutils
         libcap2
         libcurl4t64
         libdrm2
         libevdev2
         libgbm1
         libglib2.0-0t64
         libicu76
         libminiupnpc18
         libnuma1
         libopus0
         libpipewire-0.3-0t64
         libpulse0
         libqt6core6t64
         libqt6gui6
         libqt6svg6
         libqt6widgets6
         libssl3t64
         libva2
         libva-drm2
         libvulkan1
         libwayland-client0
         libx11-6
         libxtst6
         miniupnpc
         qt6-qpa-plugins
         qt6-wayland

[Build]
Environment=KEYPACKAGE=sunshine
