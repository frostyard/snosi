[Config]
# Desktop-app sysext: built against gui-base (base + the common GUI lib
# closure) so the delta cannot carry product-divergent GUI libraries
# (issue #781); the no-divergent-libs finalize is the matching tripwire.
Dependencies=gui-base

[Output]
ImageId=sunshine
Output=sunshine
Overlay=yes
ManifestFormat=json
Format=sysext

[Content]
Bootable=no
BaseTrees=%O/gui-base
# Shared sysext payload: snosi-sysext-udev-reload.service + its script.
# udev parses its rules before systemd-sysext.service merges the overlay,
# so the deb's 60-sunshine.rules and its uhid modules-load entry are
# otherwise never applied on any boot. See docs/design/sysexts.md.
ExtraTrees=%D/shared/sysext/tree
PostOutputScripts=%D/shared/sysext/postoutput/sysext-postoutput.sh
FinalizeScripts=%D/shared/sysext/finalize/sysext-required-paths.sh,%D/shared/sysext/finalize/sysext-strip-icon-cache.sh,%D/shared/sysext/finalize/sysext-no-divergent-libs.sh
Packages=debianutils
         libcap2
         libcurl4t64
         libdrm2
         libevdev2
         libgbm1
         libglib2.0-0t64
         libgtk-3-0t64
         libayatana-appindicator3-1
         libicu76
         libminiupnpc18
         libnotify4
         libnuma1
         libopus0
         libpipewire-0.3-0t64
         libpulse0
         libssl3t64
         libva2
         libva-drm2
         libvulkan1
         libwayland-client0
         libx11-6
         miniupnpc

[Build]
Environment=KEYPACKAGE=sunshine
# SYSEXT_REVISION forces a republish of the gui-base rebuild (issue #781)
# and of the udev-reload fix even though KEYPACKAGE's version is unchanged;
# remove when the package version next bumps.
Environment=SYSEXT_REVISION=2
