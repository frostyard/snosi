[Config]
# Desktop-app sysext: built against gui-base (base + the common GUI lib
# closure) so the delta cannot carry product-divergent GUI libraries
# (issue #781) — voxtype's deb depends on libasound2t64, one of the
# divergent families a product can pin from backports; the
# no-divergent-libs finalize is the matching tripwire.
Dependencies=gui-base

[Output]
ImageId=voxtype
Output=voxtype
Overlay=yes
ManifestFormat=json
Format=sysext

[Content]
Bootable=no
BaseTrees=%O/gui-base
# Shared sysext payload: snosi-sysext-udev-reload.service + its script.
# udev parses its rules before systemd-sysext.service merges the overlay,
# so this sysext's 80-uinput.rules is otherwise never applied on any boot
# and ydotoold cannot open /dev/uinput. See docs/design/sysexts.md.
ExtraTrees=%D/shared/sysext/tree
PostOutputScripts=%D/shared/sysext/postoutput/sysext-postoutput.sh
FinalizeScripts=%D/shared/sysext/finalize/sysext-usr-only.sh,%D/shared/sysext/finalize/sysext-required-paths.sh,%D/shared/sysext/finalize/sysext-strip-icon-cache.sh,%D/shared/sysext/finalize/sysext-no-divergent-libs.sh

# voxtype comes from the Frostyard APT repository (built by
# frostyard/omarchy-apps); apt resolves its runtime dependencies.
# The text-output chain is bundled so the sysext works on every desktop
# product: wtype (wlroots virtual-keyboard typing),
# ydotool (uinput typing, the only driver GNOME/mutter supports — snow;
# trixie has no ydotool, so apt takes the sandbox's trixie-backports
# candidate, same pattern as lemonade's libcpp-httplib0.41), and
# wl-clipboard for voxtype's clipboard/paste fallback. ydotool's deb
# ships its own user service and the 80-uinput udev rule (input-group
# access); that rule reaches udev only because
# snosi-sysext-udev-reload.service re-reads the rules after the merge.
Packages=voxtype
         wtype
         ydotool
         wl-clipboard

[Build]
Environment=KEYPACKAGE=voxtype
# SYSEXT_REVISION forces a republish of the udev-reload fix even though
# KEYPACKAGE's version is unchanged; remove when the package version bumps.
Environment=SYSEXT_REVISION=1
