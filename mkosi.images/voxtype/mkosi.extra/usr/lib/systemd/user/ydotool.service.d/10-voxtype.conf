# The deb's unit is Restart=always with the default RestartSec=100ms, so its
# five permitted starts burn out in half a second and the unit lands in
# start-limit-hit permanently. That is how the /dev/uinput permission bug
# presented (voxtype transcribed, then silently used its clipboard
# fallback). snosi-sysext-udev-reload.service is ordered before
# multi-user.target and so already fixed the node by the time any user
# session starts, but a five-attempt window spread over ~20s instead of
# ~0.5s means a slow boot cannot resurrect that failure mode.
[Service]
RestartSec=5s
