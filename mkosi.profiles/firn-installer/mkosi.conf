# SPDX-License-Identifier: LGPL-2.1-or-later
#
# Single-installer ISO profile (firn ADR-0010: one installer ISO for all
# snosi image families, built here as the successor to native-installer;
# boot-chain mechanism per docs/native-ab-contracts.md §8). Independent of
# every other profile: no BaseTrees (cancels the root mkosi.conf's
# BaseTrees=%O/base -- this profile must never inherit the shared bootc/
# sysext base image) and no Dependencies (builds nothing else first).
#
# Not itself an ISO: mkosi produces a plain rootfs directory
# (shared/firn-installer/mkosi.conf sets Format=directory). Turning that
# into the actual bootable ISO -- assembling the Debian-signed shim/GRUB/
# kernel chain and the El Torito/GPT-hybrid disc image -- is a separate step
# run after `mkosi --profile firn-installer build`:
# shared/firn-installer/tools/build-iso.sh. See `just firn-installer-iso`.

[Config]
Dependencies=

[Output]
ImageId=firn-installer
Output=firn-installer

[Content]
BaseTrees=

[Include]
Include=%D/shared/firn-installer/mkosi.conf
