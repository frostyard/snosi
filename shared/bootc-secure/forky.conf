[Match]
Release=forky

[Content]
# The forky secure assembly contract: the trixie contract with the forky bootc
# version in .assembly.bootc_version, .assembly.compatibility and
# .installer.minimum_versions.bootc. This tree comes after
# shared/bootc-secure/tree, so its bootc-secure.json wins (ADR-0037).
ExtraTrees=%D/shared/bootc-secure/suite/forky/tree
