#
# Secure composition for OCI bootc profiles only. It deliberately does not
# provide signing keys or assemble a UKI; Tasks 5 and later own that path.

[Build]
# Forky stays isolated to the secure bootc composition. The low pin keeps all
# unrelated packages on Trixie while the explicit systemd family stays ABI
# coherent for the bootloader, cryptsetup, and TPM userspace.
# Deliberate exception: Snow/Snowfield select plain wsdd (absent from Trixie)
# from Forky, retaining Trixie's Python dependencies. No other non-systemd
# consumer is intended. shared/download/forky-versions.json monitors wsdd too;
# every bump requires a desktop dependency solve and GVfs discovery recheck.
SandboxTrees=%D/shared/bootc-secure/package-manager

[Content]
ExtraTrees=%D/shared/bootc-secure/tree
# Disables the NvPCR stale-anchor consumers. A tree cannot do this: the
# definitions under /usr/lib/nvpcr are enumerated at build time, exactly as
# Keeps SRK setup and signed-PCR-11 LUKS.
FinalizeScripts=%D/shared/bootc-secure/finalize/disable-nvpcr.chroot
# The MOK certificate and PCR signer are public verification material shared
# with native A/B. Private signing material must never enter an OCI image.
ExtraTrees=%D/cosign.pub:/usr/lib/snosi/cosign.pub
ExtraTrees=%D/shared/native-ab/keys/mok-2026.crt:/usr/lib/snosi/mok.crt
ExtraTrees=%D/shared/native-ab/keys/pcr-signing-2026.pub:/usr/lib/snosi/pcr-signing.pub
# systemd-container/forky ships the upstream distro keyring at
# /usr/lib/systemd/import-pubring.pgp. Installing it here overwrites the
# Frostyard key that the base tree put there, and systemd 262 reads no
# /usr/lib .gpg fallback, so every sysext transfer then fails with "No public
# key". Extra trees land after package installation: restore both names.
ExtraTrees=%D/mkosi.sandbox/etc/apt/keyrings/frostyard.gpg:/usr/lib/systemd/import-pubring.gpg
ExtraTrees=%D/mkosi.sandbox/etc/apt/keyrings/frostyard.gpg:/usr/lib/systemd/import-pubring.pgp

# Keep the whole systemd family on Forky. Mixing its libraries with Trixie's
# systemd breaks cryptsetup/TPM token compatibility and systemd-boot tooling.
Packages=libnss-myhostname/forky
         libnss-mymachines/forky
         libnss-systemd/forky
         libpam-systemd/forky
         libsystemd-shared/forky
         libsystemd0/forky
         libudev1/forky
         systemd/forky
         systemd-boot/forky
         systemd-boot-efi/forky
         systemd-boot-tools/forky
         systemd-container/forky
         systemd-cryptsetup/forky
         systemd-repart/forky
         systemd-resolved/forky
         systemd-sysv/forky
         systemd-timesyncd/forky
         systemd-tpm/forky
         systemd-ukify/forky
         udev/forky

# Explicit tools for MOK enrollment, encrypted-root recovery, TPM inspection,
# and the later UKI signing/validation assembly step.
Packages=mokutil
         cryptsetup
         cryptsetup-bin
         tpm2-tools
         sbsigntool
         openssl
