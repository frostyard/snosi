# systemd-coredump records each crash in the journal for snosi-health and
# chairlift (T857a, ADR-0029). Storage=none keeps no core file on disk, so a
# crash costs no disk space and leaves no memory image of the process.
# ProcessSizeMax caps the memory that systemd-coredump reads to make the stack
# text. shared/bootc-secure/finalize/coredump.finalize checks both values.
[Coredump]
Storage=none
ProcessSizeMax=1G
