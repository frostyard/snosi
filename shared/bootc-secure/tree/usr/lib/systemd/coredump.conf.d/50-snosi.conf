# systemd-coredump records each crash in the journal for snosi-health and
# chairlift (T857a, ADR-0029). Storage=none keeps no core file after
# processing, so no memory image of the process stays on disk. While
# systemd-coredump makes the stack text, it can still use temporary disk
# space of up to ProcessSizeMax for the core; ProcessSizeMax caps that and
# the memory it reads. shared/bootc-secure/finalize/coredump.finalize checks
# both values.
[Coredump]
Storage=none
ProcessSizeMax=1G
