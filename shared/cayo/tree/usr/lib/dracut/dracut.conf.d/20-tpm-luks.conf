# systemd-pcrextend: dracut >= 105 renamed 01systemd-pcrphase to
# 11systemd-pcrextend (forky ships dracut 112; trixie's 106 still knew the old
# name). The binary it packs, /usr/lib/systemd/systemd-pcrextend, lives in
# systemd-tpm on systemd 261, which base installs explicitly.
add_dracutmodules+=" fido2 tpm2-tss pkcs11 systemd-pcrextend tss-user "
