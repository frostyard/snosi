[Content]
# flurry tree (snow-derived bootc/base infrastructure minus GNOME, plus the
# Hyprland/Omarchy integration files)
ExtraTrees=%D/shared/desktop/tree
ExtraTrees=%D/shared/flurry/tree

# The Omarchy plymouth theme is vendored to /usr/share/plymouth/themes/omarchy
# by the omarchy.chroot BuildScript below; BuildScript $DESTDIR output and
# ExtraTrees both land BEFORE PostInstallationScripts run, so the dracut
# postinst (first script below) sees the theme when it generates the final
# initrd, and the plymouthd.conf overwrite (ExtraTrees) happens after dpkg
# finishes -- never ship that conffile via SkeletonTrees (dpkg prompts on a
# pre-existing conffile and the build dies at EOF on non-interactive stdin).
# No splash KernelCommandLine here: flurry is bootc-only, and bootc injects
# rhgb quiet at install time (the snow fragment's splash kargs only matter
# for native A/B UKIs, which flurry does not build).

# omarchy vendor: pinned basecamp/omarchy tree + override layer
BuildScripts=%D/shared/flurry/scripts/build/omarchy.chroot
# vendored essentials: JetBrainsMono Nerd Font, mise
BuildScripts=%D/shared/flurry/scripts/build/flurry-extras.chroot
# brew build script (CLI-tool install remap target, same as snow/cayo)
BuildScripts=%D/shared/scripts/build/brew.chroot

# dracut
PostInstallationScripts=%D/shared/kernel/scripts/postinst/mkosi.postinst.chroot
# image customizations
PostInstallationScripts=%D/shared/flurry/scripts/postinstall/flurry.postinst.chroot
# manifest postoutput
PostOutputScripts=%D/shared/manifest/postoutput/mkosi.postoutput
# image finalize
FinalizeScripts=%D/shared/outformat/image/finalize/mkosi.finalize.chroot
# per-product /var factory-state audit (must run after the image finalize
# above; see CLAUDE.md "Native /var Factory State")
FinalizeScripts=%D/shared/composition/var-audit.finalize

[Include]
# flurry packages
Include=%D/shared/packages/flurry/mkosi.conf
