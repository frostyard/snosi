[Content]
# product-neutral desktop tmpfiles (saned/upower state dirs shared with sundog)
# and the snow tree
ExtraTrees=%D/shared/desktop/tree
ExtraTrees=%D/shared/snow/tree

# The snow tree also carries the Snow plymouth theme (two-step config +
# flower watermark under usr/share/plymouth/themes/, Theme=snow in
# etc/plymouth/plymouthd.conf). ExtraTrees is the correct delivery point:
# the final initrd is generated by the dracut PostInstallationScript below,
# which runs AFTER ExtraTrees land, so plymouth-populate-initrd sees the
# theme; and the plymouthd.conf overwrite happens after dpkg finishes, so
# there is no interactive conffile prompt (a SkeletonTrees copy of that
# conffile hard-fails the build: dpkg prompts on a pre-existing conffile at
# install and hits EOF on mkosi's non-interactive stdin).
# The splash arguments are not set here: mkosi KernelCommandLine= reaches no
# bootc product. shared/bootc-secure/assemble-uki.sh seals "splash quiet"
# into the UKI command line of every rootfs that ships plymouthd (ADR-0033).

# dracut
PostInstallationScripts=%D/shared/kernel/scripts/postinst/mkosi.postinst.chroot
# image customizations
PostInstallationScripts=%D/shared/snow/scripts/postinstall/snow.postinst.chroot
# brew build script
BuildScripts=%D/shared/scripts/build/brew.chroot
# hotedge build script
BuildScripts=%D/shared/snow/scripts/build/hotedge.chroot
# logomenu build script
BuildScripts=%D/shared/snow/scripts/build/logomenu.chroot
# bazaar companion build script
BuildScripts=%D/shared/snow/scripts/build/bazaar.chroot
# manifest postoutput
PostOutputScripts=%D/shared/manifest/postoutput/mkosi.postoutput
# core Flatpak set on disk matches its flatpaks/ source
PostOutputScripts=%D/shared/composition/core-flatpaks.postoutput
# image finalize
FinalizeScripts=%D/shared/outformat/image/finalize/mkosi.finalize.chroot
# Freeze deployment-correct dpkg identity without moving persistent alternatives.
FinalizeScripts=%D/shared/outformat/image/finalize/package-metadata.finalize
# updex-update.timer must ship and be in the enablement manifest (needs the finalize above)
FinalizeScripts=%D/shared/outformat/image/finalize/updex-timer.finalize
# Fails the build when a preset enables snosi-health.timer without its units,
# its collector or its enablement-manifest entry (ADR-0029).
FinalizeScripts=%D/shared/outformat/image/finalize/snosi-health-timer.finalize
# reject build-time private keys (runs after the finalize above removes them)
FinalizeScripts=%D/shared/security/no-private-keys.finalize
# per-product /var factory-state audit (must run after the image finalize
# above; dpkg's persistent seed is retained alongside its immutable snapshot)
FinalizeScripts=%D/shared/composition/var-audit.finalize
# exactly one chairlift first-login trigger on Snow/Snowfield, none on
# Sundog/Floe (ADR-0028)
FinalizeScripts=%D/shared/composition/first-login.finalize
# GVfs Windows discovery requires the backend and its executable helper.
FinalizeScripts=%D/shared/snow/finalize/wsdd-provider.finalize
# core Flatpak set at /usr/share/frostyard/<IMAGE_ID>.core-flatpaks.json
FinalizeScripts=%D/shared/composition/core-flatpaks.finalize

[Include]
# snow packages
Include=%D/shared/packages/snow/mkosi.conf
