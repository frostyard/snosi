# SPDX-License-Identifier: LGPL-2.1-or-later
#
# Content fragment for mkosi.profiles/firn-installer -- the SINGLE installer
# ISO for all snosi image families (firn ADR-0010), successor to
# shared/native-installer. Payload-free of product content: no Snow,
# Snowfield, or Cayo trees. The installer frontend is firn's TUI (a single
# static Go binary running as a tty1 + serial kiosk -- no compositor, no
# GTK, no Python; the whole native-installer setup-gui stack is gone), and
# the package payload below must satisfy firn's step-declared tool
# preflight for BOTH install families (bootc and native A/B) -- firn's
# internal/steps is the contract for what must be present.
#
# The ISO itself boots through a fully Debian-trusted pre-enrollment Secure
# Boot chain (Microsoft db -> Debian-signed shim -> Debian-signed GRUB ->
# Debian-signed stock kernel), assembled entirely OUTSIDE mkosi by
# shared/firn-installer/tools/build-iso.sh (mkosi has no ISO/El Torito
# output format -- checked the pinned man page's Format= enumeration). This
# fragment only produces the plain rootfs directory that script packs into
# the ISO's ESP and initramfs.
#
# Bootable=no and no ShimBootloader=/SecureBoot=/UnifiedKernelImages= here:
# mkosi's own UKI/systemd-boot signing pipeline is not used at all for this
# profile. The kernel that actually boots is Debian's OWN Secure-Boot-signed
# stock package (see shared/firn-installer/tools/build-iso.sh), not anything
# mkosi builds or signs.

[Output]
Format=directory
ManifestFormat=json

[Build]
# Forky sandbox reused verbatim from the production native-ab secure fragment
# (same directory, not copied) -- docs/native-ab-contracts.md §8 requires a
# coherent Forky systemd 261 cryptsetup/TPM family in the installer userspace
# even though the boot KERNEL stays Debian-signed stock trixie.
SandboxTrees=%D/shared/native-ab-secure/package-manager

[Content]
Bootable=no
CleanPackageMetadata=yes
WithDocs=no

# Pre-seed first-boot identity at BUILD time (mkosi runs systemd-firstboot
# itself and writes /etc/{locale.conf,localtime,hostname,shadow} directly)
# so systemd-firstboot.service has nothing left to ask at runtime.
# Root-caused live: with these unset, systemd-firstboot.service blocks the
# WHOLE boot indefinitely on an interactive timezone prompt on the serial
# console -- no TTY is feeding it an answer, so it hangs forever (looked
# exactly like a silent kernel/systemd deadlock until traced to this).
# RootPassword=hashed: (colon, no hash after it) is mkosi's documented way
# to create an UNLOCKED account with no password -- appropriate here: SSH
# access is still gated on PermitRootLogin prohibit-password (Debian's
# default, unchanged) plus the installer's own injected authorized_keys,
# so this only affects local serial/console login, exactly the "serial
# login" path docs/native-ab-contracts.md §8 names as a boot-chain proof
# path alongside SSH.
Locale=C.UTF-8
Keymap=us
Timezone=UTC
Hostname=snosi-installer
RootPassword=hashed:

# Coherent Forky systemd 261 family (cryptsetup/TPM enrollment tooling must be
# 261, not trixie's older systemd -- contract §8, "257-created tokens are
# unsupported"; firn's tpm-enroll step runs systemd-cryptenroll, which ships
# in systemd-cryptsetup). Deliberately excludes systemd-boot*/
# systemd-container: this profile never uses systemd-boot, and per-A/B-slot
# bootloader packages don't belong in a payload-free installer.
Packages=libnss-myhostname/forky
         libnss-mymachines/forky
         libnss-systemd/forky
         libpam-systemd/forky
         libsystemd-shared/forky
         libsystemd0/forky
         libudev1/forky
         systemd/forky
         systemd-cryptsetup/forky
         systemd-resolved/forky
         systemd-sysv/forky
         systemd-timesyncd/forky
         systemd-tpm/forky
         udev/forky

# Debian-trusted Secure Boot boot chain material -- stays on the trixie
# release (NOT forky) since these carry Debian's actual Secure Boot
# signatures for THIS release; shared/firn-installer/tools/build-iso.sh
# pulls the signed binaries straight out of this built tree.
#   - shim-signed: EFI/BOOT/BOOTX64.EFI (Microsoft-signed).
#   - grub-efi-amd64-signed: the monolithic Debian-signed grub2 EFI image.
#   - shim-helpers-amd64-signed: MokManager (mmx64.efi) + the fallback
#     loader (fbx64.efi), Debian-signed. NOT shipped by shim-signed itself.
#   - linux-image-amd64: stock trixie kernel, confirmed Debian-signed
#     ("Debian Secure Boot Signer 2022 - linux" / "Debian Secure Boot CA",
#     verified via sbverify against the real .deb) -- not backports, whose
#     signed status was not independently verified for this task.
#   - mokutil: firn's A/B mok-stage step declares it (preflight contract);
#     also used by the boot-chain proof itself (mokutil --sb-state inside
#     the guest).
#   - sbsigntool: provides sbverify, which firn's bootc esp-stage step
#     declares (preflight contract) to verify the MOK-signed second stage
#     and shim/MokManager signatures before staging them (firn ADR-0014,
#     secure-install schema-1).
Packages=shim-signed
         grub-efi-amd64-signed
         shim-helpers-amd64-signed
         linux-image-amd64
         mokutil
         sbsigntool

# Console/VT tooling: kbd provides chvt, which firn-kiosk.service uses to
# bring tty1 to the foreground so the TUI renders on the visible VGA VT
# (systemd opens the tty but does not activate the VT; without this the
# graphical console shows kernel output, then nothing, while firn draws
# to an unshown VT -- root-caused on the incus demo, 2026-08-12).
Packages=kbd

# Networking (brief: NetworkManager-based). A TUI installer still needs
# Wi-Fi to be at least configurable from the console -- nmcli +
# wpasupplicant cover that on machines with no wired NIC; openssh-server
# stays for the SSH proof/debug path (contract §8) alongside serial login.
Packages=network-manager
         wpasupplicant
         iproute2
         iputils-ping
         openssh-server

# Storage tools for firn's partition/format/encrypt steps (preflight
# contract: sfdisk wipefs partprobe mkfs.ext4/e2fsck mkfs.fat mkfs.btrfs
# cryptsetup xz). sfdisk was WRONGLY assumed to ship via util-linux
# (already essential, not listed explicitly) -- root-caused live
# (test/native-installer-e2e-test.sh's first real boot,
# 2026-07-15): on current Debian, `sfdisk`/`fdisk`/`cfdisk` were split out
# of util-linux into a separate `fdisk` package (confirmed via `dpkg -S
# /usr/sbin/sfdisk` -> `fdisk`, and via the built rootfs's own
# manifest, which had util-linux but no fdisk package at
# all). Without it, the installer's own startup tool-check
# died immediately with "required command not found: sfdisk" on every real
# boot -- the installer could never have partitioned a real disk.
# parted: partprobe's Debian home (confirmed `dpkg -S /usr/sbin/partprobe`
# -> parted) -- firn's partition step declares partprobe; same
# split-out-of-util-linux class as the sfdisk incident above.
# btrfs-progs: mkfs.btrfs + btrfs, declared by firn's format steps when a
# recipe picks btrfs (the single ISO must satisfy every recipe the wizard
# can produce, not just the default ext4 path).
# openssl (the CLI, not just the libssl3 library many other packages
# already pull in transitively) is required directly -- firn's A/B
# mok-stage step declares it (recovery passphrase generation and MOK
# certificate DER conversion, ported from snosi-install) -- and was
# not confirmed present by any other listed package's dependency chain, so
# listed explicitly rather than risk a real-boot iteration to find out.
Packages=fdisk
         parted
         cryptsetup
         xz-utils
         e2fsprogs
         dosfstools
         btrfs-progs
         openssl

# login(1) + /etc/pam.d/login for the serial/console root login path the
# RootPassword=hashed: comment above promises (contract §8 names serial login
# as a boot-chain proof path). Nothing else in this hand-picked set pulls it
# in: without it agetty prompts "login:", execs the missing /bin/login, and
# exits -- the getty respawns silently forever with no password prompt and no
# error (found on the first HUMAN console login attempt, 2026-07-16; the e2e
# harness only ever enters via SSH keys, so it never exercised this path).
# Still load-bearing here: firn-kiosk.service's OnFailure= hands the console
# back to a getty after three crashes, and that getty must be able to log in.
Packages=login

# OpenPGP verification (firn's fetch-index step declares gpgv against the
# pubring shipped below -- signed index verification, contract §4).
# binutils (objcopy) is declared by firn's tpm-enroll step: it dumps the
# .pcrpkey PE section straight out of the just-written disk's own UKI to
# enroll TPM unlock (ported from snosi-install's
# extract_pcrpkey_from_disk(); its absence was caught by the same real
# boot as the sfdisk incident, 2026-07-15: "required command not found:
# objcopy" was the NEXT tool-check failure once sfdisk was fixed).
Packages=gpgv
         binutils

# ca-certificates is what makes TLS verification against the real
# https://repository.frostyard.org origin work -- for firn's own Go
# http client (crypto/x509 reads /etc/ssl/certs/ca-certificates.crt) and
# for podman/skopeo registry pulls alike. Nothing else in this hand-picked
# set ships the trust bundle, and no e2e with a plain-HTTP local fixture
# origin can catch its absence (the class of gap found live 2026-07-16 with
# curl error 77 on the first install against the published origin).
# curl/jq are gone: they were snosi-install's (bash) HTTP/JSON tools; firn
# does both natively in Go.
Packages=ca-certificates
# The firn installer binary itself, from the frostyard apt repo
# (mkosi.sandbox/.../frostyard.sources -> repository.frostyard.org,
# published by firn's release via repogen). This is the CI source of firn
# per firn ADR-0010/0027/0028: no sibling firn checkout is needed at build
# time (the old `just _firn-binary` local build still overrides it via the
# tree ExtraTrees below, for dev testing of unreleased firn). Installs to
# /usr/bin/firn, which the postinst guard checks for.
Packages=frostyard-firn
# mount/umount live in the 'mount' package (separate from util-linux, whose
# agetty/lsblk/etc. ARE present). firn's mount-target/tpm-enroll/seed-var
# steps declare mount/umount (mounting the target root, the ESP to read the
# just-written UKI, and var for seeding).
# It WAS transitively present when test/native-installer-e2e-test.sh went
# 75/75 (2026-07-15) and had vanished from a rebuild one day later ("mount:
# command not found" mid-install, first human run 2026-07-16) -- a moving
# forky-suite dependency shuffle, the same class of drift that dropped
# systemd-measure from the tools tree. Anything the installer executes must
# be listed EXPLICITLY, never assumed from a dependency chain; firn's
# preflight tool-check also covers it.
Packages=mount

# tzdata: firn's TUI timezone page validates and suggests zone names by
# reading /usr/share/zoneinfo directly (internal/tui/wizard.go); without
# the package the picker silently degrades to format-only validation. The
# GUI-era locales/xkb-data picker files are gone with the GUI: firn
# validates locale strings by pattern, not against /usr/share/i18n.
Packages=tzdata

# Hardware firmware for network installs on real machines (not virtio-only
# QEMU fixtures): the installer boots on whatever NIC/storage controller the
# target machine has, before any product-specific package set is involved,
# so it needs its own copy of the same firmware policy the product images
# ship (shared/kernel/stock/mkosi.conf's firmware-* list, mirrored here --
# this profile deliberately has no Dependencies= on any product/kernel
# fragment, so it cannot just Include= that file without pulling in the
# stock kernel package/module machinery this profile doesn't want) plus the
# network-adapter-specific extras from shared/packages/snow and
# shared/packages/cayo (firmware-ath9k-htc/-carl9170/-zd1211 for USB Wi-Fi
# dongles, firmware-ast for server BMC/IPMI KVM video consoles). GPU/mesa
# rendering packages are deliberately excluded -- this is a text/SSH
# installer with no display server, so display firmware alone (already
# covered by firmware-amd-graphics/-intel-graphics/-nvidia-graphics/-cirrus/
# -ast above) is enough to keep BMC/laptop consoles usable, without the
# rendering userspace stack.
Packages=firmware-linux-free
         firmware-linux-nonfree
         firmware-linux
         firmware-amd-graphics
         firmware-atheros
         firmware-bnx2
         firmware-bnx2x
         firmware-brcm80211
         firmware-cavium
         firmware-cirrus
         firmware-intel-graphics
         firmware-intel-misc
         firmware-intel-sound
         firmware-iwlwifi
         firmware-libertas
         firmware-marvell-prestera
         firmware-mediatek
         firmware-misc-nonfree
         firmware-myricom
         firmware-netronome
         firmware-netxen
         firmware-nvidia-graphics
         firmware-qlogic
         firmware-realtek
         firmware-siano
         firmware-ast
         firmware-ath9k-htc
         firmware-carl9170
         firmware-zd1211
         atmel-firmware
         bluez-firmware

# bootc-family payload (firn ADR-0010: the single medium carries BOTH
# families' tools; firn's bootc-install step declares podman + skopeo, its
# sysconfig step declares useradd/chpasswd -- the passwd package, which is
# Priority: required but NOT Essential, so per the forky-drift rule
# ("mount" incident above) it is listed rather than assumed present the
# way the login incident proved required-but-not-essential packages can be
# absent from a hand-picked mkosi install).
Packages=podman
         skopeo
         passwd

# A/B + shared flatpak payload: firn's flatpaks step declares the flatpak
# CLI whenever a recipe requests flatpaks; the wizard offers the full
# catalog from this one medium, so it must always be present.
Packages=flatpak

# ADR-0006 media obligation (offline flatpak seed) -- Option A, "data area,
# NOT initramfs": the seed does NOT land here as an ExtraTrees=/postinst step,
# because this whole rootfs is packed as the all-in-RAM initramfs
# (build-iso.sh) and a multi-GiB core-apps+runtime seed would blow the tmpfs
# RAM budget. Instead:
#   1. `just firn-flatpak-seed` builds a standalone flatpak system installation
#      tree (the shared/firn-installer/core.json apps + their runtimes) OUTSIDE
#      this rootfs, into output/firn-flatpak-seed.
#   2. build-iso.sh squashes that tree into a firn-flatpak-seed.squashfs DATA
#      AREA on the ISO9660 filesystem, alongside (not inside) the initramfs.
#   3. At boot, firn-flatpak-seed.service (shipped in the tree below) loop-mounts
#      that squashfs read-only at /var/lib/flatpak BEFORE firn runs, so firn's
#      flatpak step copies it into the target (internal/flatpak/flatpak.go).
# The seed is OPTIONAL: a seedless ISO still boots and firn downloads flatpaks
# over the network at install time (ADR-0006 report-don't-fail). The `flatpak`
# package below is what makes `flatpak list --system` work against the mounted
# seed -- it must always be present regardless of whether a seed is embedded.

# firn TUI installer payload: the kiosk units + enablement wants links
# (shared/firn-installer/tree; units are verbatim copies from firn's
# dist/, see shared/firn-installer/README.md), the firn binary itself
# (built into tree/usr/bin/firn by `just _firn-binary` -- gitignored, see
# README.md), plus the committed dev signed-index pubring and MOK
# certificate firn verifies against -- single canonical copies
# (docs/native-ab-contracts.md §7, shared/native-ab/keys/README.md), never
# duplicated into this tree. /usr/lib/snosi/os-update-pubring.gpg is the
# first entry in firn's pubring search order (firn internal/trust).
ExtraTrees=%D/shared/firn-installer/tree
# The core flatpak list firn reads for core_flatpaks on composefs images,
# whose /usr is not readable at install time (firn's fallback,
# InstallerCoreJSONPath). The frostyard-firn package does not ship it, so
# provision the vendored copy here at build time — the CI equivalent of
# what `just _firn-binary` copies into the tree for local builds.
ExtraTrees=%D/shared/firn-installer/core.json:/usr/share/firn/core-flatpaks.json
ExtraTrees=%D/shared/native-ab/keys/import-pubring.gpg:/usr/lib/snosi/os-update-pubring.gpg
ExtraTrees=%D/shared/native-ab/keys/mok-2026.crt:/usr/lib/snosi/mok.crt
# The installable-product catalog. Firn ADR-0010 puts the catalog on the
# media side (snosi), and firn reads /etc/firn/catalog.json as a wholesale
# override of its compiled-in list -- shipping it here means adding a
# product to the picker is a snosi change, not a firn release. Must list
# EVERY product (override replaces, never merges) and must satisfy firn's
# checkCatalog rules: bootc entries carry ref + cosign_pub_key and no
# product; ab entries carry product and no ref/key.
ExtraTrees=%D/shared/firn-installer/catalog.json:/etc/firn/catalog.json
# The snosi image-signing public key at the path every bootc catalog entry
# names as cosign_pub_key (same canonical-copy provisioning as
# shared/bootc-secure/mkosi.conf).
ExtraTrees=%D/cosign.pub:/usr/lib/snosi/cosign.pub

# Pinned cosign CLI: firn's preflight requires the `cosign` tool for every
# catalog entry with a cosign_pub_key (see the script header). jq is
# build-only: verified_download() parses the checksum metadata with it,
# and nothing on the shipped medium needs it.
BuildScripts=%D/shared/firn-installer/scripts/build/cosign.chroot
# Build-only: verified_download() needs jq (checksum metadata) and
# curl + CA trust (the download itself); nothing on the shipped medium
# needs any of them.
BuildPackages=jq
              curl
              ca-certificates

PostInstallationScripts=%D/shared/firn-installer/postinst/mkosi.postinst.chroot
