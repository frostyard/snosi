# snosi: select the Omarchy plymouth theme, vendored to
# /usr/share/plymouth/themes/omarchy/ by
# shared/flurry/scripts/build/omarchy.chroot. Shipped via ExtraTrees, which
# overwrites the package conffile AFTER dpkg finishes -- never ship this
# file via SkeletonTrees: a pre-existing conffile makes dpkg prompt at
# plymouth's install and the build dies at EOF on non-interactive stdin.
[Daemon]
Theme=omarchy
ShowDelay=0
DeviceTimeout=8
