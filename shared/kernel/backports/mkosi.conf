[Content]
# Suite-neutral firmware packages: they install from trixie or forky unchanged.
# Everything that names a suite lives in a matched file: trixie.conf holds the
# `trixie-backports`-suffixed pins and trixie's forky kernel, forky.conf holds
# the plain forky packages (ADR-0037). mkosi has no list-item removal, so a
# suite-specific package must sit in the file that matches the suite.
Packages=atmel-firmware
  bluez-firmware
  dahdi-firmware-nonfree
  intel-media-va-driver-non-free
  firmware-linux-free

[Include]
Include=%D/shared/kernel/backports/trixie.conf
Include=%D/shared/kernel/backports/forky.conf
