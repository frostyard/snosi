[Content]
# Generic amd64 kernel, firmware, and mesa userspace from the base release.
# On forky the archive's own kernel (7.1.x) and mesa (26.x) are already the
# current ones -- there is no backports suffix to chase (forky-backports
# exists but is empty), so this single fragment serves cayo, snow, and the
# native A/B profiles alike. Surface hardware uses shared/kernel/surface.
Packages=linux-image-amd64
  atmel-firmware
  bluez-firmware
  dahdi-firmware-nonfree
  intel-media-va-driver-non-free
  firmware-linux-free
  firmware-linux-nonfree
  firmware-linux
  firmware-amd-graphics
  firmware-atheros
  firmware-bnx2
  firmware-bnx2x
  firmware-brcm80211
  firmware-cavium
  firmware-cirrus
  firmware-intel-graphics
  firmware-intel-misc
  firmware-intel-sound
  firmware-iwlwifi
  firmware-libertas
  firmware-marvell-prestera
  firmware-mediatek
  firmware-misc-nonfree
  firmware-myricom
  firmware-netronome
  firmware-netxen
  firmware-nvidia-graphics
  firmware-qlogic
  firmware-realtek
  firmware-siano
  libegl-mesa0
  libgbm1
  libgl1-mesa-dri
  libglx-mesa0
  # mesa >= 25.2.8-3 folds the VA-API/VDPAU drivers into mesa-libgallium
  # (Breaks/Replaces: mesa-va-drivers, mesa-vdpau-drivers); forky's
  # mesa-va-drivers / mesa-vdpau-drivers are empty transitional packages,
  # so they are deliberately not listed.
  mesa-libgallium
  mesa-vulkan-drivers
