[Match]
Release=forky

[Content]
# Forky is the source of its own firmware and mesa: the same packages as
# trixie.conf, without a suite suffix, because forky-backports is not the
# source and no pin is needed (ADR-0037).
Packages=firmware-linux-nonfree
  firmware-linux
  firmware-amd-graphics
  firmware-atheros
  firmware-bnx2
  firmware-bnx2x
  firmware-brcm80211
  firmware-cavium
  firmware-cirrus
  firmware-intel-graphics
  firmware-intel-misc
  firmware-intel-sound
  firmware-iwlwifi
  firmware-libertas
  firmware-marvell-prestera
  firmware-mediatek
  firmware-misc-nonfree
  firmware-myricom
  firmware-netronome
  firmware-netxen
  firmware-nvidia-graphics
  firmware-qlogic
  firmware-realtek
  firmware-siano
  libegl-mesa0
  libgbm1
  libgl1-mesa-dri
  libglx-mesa0
  # mesa >= 25.2.8-3 folds the VA-API/VDPAU drivers into mesa-libgallium
  # (Breaks/Replaces: mesa-va-drivers, mesa-vdpau-drivers); the trixie.conf
  # note about the unsatisfiable trixie-backports pin does not apply here.
  mesa-libgallium
  mesa-vulkan-drivers
