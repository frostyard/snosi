[Content]
# kernel and modules
# The linux-surface packages come from pkg.surfacelinux.com (suite
# `release`) on both Debian suites, and the firmware here installs from
# trixie or forky unchanged. Everything that names a suite lives in a matched
# file: trixie.conf holds the `trixie-backports`-suffixed pins, forky.conf
# holds the plain forky packages (ADR-0037). mkosi has no list-item removal,
# so a suite-specific package must sit in the file that matches the suite.
Packages=linux-image-surface
  linux-headers-surface
  libwacom-surface
  iptsd
  atmel-firmware
  bluez-firmware
  dahdi-firmware-nonfree
  intel-media-va-driver-non-free
  firmware-linux-free

[Include]
Include=%D/shared/kernel/surface/trixie.conf
Include=%D/shared/kernel/surface/forky.conf
