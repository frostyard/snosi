[Match]
Release=forky

[Content]
# The forky bootc/libostree pair. Revalidate the complete pair before either
# selector changes (docs/bootc-secure-assembly-compatibility.md). The upstream
# bootc version equals .assembly.bootc_version of
# shared/bootc-secure/suite/forky/tree/usr/lib/snosi/bootc-secure.json.
# Forky renamed libgpgme11t64 to libgpgme45; the forky libostree depends on it.
Packages=bootc=1.17.4-frostyard202611132023~deb14
          libostree-1-1=2026.6-frostyard202611132023~deb14
          libgpgme45
