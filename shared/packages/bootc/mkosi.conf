[Content]
# OCI bootc profile requirements. Keep bootc/ostree's incomplete package
# metadata supplemented explicitly. Native A/B profiles do not include this
# fragment.
Packages=bootc
          libostree-1-1
          # cayo lacks snow's Flatpak dependency; make bcvk's target-image
          # bubblewrap requirement explicit for every OCI bootc profile.
          bubblewrap
          libcurl4t64
          libglib2.0-0t64
          # forky: libgpgme45 (trixie shipped libgpgme11t64). The Frostyard
          # libostree-1-1 deb still hard-Depends on libgpgme11t64 until
          # bootc-debian rebuilds against forky -- see docs/adr/0014.
          libgpgme45
          libarchive13t64
          libsystemd0
          zlib1g
          libfuse3-4
          libsoup-3.0-0
          liblzma5
          libzstd1
          libmount1
          libselinux1
          libcom-err2
          libext2fs2t64
