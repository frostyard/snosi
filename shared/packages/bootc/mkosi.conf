[Content]
# OCI bootc profile requirements. Keep bootc/ostree's incomplete package
# metadata supplemented explicitly. Native A/B profiles do not include this
# fragment.
#
# bootc and libostree-1-1 are one Frostyard build pair pinned exactly: secure
# assembly uses bootc's hidden storage-digest command, and these selectors
# hold the validated bootc/libostree package pair. An APT index
# advance must not swap either binary under the compatibility contract;
# revalidate the complete pair whenever either changes. See
# docs/bootc-secure-assembly-compatibility.md.
Packages=bootc=1.17.3-frostyard202611042030~deb13
          libostree-1-1=2026.6-frostyard202611042030~deb13
          # floe lacks snow's Flatpak dependency; make bcvk's target-image
          # bubblewrap requirement explicit for every OCI bootc profile.
          bubblewrap
          libcurl4t64
          libglib2.0-0t64
          libgpgme11t64
          libarchive13t64
          libsystemd0
          zlib1g
          libfuse3-4
          libsoup-3.0-0
          liblzma5
          libzstd1
          libmount1
          libselinux1
          libcom-err2
          libext2fs2t64

# Checks the pair that the image ships, in every OCI bootc build (PR mechanics
# and main secure): bootc matches the secure assembly contract, the hidden
# storage-digest command exists, and libostree-1-1 carries the ostree#3681
# static-delta fix. test/bootc-secure-static-test.sh exercises it.
FinalizeScripts=%D/shared/packages/bootc/finalize/bootc-pair.chroot
