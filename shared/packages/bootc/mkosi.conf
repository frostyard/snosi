[Content]
# OCI bootc profile requirements. Keep bootc/ostree's incomplete package
# metadata supplemented explicitly. Native A/B profiles do not include this
# fragment.
#
# bootc and libostree-1-1 are one Frostyard build pair pinned exactly: secure
# assembly uses bootc's hidden storage-digest command. An APT index advance
# must not swap either binary under the compatibility contract; revalidate the
# complete pair whenever either changes. See
# docs/bootc-secure-assembly-compatibility.md.
#
# bootc 1.17.1 with libostree 2026.5 is a CANDIDATE UNDER TEST, not a
# revalidated pair: its evidence is the secure CI build (both storage-digest
# probes) and the N-to-N+1 lab lifecycle run. Do not treat it as validated.
Packages=bootc=1.17.1-frostyard202610252315~deb13
          libostree-1-1=2026.5-frostyard202610252315~deb13
          # floe lacks snow's Flatpak dependency; make bcvk's target-image
          # bubblewrap requirement explicit for every OCI bootc profile.
          bubblewrap
          libcurl4t64
          libglib2.0-0t64
          libgpgme11t64
          libarchive13t64
          libsystemd0
          zlib1g
          libfuse3-4
          libsoup-3.0-0
          liblzma5
          libzstd1
          libmount1
          libselinux1
          libcom-err2
          libext2fs2t64
