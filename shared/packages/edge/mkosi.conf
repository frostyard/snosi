[Config]
# Desktop-app sysext: built against gui-base (base + the common GUI lib
# closure) so the delta cannot carry product-divergent GUI libraries
# (issue #781); the no-divergent-libs finalize is the matching tripwire.
Dependencies=gui-base

[Content]
BaseTrees=%O/gui-base

# Runtime deps from microsoft-edge-stable's Depends (installed via mkosi's
# host-side apt so dpkg -i in the postinst can install the patched .deb).
# libcurl4-gnutls: forky dropped the libcurl3-gnutls compatibility name (the
# deb accepts libcurl3-gnutls | libcurl3-nss | libcurl4 | libcurl3).
Packages=ca-certificates
         fonts-liberation
         libasound2t64
         libatk-bridge2.0-0
         libatk1.0-0
         libatspi2.0-0
         libcairo2
         libcups2
         libcurl4-gnutls
         libdbus-1-3
         libexpat1
         libgbm1
         libglib2.0-0
         libgtk-3-0
         libnspr4
         libnss3
         libpango-1.0-0
         libudev1
         libuuid1
         libvulkan1
         libx11-6
         libxcb1
         libxcomposite1
         libxdamage1
         libxext6
         libxfixes3
         libxkbcommon0
         libxrandr2
         wget
         xdg-utils
