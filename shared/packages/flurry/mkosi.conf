[Content]
BaseTrees=%O/base

# Sysext base requirements (same rationale as snow; no snow-first-setup:
# that wizard is GNOME-only -- user creation stays with the installer /
# useradd -m, both of which copy the image's /etc/skel, which the omarchy
# vendor script populates)
Packages=frostyard-chairlift

# apt is NOT in the base image -- each product profile carries it (snow and
# cayo do the same). common-postinst.sh hard-requires it for the package
# manifest, and it stays useful on a booted image for inspection
# (`apt list --installed`); the omarchy-pkg-* overrides are what steer
# users away from trying to install with it.
Packages=apt

# Igloo is an Incus-container tool, not part of Flurry.
RemovePackages=frostyard-igloo

# (The former Cinnamon RemovePackages workaround is gone: base stopped
# installing network-manager-applet in #771, which was what dragged the
# whole Cinnamon desktop in as a polkit-1-auth-agent provider. On Flurry
# the network UI is the Quickshell bar and the polkit agent is Quickshell's.)

# Plymouth
Packages=plymouth
         plymouth-themes
         plymouth-label

# Hyprland stack -- explicitly selected from trixie-backports (sandbox pins
# backports at priority 100; the /trixie-backports suffix is the opt-in,
# same mechanism as shared/kernel/backports). hyprutils/hyprlang/hyprcursor/
# aquamarine sonames resolve from backports transitively via hyprland's
# versioned Depends -- do not pin them here unless a build shows trixie
# candidates winning.
Packages=hyprland/trixie-backports
         quickshell/trixie-backports
         uwsm/trixie-backports
         hyprpicker/trixie-backports
         hyprsunset/trixie-backports
         xdg-desktop-portal-hyprland/trixie-backports
         hyprland-qtutils/trixie-backports
         hyprland-protocols/trixie-backports

# Backports closure that apt cannot pick on its own: hyprland 0.55.2 needs
# libxkbcommon >= 1.12.3, trixie ships 1.7.0, and apt never selects a
# priority-100 backports version for a TRANSITIVE dependency -- only
# explicitly suffixed packages come from backports (same reason the kernel
# fragment enumerates the mesa closure). The x11/registry siblings are
# same-source strict-versioned and must move together.
Packages=libxkbcommon0/trixie-backports
         libxkbcommon-x11-0/trixie-backports
         libxkbregistry0/trixie-backports
# xkbcli: the Quickshell bar's keyboard-layout module shells out to it.
Packages=libxkbcommon-tools/trixie-backports

# Wayland/desktop plumbing
Packages=xdg-desktop-portal
         xdg-desktop-portal-gtk
         xdg-terminal-exec
         xdg-utils
         xdg-user-dirs
         qt6-wayland
         qt6-image-formats-plugins
         qml6-module-qtquick-controls
         qml6-module-qtquick-layouts
         qml6-module-qtquick-effects
         qml6-module-qtquick-shapes
         qml6-module-qtquick-window
         libgtk4-layer-shell0
# gtk-launch: omarchy's app library starts every desktop entry via
# `uwsm-app -- gtk-launch <id>` (pinned by omarchy's own
# test/shell.d/app-search-test.sh), and several omarchy-install-* commands
# do the same. Snow inherits it from the GNOME stack; flurry must ask.
         libgtk-3-bin
         polkitd
         pkexec
         libnotify-bin
         gsettings-desktop-schemas
         libglib2.0-bin
         locales-all
         dbus-broker

# Display manager (omarchy uses SDDM with a Wayland/Hyprland greeter)
Packages=sddm

# Audio -- the whole pipewire family comes from trixie-backports, explicitly
# enumerated. Root cause (2026-08-25, first flurry build): apt's 3.0 solver
# resolves a backports package's dependencies PREFERRING same-archive
# versions, so xdg-desktop-portal-hyprland/trixie-backports selects
# libpipewire-0.3-0t64 1.4.9~bpo -- and the strictly same-versioned trixie
# pipewire family (pipewire-bin, libspa-0.2-modules, ...) then becomes
# unsatisfiable. Moving the family is the only coherent direction, and the
# strict (=) inter-package pins mean every member must be suffixed by hand
# (apt never auto-selects priority-100 versions for transitive deps).
Packages=pipewire/trixie-backports
         pipewire-audio/trixie-backports
         pipewire-alsa/trixie-backports
         pipewire-pulse/trixie-backports
         pipewire-bin/trixie-backports
         libpipewire-0.3-0t64/trixie-backports
         libpipewire-0.3-modules/trixie-backports
         libspa-0.2-modules/trixie-backports
         libspa-0.2-bluetooth/trixie-backports
         wireplumber/trixie-backports
         libwireplumber-0.5-0/trixie-backports
         alsa-utils
         alsa-ucm-conf
         alsa-topology-conf
# pactl (against pipewire-pulse): omarchy-audio-output-sink/-switch drive
# output switching from the bar with it.
Packages=pulseaudio-utils

# Network / bluetooth
Packages=network-manager
         avahi-daemon
         libnss-mdns
         bluez
         bluez-tools
         bolt
         wireless-regdb
         ufw

# Power / thermals / memory (upower backs the Quickshell bar's battery
# widget via Quickshell.Services.UPower)
Packages=power-profiles-daemon
         thermald
         upower
         systemd-zram-generator
         brightnessctl
         ddcutil/trixie-backports
         udiskie

# MTP device probing (graphical images only, same rationale as snow)
Packages=libmtp-runtime

# VAAPI encode/decode drivers (gpu-screen-recorder's baseline encode
# path). AMD/legacy-Intel VAAPI needs NO extra package here: mesa >=
# 25.2.8-3 folds the VA-API drivers into mesa-libgallium (see
# shared/kernel/backports/mkosi.conf), which this image already ships from
# trixie-backports -- and mesa-va-drivers no longer exists at that
# version, so never re-add it. intel-media-va-driver-non-free (modern
# Intel) currently arrives via the multimedia stack, but it is
# load-bearing for screen recording, so pin it explicitly rather than
# trusting the transitive pull to persist.
Packages=intel-media-va-driver-non-free

# inxi: omarchy-debug embeds `inxi -Farz` in its report; present in trixie,
# was silently missing (2026-08-26 skipped-apps audit).
Packages=inxi

# Printing (CUPS)
Packages=cups
         cups-browsed
         cups-client
         cups-filters
         printer-driver-cups-pdf
         cups-pk-helper
         ipp-usb
         system-config-printer

# Input method (omarchy uses fcitx5 for XCompose/emoji sequences)
Packages=fcitx5
         fcitx5-frontend-gtk3
         fcitx5-frontend-gtk4
         fcitx5-frontend-qt6

# Additional firmware
Packages=firmware-ast
         firmware-ath9k-htc
         firmware-carl9170
         firmware-sof-signed
         firmware-zd1211

# GUI applications (omarchy-base.packages mapped to Debian; pinta is gone
# from Debian (Mono), localsend/moonlight-qt/obsidian have no deb -- all
# deferred to flatpak)
Packages=chromium
         nautilus
         python3-nautilus
         gnome-sushi
         gnome-disk-utility
         evince
         imv
         mpv
         mpv-mpris
         libreoffice
         obs-studio
         kdenlive
         xournalpp
         gnome-keyring
         libpam-gnome-keyring
         libsecret-1-0
         gvfs-backends
         gvfs-fuse
         ffmpegthumbnailer
         webp-pixbuf-loader
         gnome-themes-extra
         yaru-theme-icon
# SVG gdk-pixbuf loader: Yaru/Adwaita icons are almost entirely SVG, and
# without this loader GTK silently falls back to scaling the few tiny PNGs
# around -- every Nautilus/GTK icon renders as a blur. It is only a
# Recommends of the GTK stack (mkosi installs without Recommends); snow
# inherits it through the GNOME meta packages, flurry must ask.
         librsvg2-common
         flatpak

# Terminals (foot is omarchy's default; ghostty comes from the griffo
# sandbox repo, same as snow)
Packages=foot
         alacritty
         kitty
         ghostty

# CLI toolset (lazydocker and neovim >= 0.12 come from the griffo repo;
# tealdeer provides tldr)
Packages=bash-completion
         bat
         btop
         eza
         fastfetch
         fd-find
         fzf
         git
         gum
         imagemagick
         inotify-tools
         jq
         lazygit
         lazydocker
         less
         man-db
         neovim
         plocate
         qrencode
         ripgrep
         socat
         starship
         tealdeer
         tesseract-ocr
         tesseract-ocr-eng
         tmux
         tree-sitter-cli
         unzip
         whois
         wl-clipboard
         wtype
         grim
         slurp
         yt-dlp
         zbar-tools
         zoxide

# Console login: /bin/login comes from the `login` package (shadow suite),
# which base does NOT ship -- snow and cayo carry it in their parity
# blocks. Without it every serial/VT getty dies with "can't exec
# /bin/login: No such file or directory", discovered live when a broken
# graphical session made the console the only door (2026-08-25).
Packages=login

# Filesystems
Packages=dosfstools
         exfatprogs

# Fonts (JetBrainsMono Nerd Font and omarchy's icon font are vendored by
# the flurry build scripts; Debian side below)
Packages=fonts-noto-core
         fonts-noto-cjk
         fonts-noto-color-emoji
         fonts-font-awesome

# Containers (podman for distrobox parity with snow; docker itself is a
# sysext on snosi -- deliberately NOT installed in the image)
Packages=podman
         distrobox
