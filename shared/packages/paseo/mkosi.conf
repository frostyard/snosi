[Content]
# List only packages missing from base. mkosi 00c7f0bc8 reinstalls every
# Overlay=yes Packages= entry and keeps its files in the delta.
# sysext-no-base-owned.sh rejects copies that would shadow base files.
# The postinst's dpkg -i finds the other Depends in base.
# Omit libappindicator3-1: it is only a Recommends and is not in trixie.
Packages=libatspi2.0-0
         libgtk-3-0
         libnotify4
         libsecret-1-0
         libxss1
         libxtst6
         # A sysext-shipped GdkPixbuf loaders.cache shadows Snow's base cache.
         # Keep SVG registered so GNOME's Adwaita icons remain renderable.
         librsvg2-common
         xdg-utils
