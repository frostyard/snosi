[Match]
Release=trixie

[Content]
# Trixie-only packages of the Snow and Snowfield package list. Forky ships
# none of them under these names, and mkosi has no way to remove a list item,
# so they live here, not in the shared mkosi.conf (ADR-0037).
# libpeas-1.0-0 and libraw23t64 have forky successors (forky.conf). The
# others have none: forky dropped the VDPAU-to-VA-API wrapper and the VDPAU
# driver metapackage, the X.Org qxl and vmware drivers, libxatracker2 and
# packagekit-tools (forky's packagekit ships pkgcli in place of pkcon).
Packages=libpeas-1.0-0
         libraw23t64
         libvdpau-va-gl1
         libxatracker2
         packagekit-tools
         vdpau-driver-all
         xserver-xorg-video-qxl
         xserver-xorg-video-vmware
