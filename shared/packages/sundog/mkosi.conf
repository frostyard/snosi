[Content]
BaseTrees=%O/base

# Core Frostyard integration. snow-first-setup is GNOME-specific; Firn owns
# user creation and first-install choices for this bootc-only profile.
Packages=frostyard-chairlift
RemovePackages=frostyard-igloo

# Plasma 6, Wayland-only compositor, and SDDM/Breeze. kde-plasma-desktop
# provides Plasma's core applications; selected daily-use applications are
# explicit because mkosi does not install Debian Recommends. Gwenview,
# Okular, KCalc and Skanpage come from the core Flatpak set
# (flatpaks/sundog.json), not native packages.
Packages=kde-plasma-desktop
         kwin-wayland
         sddm
         sddm-theme-breeze
         plasma-nm
         plasma-pa
         kscreen
         powerdevil
         polkit-kde-agent-1
         libpam-kwallet5
         xdg-desktop-portal-kde
         qt6-wayland
         dolphin
         dolphin-plugins
         kio-extras
         kio-fuse
         ark
         kate
         konsole
         kde-spectacle
         kdeconnect

# Executable helpers are split from their libraries into Recommends. Keep
# them explicit even when another selected application depends on them.
Packages=libkf6kcmutils-bin
         libbaloowidgets-bin

# Desktop editing, locking, monitoring, and deterministic English spelling.
Packages=kmenuedit
         keditbookmarks
         kde-config-screenlocker
         ksystemstats
         plasma-systemmonitor
         sonnet6-plugins
         hunspell-en-us

# Dolphin video/document previews and additional Qt image formats.
# kimageformat6-plugins (AVIF, HEIF, JPEG XL, RAW and more for every native
# Qt application) came through native Gwenview, so it is explicit now that
# Gwenview is a Flatpak.
Packages=ffmpegthumbs
         kdegraphics-thumbnailers
         qt6-image-formats-plugins
         kimageformat6-plugins

# Wallet management supplements the login-time PAM integration above.
Packages=kwalletmanager

# GTK settings and Preview; Plasma's GTK settings module manages XSettings.
Packages=kde-config-gtk-style
         kde-config-gtk-style-preview
         breeze-gtk-theme
         xsettingsd

# Thunderbolt settings use the existing bolt hardware service.
Packages=plasma-thunderbolt

# Info Center's probe commands are Recommends, so select them explicitly.
# iproute2 and pciutils are already supplied by base.
Packages=kinfocenter
         aha
         clinfo
         dmidecode
         libdisplay-info-bin
         mesa-utils
         pulseaudio-utils
         vulkan-tools
         wayland-utils

# Offline Help. Other shipped KDE applications bundle their English manuals.
Packages=khelpcenter
         dolphin-doc
         plasma-desktop-doc
         plasma-workspace-doc

# Flatpak is the graphical application-management boundary. Discover ships
# only its Flatpak backend: Debian bundles the PackageKit backend plugin in
# plasma-discover itself, so sundog.postinst.chroot strips it (fail-closed)
# rather than offering mutable host package installation.
Packages=flatpak
         plasma-discover-backend-flatpak
         kde-config-flatpak

# KDE-matched boot experience.
Packages=plymouth
         plymouth-label
         plymouth-theme-breeze

# Desktop notifications used by the bootc update and /etc drift reporters.
Packages=libnotify-bin

# Wayland application forwarding over SSH (`waypipe ssh host app`); needed
# on both ends, matching Snow.
Packages=waypipe

# Every package in gui-base must be present in every desktop product's
# closure so desktop-app sysext deltas cannot shadow a product's libraries.
# Keep this explicit block in sync with mkosi.images/gui-base/mkosi.conf.
Packages=libgtk-3-0t64
         libgdk-pixbuf-2.0-0
         libpango-1.0-0
         libpangocairo-1.0-0
         libcairo-gobject2
         libcairo-script-interpreter2
         libatk1.0-0t64
         libatk-bridge2.0-0t64
         libatspi2.0-0t64
         libepoxy0
         libharfbuzz0b
         libharfbuzz-subset0
         libgtk-4-1
         libgtk-4-common
         libadwaita-1-0
         libgraphene-1.0-0
         libxcomposite1
         libxcb-shape0
         libxkbfile1
         libxdamage1
         libxfixes3
         libxrandr2
         libxcursor1
         libxi6
         libxinerama1
         libxtst6
         libwayland-client0
         libwayland-cursor0
         libwayland-egl1
         libxkbcommon0
         libxkbcommon-x11-0
         libgbm1
         libgl1
         libegl1
         libgles2
         mesa-libgallium
         libvulkan1
         mesa-vulkan-drivers
         libva2
         libva-drm2
         libasound2t64
         libpipewire-0.3-0t64
         libpulse0
         libnotify4
         libsecret-1-0
         libcups2t64
         libevdev2
         libinput10
         libwebkit2gtk-4.1-0
         libglib2.0-bin
         libglib2.0-data
         libnuma1
         xdg-desktop-portal
         xdg-desktop-portal-gtk

# Audio, hardware integration, and power policy follow Snow's desktop
# baseline while Plasma supplies the user-facing controls.
Packages=pipewire
         pipewire-audio
         alsa-topology-conf
         alsa-ucm-conf
         network-manager
         network-manager-l10n
         avahi-daemon
         libnss-mdns
         bluez
         bluedevil
         bolt
         tuned
         tuned-ppd
         switcheroo-control
         upower
         systemd-zram-generator
         libmtp-runtime
         gvfs-backends
         gvfs-fuse

# Printing and scanning. print-manager's recommended backend and udev
# helpers must be explicit because mkosi skips Debian Recommends. The
# scanning app is the Skanpage Flatpak; libsane1 owns the host's scanner
# udev rules and hwdb, so keep it explicit (base's sane-utils also needs it).
Packages=cups
         cups-browsed
         cups-client
         cups-core-drivers
         cups-daemon
         cups-filters
         cups-filters-core-drivers
         cups-ipp-utils
         cups-pk-helper
         cups-server-common
         ipp-usb
         print-manager
         system-config-printer-common
         system-config-printer-udev
         libsane1

# Firmware beyond the base/kernel closure.
Packages=firmware-ast
         firmware-ath9k-htc
         firmware-carl9170
         firmware-sof-signed
         firmware-zd1211

# Fonts and input methods. Noto core supplies technical glyph coverage used
# by terminal UIs; fcitx5 is Plasma's native input-method path. Plasma starts
# Fcitx through its Virtual Keyboard integration, so im-config is deliberately
# absent: its session-wide GTK_IM_MODULE/QT_IM_MODULE exports conflict with the
# native Wayland text-input path. XWayland support is supplied by fcitx5 itself.
Packages=fonts-dejavu
         fonts-dejavu-extra
         fonts-noto-color-emoji
         fonts-noto-core
         fonts-noto-mono
         fcitx5
         kde-config-fcitx5
         fcitx5-frontend-gtk3
         fcitx5-frontend-gtk4
         fcitx5-frontend-qt6

# Containers and developer workstation plumbing retained from Snow.
Packages=systemd-container
         frostyard-intuneme
         podman
         distrobox
         aardvark-dns
         buildah
         catatonit
         containernetworking-plugins
         containers-storage
         criu
         crun
         fuse-overlayfs
         slirp4netns
         passt

# Host utilities. apt is retained for inspection,
# not runtime mutation; bootc and Flatpak remain the update/install paths.
Packages=apt
         cryptsetup
         cryptsetup-bin
         login
         locales-all
         man-db
         sshfs
         xdg-user-dirs
         xdg-utils
