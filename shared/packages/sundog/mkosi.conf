[Content]
BaseTrees=%O/base

# Core Frostyard integration. snow-first-setup is GNOME-specific; Firn owns
# user creation and first-install choices for this bootc-only profile.
Packages=frostyard-chairlift
RemovePackages=frostyard-igloo

# Plasma 6, Wayland-only compositor, and SDDM/Breeze. kde-plasma-desktop
# provides Plasma's core applications; selected daily-use applications are
# explicit because mkosi does not install Debian Recommends.
Packages=kde-plasma-desktop
         kwin-wayland
         sddm
         sddm-theme-breeze
         plasma-nm
         plasma-pa
         kscreen
         powerdevil
         polkit-kde-agent-1
         libpam-kwallet5
         xdg-desktop-portal-kde
         qt6-wayland
         dolphin
         dolphin-plugins
         kio-extras
         kio-fuse
         ark
         kate
         konsole
         okular
         gwenview
         kde-spectacle
         kcalc
         kdeconnect

# Flatpak is the graphical application-management boundary. Discover ships
# only its Flatpak backend: no PackageKit backend that could imply mutable
# host package installation.
Packages=flatpak
         plasma-discover-backend-flatpak
         kde-config-flatpak

# KDE-matched boot experience.
Packages=plymouth
         plymouth-label
         plymouth-theme-breeze

# Desktop notifications used by the bootc update and /etc drift reporters.
Packages=libnotify-bin

# Every package in gui-base must be present in every desktop product's
# closure so desktop-app sysext deltas cannot shadow a product's libraries.
# Keep this explicit block in sync with mkosi.images/gui-base/mkosi.conf.
Packages=libgtk-3-0t64
         libgdk-pixbuf-2.0-0
         libpango-1.0-0
         libpangocairo-1.0-0
         libcairo-gobject2
         libcairo-script-interpreter2
         libatk1.0-0t64
         libatk-bridge2.0-0t64
         libatspi2.0-0t64
         libepoxy0
         libharfbuzz0b
         libharfbuzz-subset0
         libgtk-4-1
         libgtk-4-common
         libadwaita-1-0
         libgraphene-1.0-0
         libxcomposite1
         libxcb-shape0
         libxkbfile1
         libxdamage1
         libxfixes3
         libxrandr2
         libxcursor1
         libxi6
         libxinerama1
         libxtst6
         libwayland-client0
         libwayland-cursor0
         libwayland-egl1
         libxkbcommon0
         libxkbcommon-x11-0
         libgbm1
         libgl1
         libegl1
         libgles2
         mesa-libgallium
         libvulkan1
         mesa-vulkan-drivers
         libva2
         libva-drm2
         libasound2t64
         libpipewire-0.3-0t64
         libpulse0
         libnotify4
         libsecret-1-0
         libcups2t64
         libevdev2
         libinput10
         libwebkit2gtk-4.1-0
         libglib2.0-bin
         libglib2.0-data
         libnuma1
         xdg-desktop-portal
         xdg-desktop-portal-gtk

# Audio, hardware integration, and power policy follow Snow's desktop
# baseline while Plasma supplies the user-facing controls.
Packages=pipewire
         pipewire-audio
         alsa-topology-conf
         alsa-ucm-conf
         network-manager
         network-manager-l10n
         avahi-daemon
         libnss-mdns
         bluez
         bluedevil
         bolt
         tuned
         tuned-ppd
         switcheroo-control
         upower
         systemd-zram-generator
         libmtp-runtime
         gvfs-backends
         gvfs-fuse

# Printing and scanning.
Packages=cups
         cups-browsed
         cups-client
         cups-core-drivers
         cups-daemon
         cups-filters
         cups-filters-core-drivers
         cups-ipp-utils
         cups-pk-helper
         cups-server-common
         ipp-usb
         print-manager
         skanpage

# Firmware beyond the base/kernel closure.
Packages=firmware-ast
         firmware-ath9k-htc
         firmware-carl9170
         firmware-sof-signed
         firmware-zd1211

# Fonts and input methods. Noto core supplies technical glyph coverage used
# by terminal UIs; fcitx5 is Plasma's native input-method path. Plasma starts
# Fcitx through its Virtual Keyboard integration, so im-config is deliberately
# absent: its session-wide GTK_IM_MODULE/QT_IM_MODULE exports conflict with the
# native Wayland text-input path. XWayland support is supplied by fcitx5 itself.
Packages=fonts-dejavu
         fonts-dejavu-extra
         fonts-noto-color-emoji
         fonts-noto-core
         fonts-noto-mono
         fcitx5
         kde-config-fcitx5
         fcitx5-frontend-gtk3
         fcitx5-frontend-gtk4
         fcitx5-frontend-qt6

# Containers and developer workstation plumbing retained from Snow.
Packages=systemd-container
         frostyard-intuneme
         podman
         distrobox
         aardvark-dns
         buildah
         catatonit
         containernetworking-plugins
         containers-storage
         criu
         crun
         fuse-overlayfs
         slirp4netns
         passt

# Host utilities and the preferred terminal. apt is retained for inspection,
# not runtime mutation; bootc and Flatpak remain the update/install paths.
Packages=apt
         cryptsetup
         cryptsetup-bin
         ghostty
         login
         locales-all
         man-db
         sshfs
         xdg-user-dirs
         xdg-utils
