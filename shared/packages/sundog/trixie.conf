[Match]
Release=trixie

[Content]
# Igloo is an Incus-container tool, not part of Sundog. Keep it out even if a
# selected Frostyard package later gains a dependency on it. Forky publishes
# no frostyard-igloo, and apt fails to purge a name that no index has
# (ADR-0037).
RemovePackages=frostyard-igloo
