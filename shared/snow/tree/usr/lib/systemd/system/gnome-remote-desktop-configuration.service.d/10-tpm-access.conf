# Give only these system daemons access to the tss-owned TPM device.
# SupplementaryGroups applies at every service start, including accounts
# already persisted in /etc/group before this image update.
# Without a usable TPM, GNOME Remote Desktop retains its upstream private
# GKeyFile fallback. Do not weaken device permissions or require a TPM.
[Service]
SupplementaryGroups=tss
