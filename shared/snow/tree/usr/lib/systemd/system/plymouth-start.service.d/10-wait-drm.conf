# Wait (bounded) for the first DRM device before starting plymouthd.
# plymouthd enumerates DRM devices ONCE at startup; if the GPU driver has
# not created /dev/dri/card0 yet (probabilistic race, observed live in QEMU
# 2026-07-17: the same build flips between the graphical two-step splash
# and the text-splash fallback purely on boot timing), it permanently falls
# back to the text splash -- a later udev add event does not reliably
# upgrade an active splash. `udevadm wait` blocks until the devnode exists
# AND udev has initialized it (`udevadm settle` is NOT sufficient -- it
# returns early when the probe event has not been queued yet; same lesson
# as snosi-setup's abandoned DRM device-pull). The `-` prefix keeps a
# GPU-less or slow system booting: on timeout plymouth just starts in its
# old racy/details mode. Ships in the snow tree (desktop payload, both
# transports); harmless on bootc where initrd plymouthd is already running
# by the time this unit is considered.
[Service]
ExecStartPre=-/usr/bin/udevadm wait /dev/dri/card0 --timeout=10
#
# The second wait is a CONSOLE-HANDOFF barrier, not a second DRM probe.
# card0 appears when the DRM device is registered, which is BEFORE the
# kernel rebinds the VT layer from the dummy console to fbcon
# ("Console: switching to colour frame buffer device", emitted just before
# the driver's "fb0: <driver>drmfb" line -- so /dev/fb0 is the barrier that
# proves the takeover is done). plymouthd 24.004.60 has no NULL guards in
# its terminal path (Ubuntu LP#2103533, first fixed in 26.134.222, absent
# from every Debian suite): started inside that window it sets up its VT
# while the console is being rebound underneath it and dies with SIGSEGV,
# which fails plymouth-start.service, degrades the system and blocks
# native promotion at test-public-origin's boot smoke gate (snow, runs
# 33230153367 and 33465852243; issue #850).
#
# It is snow-only in practice because the window is kernel-config-derived:
# Debian's generic amd64 kernel (7.1.8+deb13 on trixie-backports; forky's
# 7.1.12-1 too, checked in linux-config-7.1 on 2026-09-04) builds
# CONFIG_FRAMEBUFFER_CONSOLE=y WITHOUT
# CONFIG_FRAMEBUFFER_CONSOLE_DEFERRED_TAKEOVER, so fbcon binds the moment
# virtio_gpu's fbdev registers -- measured in the smoke-test VM at t+4.95s,
# inside plymouth-start's 4.69-5.44s window, ~40ms after card0. The Surface
# kernel (6.19.8-surface-3, snowfield) sets DEFERRED_TAKEOVER=y and never
# binds fbcon during boot (only vtcon0 dummy exists at multi-user), so it
# never enters the window; cayo installs no plymouth at all.
ExecStartPre=-/usr/bin/udevadm wait /dev/fb0 --timeout=10
