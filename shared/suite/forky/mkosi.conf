[Match]
Release=forky

[Build]
# Forky build inputs for every image (ADR-0037). The Debian release is a build
# input: `mkosi --release forky` overrides the root Release= for all images, and
# this fragment then applies. Nothing here matches a trixie build, so the
# default configuration is unchanged.
# APT source and pin overrides for mkosi.sandbox. mkosi puts mkosi.sandbox
# first, and a later sandbox tree overwrites the files of an earlier one, so
# these copies win on forky.
SandboxTrees=%D/shared/suite/forky/sandbox
